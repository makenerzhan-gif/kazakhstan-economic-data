  - id: cpi_1993_02_mom_vs_ytd
    kind: inconsistent
    variable: CPI
    observations:
      - {date: "1993-02-01", value: 131.9}
    evidence: >
      Both «Цены в Казахстане в 1991-2000 гг.» (pdf p. 40) and «Цены в Казахстане за 1991-2021 годы»
      (docx table 1.3) print February 1993 m/m 131.9; the same pdf's since-December figures (January
      132.9, February 175.0, March 232.8) imply 131.7 for February and confirm March's 133.0. Chaining
      the m/m series overstates the 1993 level by 0.15-0.24% from February on (December chain 2269.8
      against the published 2265.0).
    advice: For levels use CPI_YTD (the published since-December chain); the m/m value is kept as printed.


# Known problems IN THE SOURCES, not in the pipeline (audit 2026-09-25).
#
# Every value listed here is exactly what the official file says -- the audit re-parsed
# the raw downloads independently and the pipeline reproduces them. They are kept as
# published (this repository never edits an official number), and listed here so that
# a model built on the data can exclude, dummy or bridge them knowingly.
#
# `observations` pins the values as they stood when the issue was recorded. When a
# source corrects one, scripts/build_project_knowledge.py reports the entry as
# "no longer in the data" in project_knowledge/DATA_CATALOG.md -- remove it then.
#
# kind: error       -- the published number is wrong (unit slip, copied row, misaligned cells)
#       break       -- a level or concept shift inside one series
#       inconsistent -- the number disagrees with the source's own related figures
#       preliminary -- the latest points are routinely revised far from their first print
#       caveat      -- correct, but not what the name suggests

issues:
  - id: exports_tonnage_2026_06
    kind: error
    variable: EXPORTS_VOLUME_BY_COMMODITY_GROUP
    observations:
      - {date: "2026-06-01", item: FLAT_ROLLED, value: 834661045.5532099}
      - {date: "2026-06-01", item: TOTAL, value: 848272935.0584961}
    evidence: >
      Raw bns_exports_2026-09-16.xlsx, sheet «январь-июль 2026г.», Карагандинская обл., HS 721230:
      834 461 422 t for 31.4 thousand USD (about USD 0.04 per tonne; kilograms entered as tonnes?).
      The BNS national row includes it: 848.3 Mt against 12-15 Mt in every other month.
    advice: Treat June 2026 export tonnage (FLAT_ROLLED and TOTAL) as missing. Value series (USD) are unaffected.

  - id: nbk_money_2021_12_2022
    kind: break
    variable: M3
    also: [M0, M1, M2, DEPOSITS_TOTAL]
    observations:
      - {date: "2021-12-01", value: 4500005.07139634}
      - {date: "2022-12-01", value: 20574132.3513075}
      - {date: "2023-01-01", value: 34295954.59776597}
    evidence: >
      NBK open-data form 51 (nbk_m2_2026-09-15.json): M3 4.50 trn KZT at 2021-12-01 (M0 3.34 trn), about
      19-20 trn through 2022, then 34.3 trn at 2023-01-01 (+67% in one month). M3 - M0 = DEPOSITS_TOTAL
      holds throughout, so the break is in the deposit component of the published form.
    advice: Do not use M1-M3 or DEPOSITS_TOTAL before 2023-01 without checking the NBK monetary survey.

  - id: non_oil_deficit_2021
    kind: error
    variable: NON_OIL_BUDGET_DEFICIT
    observations:
      - {date: "2021-12-31", value: 2526271.2171565}
    evidence: >
      minfin_budget_deficit_2026-08-30.xls, row «VI. NON-OIL BUDGET DEFICIT (SURPLUS)», 2021 = +2 526 271.2,
      identical to the financing row (and to minus BUDGET_DEFICIT) of the same year; 2022-2025 run -8.6 to -11.1 trn.
    advice: Treat 2021 as missing.

  - id: eurobonds_2022_q4
    kind: error
    variable: GOV_DEBT_EUROBONDS
    observations:
      - {date: "2022-10-01", value: 664800.0}
    evidence: 0.66 trn KZT against 4.10 trn the quarter before and 4.09 trn after, with no matching move in external debt.
    advice: Treat 2022-10-01 as missing or interpolate.

  - id: unemployment_rate_2019
    kind: inconsistent
    variable: UNEMPLOYMENT_RATE_BY_REGION
    observations:
      - {date: "2019-12-31", item: TOTAL, region: national, value: 3.6}
    evidence: The same table's unemployed / labour force gives 4.78% for 2019; IMF WEO has 4.8; 2018 and 2020 are 4.9.
    advice: Use 4.8 or IMF_UNEMPLOYMENT for 2019.

  - id: inflation_expectations_2022_02
    kind: error
    variable: INFLATION_EXPECTATIONS
    observations:
      - {date: "2022-02-01", value: 9.6}
    evidence: 9.6 between 16.6 (2021-12) and 18.2 (2022-03); January 2022 is absent from the source.
    advice: Treat February 2022 as missing.

  - id: subsidies_concept_2023
    kind: break
    variable: SUBSIDIES
    observations:
      - {date: "2023-12-31", value: 980720000000.0}
    evidence: >
      981 / 1 122 / 1 305 bn KZT in 2023-2025 against 382 bn in 2022; the production-account «субсидии на
      продукты» for the same years is 340 / 428 / 574 bn, so from 2023 the series is not subsidies on products,
      and NET_TAXES_ON_PRODUCTS != TAXES_ON_PRODUCTS - SUBSIDIES by 0.64-0.73 trn.
    advice: For product subsidies use the item-level production account, not SUBSIDIES, from 2023.

  - id: gdp_deflator_vintages
    kind: inconsistent
    variable: GDP_DEFLATOR
    observations:
      - {date: "2011-12-31", value: 118.9}
      - {date: "2017-12-31", value: 108.4}
      - {date: "2023-12-31", value: 111.2}
    evidence: >
      Nominal GDP ratio / volume index implies 120.5, 111.2 and 109.5 (as does the IMF deflator): the previous
      year's level was revised and the published index was not. Chain-linking the indices will not reproduce the levels.
    advice: Derive the deflator from nominal and real GDP when the two must be consistent.

  - id: gas_production_2004
    kind: error
    variable: PRODUCTION_NATURAL_BY_REGION
    observations:
      - {date: "2004-12-31", item: NATURAL_GAS, region: AKT, value: 1.8}
      - {date: "2004-12-31", item: NATURAL_GAS, region: ATY, value: 7.3}
      - {date: "2004-12-31", item: NATURAL_GAS, region: KZL, value: 0.9}
    evidence: 1000x below 2003 and 2005 (AKT 1 029 / 2 281, ATY 6 936 / 7 433, KZL 645 / 677); the national 2004 total (11 608) is correspondingly too low.
    advice: Treat 2004 regional and national gas output as missing.

  - id: fx_otc_volume_eur_scale
    kind: break
    variable: FX_OTC_VOLUME_EUR
    observations:
      - {date: "2024-07-01", value: 1724.06505769}
      - {date: "2025-09-01", value: 3316.73066392}
    evidence: The monthly volume alternates between about 3-60 and 1 000-3 400 million EUR (2024-07, 2025-04/05, 2025-08 onward) -- a unit or coverage switch in NBK form 41. FX_OTC_VOLUME_USD jumps 4.2x at 2025-10 (7.7 -> 31.9 bn).
    advice: Do not use the OTC volume levels across these months without a break dummy.

  - id: gas_exports_preliminary
    kind: preliminary
    variable: EXPORTS_VALUE_BY_COMMODITY_GROUP
    observations:
      - {date: "2026-06-01", item: NATURAL_GAS, value: 9744.941}
      - {date: "2026-07-01", item: NATURAL_GAS, value: 4838.264}
    evidence: April 2026 was first published as 7 763 thousand USD and revised to 140 929; the two latest months again show 5-10% of the usual level.
    advice: Treat the last one or two months of the commodity breakdown as preliminary.

  - id: pension_arrears_copy_forward
    kind: inconsistent
    variable: PENSION_CONTRIBUTIONS_ARREARS
    observations:
      - {date: "2025-01-01", value: 3287315.7021371904}
    evidence: The Feb-2025 bulletin gives 91 368 for 1 January 2025; the Aug-2026 bulletin 3.29 trn -- more than a year of contributions -- and its «1 July 2025» column repeats the previous edition's «1 January 2026» figures region by region.
    advice: Do not use without confirming against the Minfin/ЕНПФ publication.

  - id: gdp_nominal_ytd_preliminary
    kind: caveat
    variable: GDP_NOMINAL
    evidence: >
      Table 4439's January-March, -June and -September columns are first estimates that are never revised,
      while the fourth-quarter column is the final annual figure, so a decumulated Q4 is 35-38% of the year
      (the quarterly accounts give about 30%).
    advice: For discrete quarters use the QNA_* datasets, not GDP_NOMINAL decumulated.

  - id: poverty_headcount_definition
    kind: caveat
    variable: POVERTY_HEADCOUNT
    evidence: 89 778 persons in 2024, about 0.44% of the population -- consistent with the below-food-basket measure, not the official ~5% share below the subsistence minimum.
    advice: Check the Taldau definition (index 2928350) before using it as the poverty rate.

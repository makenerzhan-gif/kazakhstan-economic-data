  - id: nbk_banks_survey_misdated_2003_04
    kind: error
    variable: BANKS_SURVEY_HISTORY
    observations:
      - {date: "2003-05-01", item: ODC.d_a, value: 836719.0}
    evidence: >
      The records JSON of «Монетарный обзор по банкам» has no record for 2003-04 and two for 2005-04. The one with
      reporting_date 2005-04-14 carries 2003 values (domestic assets 836 719 between 816 245 at end-2003-03 and
      882 504 at end-2003-05, against 1 957 647 in the other 2005-04 record). Placed at 2003-04 it closes
      BS claims on NBFIs = CB + ODC exactly. The pipeline dates it 2003-05-01 (nbk_records.KNOWN_MISDATED).
    advice: The 2003-05-01 point is a re-dated source record; values are as published.

  - id: nbk_surveys_identity_errors
    kind: inconsistent
    variable: NBK_SURVEY_HISTORY
    observations:
      - {date: "2004-08-01", item: CB.n_i_r, value: 907012.0}
      - {date: "2011-04-01", item: CB.l, value: 2844500.0}
    evidence: >
      Records JSON, 2026-09-27. CB net international reserves at end-2004-07 are 522 below gross reserves minus
      external liabilities (907 558 - 24); CB liabilities at end-2011-03 exceed the sum of their lines by 1 603.
      Same kind in the other surveys: BANKS_SURVEY_HISTORY ODC.l 2001-02-01 (315 142; its liability lines sum to
      314 028); BANKING_SYSTEM_SURVEY_HISTORY BS.n_e_a 2005-12-01 (1 280 997; its components sum to 1 796 696);
      OFC_SURVEY 2017-04-01: OFC.m_o_g 22 879 while both of its parts (deposits, other liabilities) print 22 879
      (sum 45 758), and OFC.o_tr 1 271 516 against parts 1 271 520. Every other date of every survey holds.
    advice: Totals are published figures; for these dates prefer the components (or the other side of the balance).

  - id: nbk_survey_unpublished_nda_line
    kind: caveat
    variable: NBK_SURVEY_HISTORY
    observations:
      - {date: "2009-03-01", item: CB.n_d_a, value: -4044597.0}
    evidence: >
      CB net domestic assets equal net claims on government - National Fund deposits + claims on banks, NBFIs and the
      rest of the economy + other items through end-2009-01; from end-2009-02 the published lines miss 600 006, rising
      to 6 711 039 at end-2026-08 (the same gap as form 50 line 2 against 2.1-2.6). BS.i_a has the same gap.
    advice: Use the published lines, not n_d_a minus them, for NBK claims by sector.

  - id: nbk_rest_of_economy_2015_06
    kind: break
    variable: NBK_SURVEY_HISTORY
    observations:
      - {date: "2015-06-01", item: CB.n_d_a_r_rest_economy, value: 59711.0}

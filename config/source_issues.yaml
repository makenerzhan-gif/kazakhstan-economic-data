    kind: inconsistent
    variable: DEVELOPMENT_INSTITUTIONS_BALANCE_SHEETS
    observations:
      - {date: "2021-03-31", item: FPKR.TOTAL_ASSETS, value: 492.261367}
      - {date: "2021-03-31", item: FPKR.EQUITY, value: -674.269301}
    evidence: >
      fpkrfm1_2021_cons_rus.xlsx reports rights of claim as «Дебиторская торговая и прочая задолженность» (361.0 bn)
      and gives 31.12.2020 as assets 500.3 bn, reserve for conditional distribution -3 391.7 bn. The FY2020 file

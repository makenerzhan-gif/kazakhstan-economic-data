    evidence: >
      BNS (Taldau) 2008: arrivals 46 113, departures 44 813. CIS Stat facts 4650866 / 4679599 (as reported
      by BNS to the committee): 46 404 / 45 287. All other years 1991-2025 of the two sources agree

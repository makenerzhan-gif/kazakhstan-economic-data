  - id: pension_arrears_copy_forward
    kind: inconsistent
    variable: PENSION_CONTRIBUTIONS_ARREARS
    observations:
      - {date: "2025-01-01", value: 3287315.7021371904}
    evidence: The Feb-2025 bulletin gives 91 368 for 1 January 2025; the Aug-2026 bulletin 3.29 trn -- more than a year of contributions -- and its «1 July 2025» column repeats the previous edition's «1 January 2026» figures region by region.
    advice: Do not use without confirming against the Minfin/ЕНПФ publication.

  - id: gdp_nominal_ytd_preliminary
    kind: caveat
    variable: GDP_NOMINAL
    evidence: >
      Table 4439's January-March, -June and -September columns are first estimates that are never revised,
      while the fourth-quarter column is the final annual figure, so a decumulated Q4 is 35-38% of the year
      (the quarterly accounts give about 30%).
    advice: For discrete quarters use the QNA_* datasets, not GDP_NOMINAL decumulated.

  - id: poverty_headcount_definition
    kind: caveat
    variable: POVERTY_HEADCOUNT
    evidence: 89 778 persons in 2024, about 0.44% of the population -- consistent with the below-food-basket measure, not the official ~5% share below the subsistence minimum.
    advice: Check the Taldau definition (index 2928350) before using it as the poverty rate.

  - id: kase_eurobond_2020_2022_stale
    kind: caveat
    variable: EUROBOND_SPREAD_BY_ISSUE
    observations:
      - {date: "2022-05-01", item: XS1120709826, value: 34.0}
      - {date: "2022-06-01", item: XS1120709826, value: 24.5}
    evidence: >
      KASE valuations 2020-11 to 2022-07 quote only the 2044 bond (XS1120709826), often flagged «Индикативная»,
      with the clean price unchanged across May and June 2022 (119.9099) and spreads of 25-60 bp in a stress
      period; from 2022-08 the 2045 bond shows ~300 bp while the 2044 bond shows 50-120 bp. From 2024 the long
      bonds agree within ~20 bp.
    advice: >
      Do not use the 2044 bond for 2020-11 to 2023. The headline KZ_EUROBOND_SPREAD / KZ_EUROBOND_YIELD leave
      2020-11 to 2022-07 missing and switch to the 2045 bond from 2022-08.

  - id: kase_eurobond_short_bonds_2022_2024
    kind: caveat
    variable: EUROBOND_SPREAD_BY_ISSUE
    observations:
      - {date: "2023-06-01", item: XS1120709669, value: -112.5}
      - {date: "2023-07-01", item: XS1263054519, value: -112.3}
    evidence: >
      KASE valuations of the short USD bonds (3.875% 2024 XS1120709669, 5.125% 2025 XS1263054519): 12-18 bp in
      April-June 2022, 150 vs 17 bp for the two in 2022-09, and negative spreads over US Treasuries every month
      from 2023-04 to 2024-04 (down to -112 bp) while the 2045 bond stood at 120-170 bp -- valued off local trades
      close to par, not the external market. So they cannot fill the 2020-11..2022-07 gap of the headline either.
    advice: Do not use the 2024 and 2025 bonds' spreads from 2022-04 on.

  - id: bank_loans_short_term_2000_08
    kind: error
    variable: BANK_LOANS_STB_SHORT_TERM
    observations:
      - {date: "2000-08-01", value: 994402.0}
    evidence: >
      NBK «Кредиты экономике от банков второго уровня (исторические данные)», row 07.00: short-term
      994 402 against a total of 198 047 and long-term 98 645 — total less long-term is 99 402, so a
      digit was added. Neighbouring months: 91 567 and 104 046. (08.04 is 100 mln off the total too.)
    advice: Use 99 402 (total less long-term) or treat as missing.

  - id: state_budget_identity_2021_09
    kind: inconsistent
    variable: STATE_BUDGET_DEFICIT_YTD
    observations:
      - {date: "2021-09-30", value: -1657256.05016014}
    evidence: >
      Minfin Statistical Bulletin, табл 3, January-September 2021: revenue 11 305 984 − expenditure
      12 503 080 − net budget lending 413 809 − financial assets 136 724 = −1 747 628, against a
      printed deficit of −1 657 256 (90 372 mln apart). Every other month of 2019-2026 reconciles
      within 1 mln.
    advice: For January-September 2021 derive the deficit from its components, or check the Q3 2021 figure against the annual report.

  - id: trade_national_row_2022_09
    kind: inconsistent
    variable: IMPORTS_VALUE_BY_REGION_HS_SECTION
    observations:
      - {date: "2022-09-01", item: TOTAL, value: 4532374.79174}
    evidence: >
      BNS trade workbooks (elements 446905/446906), sheet «2022», September 2022: the national row
      «Республики Казахстан» is below the sum of the 21 regional heading rows and of the 6-digit
      lines -- imports by 3.8 % (USD) and 3.9 % (tonnes), exports by 1.1 % (USD) and 1.5 % (tonnes).
      Every other month from January 2015 adds up to within 0.01 %. The regional rows are internally
      consistent (lines = heading), so the national row looks stale. The national rows of the item-level
      trade datasets keep TOTAL only for this month; the regional breakdowns are complete.
    advice: For September 2022 prefer the sum of the regions (national TOTAL + 3.8 % for imports, + 1.1 % for exports in USD).

  - id: state_non_oil_deficit_2019_2021
    kind: error
    variable: STATE_NON_OIL_DEFICIT
    observations:
      - {date: "2019-12-31", value: 1285306.7183763}
      - {date: "2020-12-31", value: 2808962.17986238}
      - {date: "2021-12-31", value: 2534806.1730886}
    evidence: >
      Minfin Statistical Bulletin, табл 3, row «VI. НЕНЕФТЯНОЙ ДЕФИЦИТ (ПРОФИЦИТ) БЮДЖЕТА»: the 2019, 2020 and
      2021 report columns (and January-November 2021) repeat row VII, the financing of the deficit -- minus the
      headline deficit -- as NON_OIL_BUDGET_DEFICIT's 2021 does in the Dynamics file. Every month Minfin prints
      from April 2022 satisfies non-oil deficit = deficit - transfers from the National Fund - export duty on
      crude oil to 1 mln KZT (44 months).
    advice: >
      Fixed in the pipeline: those values are replaced by the identity (2019 -5 509 000, 2020 -8 161 050,
      2021 -8 057 811 mln KZT); STATE_NON_OIL_DEFICIT_YTD before April 2022 is the same identity (from 2013-01, with the transfers row of the bulletin; four 2011-2012 months).

  - id: republican_subsidies_2017_11
    kind: inconsistent
    variable: GOV_SUBSIDIES_EXPENDITURE
    observations:
      - {date: "2017-11-30", value: 81392.23977242}
    evidence: >
      Statistical Bulletin «на 1 декабря 2017», табл 10, row 310 «Бюджетные субсидии»: January-November 81 392
      mln KZT against 84 437 for January-October in the previous edition -- a cumulative figure that falls
      (a refund or reclassification, not explained). January-December is 89 303.
    advice: Treat the implied November 2017 flow (-3 045) as a revision, not spending.

  - id: state_subsidies_classification_2022_2024
    kind: caveat
    variable: STATE_GOV_SUBSIDIES_EXPENDITURE
    observations: []
    evidence: >
      табл 6 (state budget by economic classification), September 2022 - May 2024 editions: code 310 is
      «Текущие трансферты юридическим лицам» and no subsidies line is printed; the republican (табл 10) and
      local (таб 11) tables print specific 311, which equals 310 wherever both appear (128 table-editions),
      and those series use it. The state-level series has no value for these 21 months.
    advice: For the state budget in 2022-09 … 2024-05 add the republican and local subsidies.

  - id: regional_budgets_shymkent_2020_02
    kind: error
    variable: REGIONAL_BUDGETS_YTD
    observations:
      - {date: "2020-02-01", item: REV, region: SHM, value: 28626.40829837}
      - {date: "2020-02-01", item: EXP, region: SHM, value: 13908.53587542}
    evidence: >
      The February 2020 bulletin's Shymkent sheet (January-February) repeats the January 2020 sheet cell for
      cell (revenue 28 626.4, expenditure 13 908.5, PIT 2 027.3 mln KZT in both); the regions then fall 3.1%
      short of table 12 (952 817) instead of adding up to it, as in every other month of 2018-2022.
    advice: Treat Shymkent's February 2020 as missing (the other regions and the national total are fine).

  - id: regional_budgets_national_2021_q1
    kind: error
    variable: REGIONAL_BUDGETS_YTD
    observations:
      - {date: "2021-02-01", item: REV, region: national, value: 573713.46881241}
      - {date: "2021-03-01", item: REV, region: national, value: 867559.58707728}
    evidence: >
      Table 12 («all local budgets») of the February and March 2021 bulletins: revenue 573.7 and 867.6 bn KZT,
      about half of its own 17 region tables (1 123.8 and 1 715.8 bn); expenditure 754.4 / 1 246.5 against
      832.6 / 1 370.7. The same table prints 2020's annual revenue as 3 190.5 bn while its four 2020 quarters
      sum to 7 720 bn. January and April 2021 add up.
    advice: For national local-budget totals of 2021-02 and 2021-03 use the sum of the regions.

  - id: regional_budgets_new_regions_2022_2024
    kind: caveat
    variable: REGIONAL_BUDGETS_YTD
    observations:
      - {date: "2023-12-01", item: REV, region: national, value: 13552443.1162465}
    evidence: >
      Abai, Zhetisu and Ulytau regions exist from June 2022, but the bulletins print their budgets as separate
      tables only from the August 2024 edition (January-July 2024). The 2022-09 … 2024-07 editions have 17 region
      tables whose parent regions (East Kazakhstan, Almaty, Karaganda) already exclude them, so the regions sum
      to 1-8% less than table 12 (2023: 12 513.5 against 13 552.4 bn).
    advice: Regional panels 2022-09 … 2024-07 miss three regions; use table 12 (national) for totals.

  - id: population_avg_2008
    kind: error
    variable: POPULATION_BNS
    observations:
      - {date: "2008-12-31", value: 15982370.0}
    evidence: >
      BNS table 6576 (and Taldau 703834) print the 2008 «average annual population» as 15 982 370 -- the
      post-census 1 January 2009 stock -- for the country and every region, urban/rural and sex split.
      Every other year 1991-2007 equals the mean of the adjacent 1 January stocks of table 6584 exactly.
      CIS Stat (15 776.95 thousand) and UNECE (15 776 938) publish the mean of the stocks.
    advice: For per-capita work use 15 776 938 for 2008 (mean of the pre-census stocks), or the mean of POPULATION_BOY_BNS.

  - id: population_census_steps
    kind: break
    variable: POPULATION_BOY_BNS
    observations:
      - {date: "2009-01-01", value: 15982352.0}
      - {date: "2022-01-01", value: 19503159.0}
    evidence: >
      BNS did not backcast the population after the 2009 and 2021 censuses. The demographic balance
      stock(t+1) − stock(t) − (births − deaths) − net migration is zero in every year 2000-2025 except
      2008→2009 (+204 869, the 2009 census) and 2021→2022 (+380 751, the 2021 census).
    advice: Add step dummies at 2009 and 2022, or spread each census residual over the intercensal years, before using population growth.

  - id: rb_quasifiscal_ytd_decreases
    kind: caveat
    variable: RB_QUASIFISCAL_YTD
    observations:
      - {date: "2020-03-01", item: EQUITY, value: 25794.646161}
      - {date: "2022-10-01", item: EQUITY, value: 81428.937895}
      - {date: "2020-11-01", item: LOAN.LOCAL_GOV, value: 91308.2575}
    evidence: >
      Year-to-date values of «табл 8 (расх)» that fall within a year (negative monthly flows, returned or
      reclassified amounts), none in the development-institution items: 207/241 «Увеличение уставного
      капитала РГП …» 8 780.2 (2020-02) -> 4 713.8 (2020-03) and 10 082.5 (2022-09) -> 9 074.3 (2022-10);
      loans to local executive bodies 241/042 1 179.0 -> 1 112.4 (2020-10 -> 11), 249/008, 249/224 and
      243/034 in 2021-11 -> 12 and 2022-11 -> 12 (0.1-0.2 bn).
    advice: Monthly flows of EQUITY, EQUITY.OTHER_QUASI, LOAN and LOAN.LOCAL_GOV can be slightly negative in those months; the DI items never are.


  - id: POPULATION_AVG_BY_REGION
    name_ru: "Среднегодовая численность населения по регионам: всё население, город, село, по полу"
    name_en: "Average annual population by region: total, urban, rural, by sex"
    agency: bns
    element_id: 6576
    layout: group_blocks
    sheets: ["1991-2008", "2009-2025"]
    year_regex: "^\\s*(\\d{4})"
    groups: {ALL: "^все население", URBAN: "^городское население", RURAL: "^сельское население", MEN: "^мужчины", WOMEN: "^женщины"}
    subgroups: [MEN, WOMEN]
    min_items: 9
    min_regions: 20
    frequency: annual
    unit: "persons"
    category: population
    note: "Items ALL, URBAN, RURAL and their MEN/WOMEN splits (ALL_MEN, URBAN_WOMEN …). 1991-2008 on the old boundaries (16 regions: Алматинская incl. Жетісу, ВКО incl. Абай, Карагандинская incl. Ұлытау, YKO = Туркестанская + Шымкент); 2009 onwards recalculated by BNS for the 2022 regions -- do not splice regions across 2008/2009. 1991-2007 = mean of the adjacent 1 January stocks (POPULATION_BOY_BY_REGION) exactly. 2008 is printed as the post-census 1 Jan 2009 stock (15 982 370), not an average (source_issues population_avg_2008). Census steps not backcast: +204 869 in 2008/09, +380 751 in 2021/22."


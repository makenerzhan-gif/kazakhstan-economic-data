  # ---------------------------------------------------------------- import-weighted effective exchange rate (added 2026-09-27)
  # fetchers/nbk_fx.py (rates), fetchers/comtrade.py (weights), fetchers/neer_import.py (index).
  - id: EXCHANGE_RATES_OFFICIAL_MONTHLY
    name_ru: "Официальные курсы тенге к валютам торговых партнёров, среднее за месяц"
    name_en: "Official KZT exchange rates against partner currencies, monthly average"
    agency: nbk
    fetcher: nbk_fx
    frequency: monthly
    unit: "KZT per one unit of the currency"
    category: monetary
    note: "Weekday mean of the NBK official rate (the rate in force on each weekday), 18 currencies (USD, EUR, CNY, RUB, TRY, KRW, UZS, KGS, BYN, JPY, GBP, INR, CHF, CZK, PLN, AED, TJS, AZN), KZT per ONE CURRENT unit. From 1999-11-17: the NBK daily report (its 1999-10-19..30 rows are malformed and dropped). Before: the NBK archive «Архив официальных курсов валют с 1993 по 1999» (nationalbank.kz/file/download/22756; rates set once or twice a week before April 1999), equal to the report on every common weekday of 1999-11-17..12-31 for USD, EUR, CNY, RUB, GBP, CHF, JPY, KGS (enforced). First month: USD, RUB, GBP, CHF 1993-11; UZS 1993-12; KGS, BYN 1994-01; JPY 1994-02; TRY 1994-05; CNY 1996-02; EUR 1999-01; KRW 2000-05; AED 2001-07; PLN 2004-09; CZK 2009-03; TJS 2011-03; INR, AZN 2014-02 (the report has no earlier rate). A day whose PRINTED figure is below 1.0 (two decimals: 0.26 per 1000 Turkish lira, 0.06 per Belarusian rouble) is dropped, so TRY runs 1994-05..1996-02 then from 2005-01, UZS 1993-12..1994-04 and 1995-10..1996-11 then from 2014-02, BYN 1994-01..09 then from 2014-02, JPY and KGS start in early 1994. Redenominations restated to the current unit and checked against the data (the step must be there at the date where a source quotes old units, and no other step above x8 within a month anywhere): RUB 1998-01-01 1000:1 -- the archive quotes per 1000 old roubles until 1997 = one new rouble, no step (13.00 on both sides); TRY 2005-01-01 1 000 000:1 -- archive TRL x1 000 000 (no overlap: the report quotes TRY from 2005-01-06); BYN 2000-01-01 BYB->BYR 1000:1 and 2016-07-01 BYR->BYN 10 000:1 -- archive BYB x10 000 000, report BYR x10 000 up to 2016-07-01 inclusive (the rate in force on Fri 1 July was set on 30 June, per 100 BYR; first BYN quote 2 July, step x10 162); UZS 1994-07-01 sum-coupon->sum 1000:1 -- the archive's 1993-12..1994-04 figures are per 1000 coupons = one sum (checked against the rouble per 1000), no restatement; AZN 2006 5000:1, TJS 2000 1000:1, PLN 1995 10 000:1 -- no rate on either side in the sources. Kept as published, not the franc's rate: CHF 1995-04-17..18 (12.83, the French franc's figure) and the week of 1998-11-09 (74.55 between 62.85 and 64.38) -- source_issues. Item USD, EUR, CNY and RUB equal the monthly means of the scalar daily EXCHANGE_RATE* series in every month."


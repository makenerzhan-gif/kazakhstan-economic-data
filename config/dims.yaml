  # ---------------------------------------------------------------- resources and use of products (physical units)
  # BNS «Ресурсы и использование отдельных видов продукции (товаров) и сырья в РК», publication
  # 19065 (archive 72035), scripts/fetchers/bns_resource_use.py. Item «<product>.<article>»:
  # RES = PROD + IMP (+ EST), USE = RES, DOM = USE − EXP. History from 2018-03 was read once by
  # scripts/backfill_resource_use.py; a daily run re-reads the latest editions over it.
  - id: RESOURCE_USE_MONTHLY
    name_ru: "Ресурсы и использование отдельных видов продукции (товаров) и сырья: производство, импорт, экспорт, реализация на внутреннем рынке, помесячно"
    name_en: "Resources and use of individual products: production, imports, exports, domestic sales, monthly, physical units"
    agency: bns
    fetcher: bns_resource_use
    period: monthly
    min_items: 150
    frequency: monthly
    unit: "physical units, as in item_name (тыс. тонн, тонн, млн. куб. м, млн. кВт·ч, штук …)"
    category: production
    note: "National. ~270 industrial products (table 1), grain and vegetables (crops_*, imports and exports only since 2022), socially important foods (szpt_*, from 2022-05). Articles: RES ресурсы, PROD производство, IMP импорт, EST оценка, USE использование, EXP экспорт, DOM реализация на внутреннем рынке. Each month carries its latest print (the edition a year later). 2018-04 is missing (that edition is a rar archive)."

  - id: RESOURCE_USE_YTD
    name_ru: "Ресурсы и использование отдельных видов продукции (товаров) и сырья, с начала года (январь–месяц)"
    name_en: "Resources and use of individual products, January to the month (year-to-date), physical units"
    agency: bns
    fetcher: bns_resource_use
    period: ytd
    cumulation: year_to_date
    transformation: "level (year-to-date cumulative, as published -- not decumulated to months)"
    min_items: 150
    frequency: monthly
    unit: "physical units, as in item_name"
    category: production
    note: "Same items as RESOURCE_USE_MONTHLY; dated the first day of the last month (January–July 2026 = 2026-07-01). The latest print of each cumulative figure -- BNS revises earlier months only inside it, so the sum of RESOURCE_USE_MONTHLY can differ (wheat exports January–July 2026: 4.95 Mt here, 5.99 Mt summing the months)."

  - id: RESOURCE_USE_ANNUAL
    name_ru: "Ресурсы и использование отдельных видов продукции (товаров) и сырья, годовые (окончательные) данные"
    name_en: "Resources and use of individual products, annual final data, physical units"
    agency: bns
    fetcher: bns_resource_use
    period: annual
    min_items: 150
    frequency: annual
    unit: "physical units, as in item_name"
    category: production
    note: "The annual editions («… (2024г.)», published about eleven months after the year), 2021 onward; same items as RESOURCE_USE_MONTHLY. Years before 2021: sum RESOURCE_USE_MONTHLY."


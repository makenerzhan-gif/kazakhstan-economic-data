  # Derived from the year-to-date tables 4439/4440 (run after GVA_*_BY_SECTION_QUARTERLY).
  - id: GVA_VOLUME_INDEX_BY_SECTION_DISCRETE
    name_ru: "ИФО ВВП и ВДС по видам деятельности за отдельный квартал, к тому же кварталу прошлого года (выведено из нарастающих итогов)"
    name_en: "GDP and GVA volume index by section for the discrete quarter, same quarter of previous year = 100 (derived from year-to-date data)"
    agency: derived
    fetcher: gdp_discrete
    frequency: quarterly
    unit: "% of the same quarter of the previous year"
    category: national_accounts
    note: "Derived from GVA_VOLUME_INDEX_BY_SECTION_QUARTERLY and GVA_NOMINAL_BY_SECTION_QUARTERLY: I_k = (I_ytd,k·N_ytd,k,t−1 − I_ytd,k−1·N_ytd,k−1,t−1)/(N_ytd,k,t−1 − N_ytd,k−1,t−1), previous-year prices. Gives the latest quarter before BNS's quarterly accounts (the expenditure QNA, element 283161, published 2026 Q2 on 04.11.2026: GDP 108.2 % y/y against 105.2 here, H1 105.1 against 104.1, Q1 revised to 101.4 against 103.0 -- the two bases split the half-year differently; the production QNA ends at 2025 Q4 since BNS withdrew its 2026 columns on 20.10.2026: source_issues qna_production_2026_withdrawn). Rounding band about ±0.15 pp for GDP; Q4 carries the annual-survey residual of table 4439; the 4439/4440 basis differs from the QNA basis -- do not splice without a note. 2026 Q2: GDP 105.2."

  # ---------------------------------------------------------------- utility tariffs and administered prices (added 2026-09-27)
  - id: TARIFF_DECISIONS
    name_ru: "Решения о тарифах на коммунальные услуги (КРЕМ, ДКРЕМ) и предельные цены Минэнерго на электроэнергию и газ: события по месяцу вступления в силу"
    name_en: "Utility tariff decisions (КРЕМ and its regional departments) and Ministry of Energy electricity and gas price caps: events by month of entry into force"
    agency: krem
    fetcher: krem_tariffs
    refresh_days: 1
    frequency: monthly
    unit: "percent change of the tariff (NaN when the source does not state it)"
    category: prices
    geography: "Kazakhstan (national and regions)"
    note: "EVENT dataset, one record per decision and service, dated by the first day of the month the decision takes effect. item_code = REGION.SERVICE.KIND.SOURCE_ID (REGION KZ = national; SERVICE HEAT, HOT_WATER, WATER, WATER_BULK, SEWER, ELEC_TRANS, ELEC_SUPPLY, GAS_DISTR, GAS_TRANS, GAS_STORAGE, GAS_RETAIL, ELEC_GEN_CAP, GAS_WHOLESALE_CAP; KIND APPROVE, AMEND, TEMP_COMP (temporary compensating tariff: a cut), EMERGENCY, CAP_CUT, PRICE_CAP, NEWS, ORDER, PERIOD; SOURCE_ID D<gov.kz document>, N<gov.kz news>_<n>, V…/G… adilet act). item_name: service | decision | company | order | effective date and its basis | change | source URL. (1) КРЕМ/ДКРЕМ orders from the gov.kz «krem» documents listing, read from the TITLE (the order files are scans): 3 413 records 2011-2026, value NaN; effective date stated in 178, estimated as the month after the order date in 2 689 and as the month after publication in 546 (only Карагандинская and Шымкент, which publish within days). (2) КРЕМ press releases: 90 records, 53 with the stated % change (2019-2026). (3) Minenergo electricity generation caps (orders 514 and 508-н/қ and their amendments, old.adilet.zan.kz): 20 acts 2019-2026, value = mean % change of the caps across producer groups for the effective year (16 with a value). (4) Minenergo wholesale gas caps by region (yearly orders 2014-2022, order 210 of 2023 with periods to 2027/28): 202 region-period events, value = % change against the previous period; the 2027-07 period is transformation «forecast». Coverage is uneven across regions: departments that put order dates in titles dominate (Карагандинская 1 116, Костанайская 753, Алматы 428 records; Мангистауская 15, Северо-Казахстанская 10). Sources overlap (a release may report an order that is also listed): aggregate by (date, region, service). See TARIFF_CHANGE_MONTHS for the months the CPI registered the changes."

  # Derived from CPI_DETAIL_MOM (run after it).
  - id: TARIFF_CHANGE_MONTHS
    name_ru: "Месяцы изменения цен на коммунальные услуги в ИПЦ (м/м), по услугам"
    name_en: "Months with a utility price change in the CPI (month on month), by service"
    agency: derived
    fetcher: tariff_jumps
    frequency: monthly
    unit: "percent change, month on month"
    transformation: "percent change, month on month (index - 100); flagged months only"
    category: prices
    threshold_pct: 3.0
    z_threshold: 5.0
    min_pct: 1.5
    note: "Derived, not published: the months in which the national CPI item of a utility moved by at least 3% m/m, or by at least 1.5% with a robust z-score (median/MAD over the item's history) of at least 5; both directions. Items ELECTRICITY, HOT_WATER, COLD_WATER, HEATING, SEWERAGE, NETWORK_GAS, LPG, GARBAGE, each a chain of the BNS item slugs of CPI_DETAIL_MOM across basket re-bases (item_name names the slug). Measures when a tariff change reached the prices BNS registers, NOT the decision date (TARIFF_DECISIONS); a change in one city moves the national item by a fraction of its size. National only: the regional CPI rows carry no utility items. 314 flagged months 2004-2026 (2026-09-27)."


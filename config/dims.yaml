        names: {"Banking sector": "Банковский сектор", "other public sector": "Прочий государственный сектор (институты развития)", "Other public sector entities": "Прочий государственный сектор (институты развития)", "Microfinance activities": "Микрофинансовые организации", "Mortgage companies": "Ипотечные организации"}

    subgroups: [MEN, WOMEN]
    as_at_start_of_year: true
    min_items: 9
    min_regions: 20
    frequency: annual
    unit: "persons"
    category: population
    note: "BNS table 6584 (KSP 611101), dated at the as-at date 1 January (the column «2009» = 2009-01-01). 1 Jan 1991 16 358 222; 1 Jan 1999 14 955 106; 1 Jan 2009 15 982 352; 1 Jan 2026 20 499 822. Old boundaries to 2008 and BNS's 2022-region recalculation from 2009 (as POPULATION_AVG_BY_REGION). The official series is not backcast after the censuses: the 1 Jan 2009 step includes +204 869 and the 1 Jan 2022 step +380 751 of census adjustment (demographic balance residual; zero in every other year 2000-2025)."


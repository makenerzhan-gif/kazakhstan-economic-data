  # ---------------------------------------------------------------- IMF statistics and WDI for Kazakhstan (added 2026-09-27)
  # scripts/fetchers/imf_dims.py (fetcher imf_sdmx): IMF SDMX 3.0 API, latest version of each
  # dataflow, every series the dataflow has for KAZ. item_code joins the code_dims («NETCD_T.CAB»),
  # item_name their English codelist names. Values in the unit named (the API gives units: USD,
  # KZT). Quarterly flows dated at the quarter's first day, quarterly positions at its last day,
  # annual 31 December. BOP/IIP: BPM6, as NBK reports them to the IMF — NBK's own scalar series
  # (CURRENT_ACCOUNT_BALANCE, BOP_*, IIP_*) stay the primary source for the headline numbers; these
  # add the standard components behind them. GFS: the IMF's GFSM 2014 presentation of the
  # general government and its subsectors (S13 general government, S1311 central government,
  # S1311B budgetary central government, S13112 extrabudgetary units, S1313MIXED local
  # government, S1314 social security funds, S1321 public financial corporations …), which is
  # where the National Fund sits inside the general government.
  - id: IMF_BOP_QUARTERLY
    name_ru: "Платёжный баланс Казахстана (МВФ, РПБ6), все стандартные компоненты, поквартально"
    name_en: "Kazakhstan balance of payments (IMF BOP, BPM6), all standard components, quarterly"
    agency: imf
    fetcher: imf_sdmx
    flow: IMF.STA/BOP
    key: "KAZ.*.*.USD.Q"
    code_dims: [BOP_ACCOUNTING_ENTRY, INDICATOR]
    divisor: 1000000
    period: flow
    min_items: 300
    required_items: [NETCD_T.CAB, NETCD_T.G, NETCD_T.S, NETCD_T.IN1, NNAFANIL_T.FAB]
    frequency: quarterly
    unit: "million USD"
    category: international
    note: "Item = accounting entry . indicator: CD_T credit, DB_T debit, NETCD_T net (credit less debit), A_NFA_T net acquisition of financial assets, L_NIL_T net incurrence of liabilities, NNAFANIL_T net (assets less liabilities), A_T reserve assets. 1995Q1 onward (most detail from 2005). NETCD_T.CAB equals NBK CURRENT_ACCOUNT_BALANCE in 94 of 104 common quarters; 2023Q1-2025Q2 differ by 14-350 mn USD (NBK has revised them, the IMF's BOP not yet) — NBK stays the primary source for the headline balances."


  # ---------------------------------------------------------------- CPI basket weights (added 2026-09-27)
  - id: CPI_WEIGHTS
    name_ru: "Веса ИПЦ по разделам КООЛИЦ (официальные: БНС через МВФ 2005-2019, схема БНС 2022, доли продовольственных/непродовольственных товаров и услуг)"
    name_en: "CPI weights by COICOP division (official: BNS via the IMF 2005-2019, the BNS 2022 scheme, food/non-food/services shares)"
    agency: bns
    fetcher: cpi_weights
    refresh_days: 30
    frequency: annual
    unit: "percent of the basket"
    category: prices
    note: "2005-2019: CP01-CP12 (COICOP 1999) as BNS reports them to the IMF (IMF.STA/CPI WGT_PT, December of each year; January 2014 repeats 2013 and is not used). 2022: the full BNS scheme (divisions, food groups CP011_*, GOODS/FOOD/NONFOOD/SERVICES). FOOD/NONFOOD/SERVICES: 2023-2026 from BNS January releases, 2014/2016/2017/2019/2020 from press reprints of them (item_name says so). FOOD = CP01+CP02 (IMF 2014 36.97 vs published 37.0). No official division weights exist in public for 2020-2021 and 2023-2026 -- see CPI_WEIGHTS_ESTIMATED; none below the food groups, none by region, none before 2005."
  - id: CPI_WEIGHTS_ESTIMATED
    name_ru: "Веса ИПЦ по разделам КООЛИЦ, оценка по вкладам в прирост ИПЦ, 2020-2026"

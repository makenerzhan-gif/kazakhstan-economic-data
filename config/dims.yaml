  - id: NEER_IMPORT_WEIGHTED
    name_ru: "Номинальный эффективный курс тенге с весами потребительского и всего импорта (2020 = 100, рост = укрепление)"
    name_en: "Nominal effective exchange rate of the tenge, consumer-import and total-import weights (2020 = 100, up = appreciation)"
    agency: derived
    fetcher: neer_import
    frequency: monthly
    unit: "index, 2020 = 100"
    category: monetary
    note: "Geometric chain of monthly changes of 18 NBK official rates, weights = previous year's import shares by partner currency (UN Comtrade reported by Kazakhstan; euro-area members from euro adoption; Ecuador, Panama, El Salvador, Hong Kong to USD); partners without an NBK rate dropped, weights renormalised among currencies quoted in both months. From 1995-12 (weights of 1995, Kazakhstan's first year in Comtrade, used from 1996-01; the rates reach back to 1993-11). Before 1999 the euro-area partners have no rate in the table (Germany ~9% of 1998 imports) and coverage is 59-77% against 80-90% from 2000; 1995-1999 CONSUMER weights include passenger cars (HS1992 conversion to BEC 522) and CONSUMER 2000 is a partial Comtrade conversion, so 2001 uses the 1999 structure. NEER_CONSUMER: BEC 112, 122, 522, 61, 62, 63 -- the pass-through-relevant basket (Russia ~31%, China ~24% of 2024 consumer imports); NEER_TOTAL: all goods. Coverage and weights by year in NEER_IMPORT_WEIGHTS. Differs from the NBK NEER (trade weights of exports and imports, IMF-style)."
  - id: NEER_IMPORT_WEIGHTS
    name_ru: "Веса валют в NEER по структуре импорта предыдущего года, %"
    name_en: "Currency weights of the import-weighted NEER (previous year's import shares), percent"
    agency: derived
    fetcher: neer_import
    output: weights
    frequency: annual
    unit: "percent"
    category: monetary
    note: "Dated the year the weights are used in NEER_IMPORT_WEIGHTED (shares of the previous year's imports), from 1996 (1995 imports). Items BASKET.CURRENCY and COVERAGE_BASKET = share of the basket's imports from partners with a currency in the index. A year whose basket Comtrade converts only in part (below 5% of all goods imports: CONSUMER 2000) takes the last complete year's structure -- the item name gives the year of the structure (CONSUMER 2001: 1999)."

  - id: REGIONAL_BUDGETS_YTD
    name_ru: "Исполнение местных бюджетов по регионам с начала года: доходы (ИПН, соцналог, трансферты), расходы по функциям, субвенции и изъятия"
    name_en: "Local budget execution by region, year to date: revenues (PIT, social tax, transfers), spending by function, subventions and withdrawals"
    agency: minfin
    fetcher: minfin_regions
    frequency: monthly
    unit: "million KZT, January to the month"
    category: fiscal
    note: "Minfin Statistical Bulletin tables 12 (all local budgets = national), 12.1-12.20 (one per region, matched by the sheet title) and 18 (17 before 2021-09; general transfers), every edition since 2013-01 (2013-2018 from the yearly archives, via scripts/backfill_minfin_bulletins.py --dims). Dated the first day of the period's last month; year to date (difference within a year for the month). Items: REV, REV.TAX, REV.CIT, REV.PIT, REV.SOCIAL_TAX, REV.EXCISE, REV.NONTAX, REV.CAPITAL, REV.TRANSFERS, EXP, EXP.01-EXP.15 (functional groups; 04 education, 05 health, 06 social assistance, 07 housing), NET_LENDING, FIN_ASSETS, BALANCE, SUBVENTIONS, WITHDRAWALS. Regions: 16 to mid-2018 (South Kazakhstan), then 17 (Turkestan and Shymkent), 20 from the August 2024 edition (Abai, Zhetisu, Ulytau; the 2022-09…2024-07 editions omit them though the parent regions already exclude them -- source_issues). Checked: the regions add up to table 12 within 0.5% in every edition with all region tables, except the source errors of 2020-02 (Shymkent) and 2021-02/03 (table 12) in source_issues. Targeted transfers received = REV.TRANSFERS - SUBVENTIONS. REV.PIT and REV.SOCIAL_TAX by region = a monthly regional wage-bill proxy. National rows start in 2014-12 (earlier table 12 has no period column); the regions are there from 2013-01. Missing editions: 2020-04, 2025-12, 2026-04."

  - id: RB_QUASIFISCAL_YTD
    name_ru: "Квазифискальные операции через республиканский бюджет с начала года: бюджетные кредиты и взносы в уставный капитал институтов развития и нацхолдингов (Байтерек, БРК, ФРП, Даму, АКК, Отбасы, Самрук-Казына, ФПК …)"
    name_en: "Quasi-fiscal flows through the republican budget, year to date: budget loans and equity to development institutions and national holdings (Baiterek, DBK, IDF, Damu, ACC, Otbasy, Samruk-Kazyna, Problem Loans Fund …)"
    agency: minfin
    fetcher: minfin_quasifiscal
    frequency: monthly
    cumulation: year_to_date
    unit: "million KZT, January to the month"
    category: fiscal
    note: "Minfin Statistical Bulletin «табл 8 (расх)» (republican budget spending by programme), sections БЮДЖЕТНЫЕ КРЕДИТЫ (LOAN) and ПРИОБРЕТЕНИЕ ФИНАНСОВЫХ АКТИВОВ (EQUITY), every edition since 2013-01 (2013-2018 from the yearly archives, via scripts/backfill_minfin_bulletins.py --dims). Dated the first day of the period's last month; year to date (difference within a year for the month). Recipient read from the programme label, not the codes (codes change with reorganisations): the first entity named is the direct counterparty, the last one before «через» the final recipient; БРК-Лизинг = IDF. Items for SEC in LOAN, EQUITY: SEC (section total), SEC.DI (development institutions and holdings), SEC.<final recipient> (BAITEREK, DBK, IDF, DAMU, KAZAKHEXPORT, QIC, KAZAGRO, ACC, KAF, FCC, OTBASY, KHC, KMC, HCGF, KMGF, SAMRUK, KTZ, FPK), SEC.FAM.<DEV_FINANCE|SME|AGRI|HOUSING|SAMRUK|FPK>, SEC.VIA.<BAITEREK|KAZAGRO|SAMRUK> (direct counterparty), and the rest SEC.LOCAL_GOV, SEC.GUARANTEE_CALL, SEC.INTL_ORG, SEC.OTHER_QUASI, SEC.OTHER, so SEC = SEC.DI + the five; SEC.DI = sum of recipients = sum of families. Items that are zero in every edition are left out. Checked: programmes add up to the section header in every edition (hard check); headers = табл 7 except its known errors of 2021-02/03; LOAN.DI = табл 10 specifics 513+519 in every edition. December YTD LOAN.DI 2013-2025 (bn): 60.0, 58.9, 68.9, 182.5, 194.1, 146.5, 246.5, 245.2, 284.7, 577.3, 410.3, 274.0, 235.5. Out of scope: current transfers in the ЗАТРАТЫ section (217/202 FPK 2 092.9 bn in 2017, Даму subsidies 243/087), National Fund/NBK/UAPF purchases of holding bonds, local-budget lending (REGIONAL_BUDGETS_YTD NET_LENDING). Missing editions: 2020-04, 2026-04."

  # ---------------------------------------------------------------- IMF WEO, all economies (added 2026-09-27)
  - id: IMF_WEO_WORLD
    name_ru: "МВФ WEO по всем странам: рост ВВП, инфляция, ВВП в долларах и по ППС, население, счёт текущих операций, долг, безработица"
    name_en: "IMF WEO for all economies: GDP growth, inflation, GDP in USD and PPP, population, current account, debt, unemployment"
    agency: imf
    fetcher: imf_sdmx
    flow: IMF.RES/WEO
    key: "*.NGDP_RPCH+PCPIPCH+PCPIEPCH+NGDPD+NGDPDPC+PPPPC+LP+BCA_NGDPD+GGXWDG_NGDP+LUR+NGDP_D.A"
    code_dims: [COUNTRY, INDICATOR]
    region: world
    countries_only: true
    weo_outturn_only: true
    geography: "All economies (IMF WEO; country groups excluded)"
    min_items: 1000
    frequency: annual
    unit: "as named in item_name (percent; billions of USD; USD; international dollars; millions of persons; percent of GDP; index)"
    category: international
    note: "Item COUNTRY.INDICATOR (ISO3 . WEO code): NGDP_RPCH real GDP growth, PCPIPCH / PCPIEPCH CPI inflation (average / end of period), NGDPD GDP in billions of USD, NGDPDPC per capita USD, PPPPC per capita PPP, LP population (millions), BCA_NGDPD current account % of GDP, GGXWDG_NGDP gross government debt % of GDP, LUR unemployment, NGDP_D deflator. Latest WEO vintage in the API (October 2025 on 2026-09-27); only outturns are kept (years before each country's COUNTRY_UPDATE_DATE year). 1980 onward; the CIS mostly from 1992-1993 (no Russia 1992 growth). IMF staff figures, often different from national data in the 1990s (Kyrgyzstan 1993 -13.0 vs official -15.5; Kazakhstan CPI 1994 1 402% vs BNS 1 877%); for the CIS prefer CIS_* (CIS Stat). The Kazakh IMF_* scalars come from the same flow."

  # ---------------------------------------------------------------- CPI basket weights (added 2026-09-27)
  - id: CPI_WEIGHTS
    name_ru: "Веса ИПЦ по разделам КООЛИЦ (официальные: БНС через МВФ 2005-2019, схема БНС 2022, доли продовольственных/непродовольственных товаров и услуг)"
    name_en: "CPI weights by COICOP division (official: BNS via the IMF 2005-2019, the BNS 2022 scheme, food/non-food/services shares)"
    agency: bns
    fetcher: cpi_weights
    refresh_days: 30
    frequency: annual
    unit: "percent of the basket"
    category: prices
    note: "2005-2019: CP01-CP12 (COICOP 1999) as BNS reports them to the IMF (IMF.STA/CPI WGT_PT, December of each year; January 2014 repeats 2013 and is not used). 2022: the full BNS scheme (divisions, food groups CP011_*, GOODS/FOOD/NONFOOD/SERVICES). FOOD/NONFOOD/SERVICES: 2023-2026 from BNS January releases, 2014/2016/2017/2019/2020 from press reprints of them (item_name says so). FOOD = CP01+CP02 (IMF 2014 36.97 vs published 37.0). No official division weights exist in public for 2020-2021 and 2023-2026 -- see CPI_WEIGHTS_ESTIMATED; none below the food groups, none by region, none before 2005."
  - id: CPI_WEIGHTS_ESTIMATED
    name_ru: "Веса ИПЦ по разделам КООЛИЦ, оценка по вкладам в прирост ИПЦ, 2020-2026"
    name_en: "CPI weights by COICOP division estimated from contributions to CPI growth, 2020-2026"
    agency: derived
    fetcher: cpi_weights
    output: estimated
    frequency: annual
    unit: "percent of the basket"
    category: prices
    note: "Derived, not published: w = 100·Σc·(I−100)/Σ(I−100)² per year from CPI_CONTRIBUTION_YTD and CPI_DETAIL_YTD, food divisions rescaled to the published FOOD share and the rest to 100 − FOOD. Error against the official 2022 scheme 0.1-0.5 pp for most divisions (CP01 38.87 vs 38.75), up to ±2 pp for CP04/CP06/CP12. From 2026 COICOP 2018 (CP12_2018, CP13_2018)."

  # Derived from the year-to-date tables 4439/4440 (run after GVA_*_BY_SECTION_QUARTERLY).
  - id: GVA_VOLUME_INDEX_BY_SECTION_DISCRETE
    name_ru: "ИФО ВВП и ВДС по видам деятельности за отдельный квартал, к тому же кварталу прошлого года (выведено из нарастающих итогов)"
    name_en: "GDP and GVA volume index by section for the discrete quarter, same quarter of previous year = 100 (derived from year-to-date data)"
    agency: derived
    fetcher: gdp_discrete
    frequency: quarterly
    unit: "% of the same quarter of the previous year"
    category: national_accounts
    note: "Derived from GVA_VOLUME_INDEX_BY_SECTION_QUARTERLY and GVA_NOMINAL_BY_SECTION_QUARTERLY: I_k = (I_ytd,k·N_ytd,k,t−1 − I_ytd,k−1·N_ytd,k−1,t−1)/(N_ytd,k,t−1 − N_ytd,k−1,t−1), previous-year prices. Gives the latest quarter before BNS's quarterly accounts (QNA_* end at 2026 Q1 on 2026-09-27; their Q2 is due with element 283161 on 28.10.2026). Rounding band about ±0.15 pp for GDP; Q4 carries the annual-survey residual of table 4439; the 4439/4440 basis differs from the QNA basis -- do not splice without a note. 2026 Q2: GDP 105.2."

  # ---------------------------------------------------------------- utility tariffs and administered prices (added 2026-09-27)
  - id: TARIFF_DECISIONS
    name_ru: "Решения о тарифах на коммунальные услуги (КРЕМ, ДКРЕМ) и предельные цены Минэнерго на электроэнергию и газ: события по месяцу вступления в силу"
    name_en: "Utility tariff decisions (КРЕМ and its regional departments) and Ministry of Energy electricity and gas price caps: events by month of entry into force"
    agency: krem
    fetcher: krem_tariffs
    refresh_days: 1
    frequency: monthly
    unit: "percent change of the tariff (NaN when the source does not state it)"
    category: prices
    geography: "Kazakhstan (national and regions)"
    note: "EVENT dataset, one record per decision and service, dated by the first day of the month the decision takes effect. item_code = REGION.SERVICE.KIND.SOURCE_ID (REGION KZ = national; SERVICE HEAT, HOT_WATER, WATER, WATER_BULK, SEWER, ELEC_TRANS, ELEC_SUPPLY, GAS_DISTR, GAS_TRANS, GAS_STORAGE, GAS_RETAIL, ELEC_GEN_CAP, GAS_WHOLESALE_CAP; KIND APPROVE, AMEND, TEMP_COMP (temporary compensating tariff: a cut), EMERGENCY, CAP_CUT, PRICE_CAP, NEWS, ORDER, PERIOD; SOURCE_ID D<gov.kz document>, N<gov.kz news>_<n>, V…/G… adilet act). item_name: service | decision | company | order | effective date and its basis | change | source URL. (1) КРЕМ/ДКРЕМ orders from the gov.kz «krem» documents listing, read from the TITLE (the order files are scans): 3 413 records 2011-2026, value NaN; effective date stated in 178, estimated as the month after the order date in 2 689 and as the month after publication in 546 (only Карагандинская and Шымкент, which publish within days). (2) КРЕМ press releases: 90 records, 53 with the stated % change (2019-2026). (3) Minenergo electricity generation caps (orders 514 and 508-н/қ and their amendments, old.adilet.zan.kz): 20 acts 2019-2026, value = mean % change of the caps across producer groups for the effective year (16 with a value). (4) Minenergo wholesale gas caps by region (yearly orders 2014-2022, order 210 of 2023 with periods to 2027/28): 202 region-period events, value = % change against the previous period; the 2027-07 period is transformation «forecast». Coverage is uneven across regions: departments that put order dates in titles dominate (Карагандинская 1 116, Костанайская 753, Алматы 428 records; Мангистауская 15, Северо-Казахстанская 10). Sources overlap (a release may report an order that is also listed): aggregate by (date, region, service). See TARIFF_CHANGE_MONTHS for the months the CPI registered the changes."

  # Derived from CPI_DETAIL_MOM (run after it).
  - id: TARIFF_CHANGE_MONTHS
    name_ru: "Месяцы изменения цен на коммунальные услуги в ИПЦ (м/м), по услугам"
    name_en: "Months with a utility price change in the CPI (month on month), by service"
    agency: derived
    fetcher: tariff_jumps
    frequency: monthly
    unit: "percent change, month on month"
    transformation: "percent change, month on month (index - 100); flagged months only"
    category: prices
    threshold_pct: 3.0
    z_threshold: 5.0
    min_pct: 1.5
    note: "Derived, not published: the months in which the national CPI item of a utility moved by at least 3% m/m, or by at least 1.5% with a robust z-score (median/MAD over the item's history) of at least 5; both directions. Items ELECTRICITY, HOT_WATER, COLD_WATER, HEATING, SEWERAGE, NETWORK_GAS, LPG, GARBAGE, each a chain of the BNS item slugs of CPI_DETAIL_MOM across basket re-bases (item_name names the slug). Measures when a tariff change reached the prices BNS registers, NOT the decision date (TARIFF_DECISIONS); a change in one city moves the national item by a fraction of its size. National only: the regional CPI rows carry no utility items. 314 flagged months 2004-2026 (2026-09-27)."

  # ---------------------------------------------------------------- CIS Stat: the CIS countries since 1991 (added 2026-09-28)
  # scripts/fetchers/cisstat.py: the JSON service of the CIS Stat database «Статистика СНГ»
  # (new.cisstat.org/consstat). region = ISO3 of the reporting country, item = the measure.
  - id: CIS_GDP_VOLUME_INDEX
    name_ru: "Индексы физического объема ВВП стран СНГ (Статкомитет СНГ), в % к предыдущему году"
    name_en: "Real GDP volume index of the CIS countries (CIS Stat), percent of previous year"
    agency: cisstat
    fetcher: cisstat
    table: gdp_volume
    country: CIS
    region: by_country
    geography: "CIS and former-USSR countries (CIS Stat); region = ISO3 of the country"
    frequency: annual
    unit: "index, previous year = 100"
    category: international
    note: "CIS Stat fact 714662 «Индексы физического объема валового внутреннего продукта (в постоянных ценах; в процентах к предыдущему году)», annual 1991 onward. region = ISO3 (ARM, AZE, BLR, KAZ, KGZ, MDA, RUS, TJK, TKM, UKR, UZB; UKR to 2021, TKM from 1993, MDA/TJK from 1992); item GDP. Kazakhstan equals BNS GDP_REAL in all 35 years 1991-2025 (1991 89.0, 1992 94.7, 1993 90.8, 1994 87.4); Russia 1992 85.5, Kyrgyzstan 1993 84.5, Ukraine 1993 85.8. National data as reported to the committee; prefer it to IMF WEO / WDI for the 1990s CIS (see IMF_WEO_WORLD)."

  - id: CIS_CPI
    name_ru: "Индексы потребительских цен стран СНГ (Статкомитет СНГ): декабрь к декабрю и в среднем за год"
    name_en: "Consumer price indices of the CIS countries (CIS Stat): December on December and annual average"
    agency: cisstat
    fetcher: cisstat
    table: cpi
    country: CIS
    region: by_country
    geography: "CIS and former-USSR countries (CIS Stat); region = ISO3 of the country"
    frequency: annual
    unit: "index, same basis of the previous year = 100"
    category: international
    note: "CIS Stat fact 43370 «Индекс потребительских цен», December rows only. item <GROUP>.<BASIS>: GROUP TOTAL (all goods and services), GOODS, FOOD, NONFOOD, SERVICES; BASIS DEC_DEC = «к декабрю предыдущего года» (December on December), AVG = «период с начала года к соответствующему периоду предыдущего года» in December (annual average on annual average). Two separate items, never mixed. Kazakhstan TOTAL.DEC_DEC 1991-1999: 247.1, 3060.8, 2265.0, 1258.3, 160.33, 128.7, 111.16, 101.93, 117.83; TOTAL.AVG: 190.9, 1614.8, 1758.4, 1977.4, 276.2, 139.35, 117.39, 107.12, 108.31. Equal to BNS CPI_YOY December in all 15 common years 2011-2025. IMF WEO differs for 1994 (average 1 402% vs 1 877%, end of period 855% vs 1 158%). Coverage: UZB from 1997, TKM from 1993-94, UKR to 2021."

  - id: CIS_POPULATION
    name_ru: "Численность постоянного населения стран СНГ (Статкомитет СНГ): на начало года и среднегодовая, тыс. человек"
    name_en: "Resident population of the CIS countries (CIS Stat): at 1 January and annual average, thousand persons"
    agency: cisstat
    fetcher: cisstat
    table: population
    country: CIS
    region: by_country
    geography: "CIS and former-USSR countries (CIS Stat); region = ISO3 of the country"
    frequency: annual
    unit: "thousand persons"
    category: international
    note: "CIS Stat facts 44176 (at the start of the year; dated 1 January, as POPULATION_BOY_BY_REGION) and 44177 (annual average; dated 31 December). Items BOY, BOY.URBAN, BOY.RURAL, BOY.MEN, BOY.WOMEN (and BOY.MEN.URBAN … where given), AVG, AVG.URBAN, AVG.RURAL. Kazakhstan 1 Jan 1991 16 358.2, 1 Jan 1999 14 955.0; average 1991 16 404.95. 1 January stocks equal POPULATION_BOY_BNS within 0.4 thousand in all 36 years; the annual average equals POPULATION_BNS within 1.6 thousand except the census years 2008 (15 776.95 vs BNS 15 982.37) and 2021 (BNS 190.7 thousand lower) -- for Kazakhstan use the BNS series."

  - id: CIS_MIGRATION
    name_ru: "Международная миграция стран СНГ (Статкомитет СНГ): прибывшие, выбывшие, сальдо; по странам СНГ с 2016 г."
    name_en: "International migration of the CIS countries (CIS Stat): arrivals, departures, net; by CIS partner from 2016"
    agency: cisstat
    fetcher: cisstat
    table: migration
    country: CIS
    region: by_country
    geography: "CIS and former-USSR countries (CIS Stat); region = ISO3 of the reporting country"
    frequency: annual
    unit: "persons"
    category: international
    note: "CIS Stat facts 4650866 / 4679599 («Прибывшие/Выбывшие по потокам», persons; items ARRIVALS, DEPARTURES = «Международная миграция - всего», ARRIVALS.CIS / .NON_CIS and DEPARTURES.CIS / .NON_CIS where given) and 44243 / 44245 (by partner country, «Тип местности» = «Всего»; items ARRIVALS.<ISO3>, DEPARTURES.<ISO3>, 2016 onward, the reporting country's own row included). NET = ARRIVALS - DEPARTURES, computed here (transformation «arrivals minus departures»); the committee's own net fact 5320380 is not used (Kazakhstan 2016: -20 193 against 13 755 - 34 900 = -21 145). Kazakhstan 1991-1999: arrivals 170 787, 161 499, 111 082, 70 389, 71 137, 53 874, 38 067, 40 624, 41 320; departures 228 473, 317 760, 330 107, 477 068, 309 632, 229 412, 299 455, 243 663, 164 947. Equal to BNS MIGRATION_ARRIVALS / MIGRATION_DEPARTURES in 2000-2025 except 2008 (CIS Stat 46 404 / 45 287, BNS 46 113 / 44 813). «Неизвестно» and internal moves are not kept (the answer repeats them under a parent it does not show). No Turkmenistan as reporter."

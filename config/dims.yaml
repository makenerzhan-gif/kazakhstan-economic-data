    unit: "million KZT, stock at the end of the previous month (as at the date)"
    category: monetary
    note: "NBK page «Монетарный обзор НБК» (records JSON), stock at the end of each month from 1997-12, dated the first day of the next month (as at, like form 50): the year-month of reporting_date is the month-end, its day and published_at are noise. Item CB.<NBK key>, Russian label from the page. Equals form 50 (NBK_MONETARY_SURVEY) lines 1, 2.1, 2.3-2.6, 3, 3.1, 3.1.1 on all 44 common dates 2023-01..2026-08 within 0.9 mln (enforced). Quasi-fiscal line CB.n_d_a_r_non_banking = NBK claims on non-bank financial organisations (KSF, Problem Loans Fund; mostly equity: 5.09 of 5.32 trn at 2021-12): 146 208 mln at 2012-01-01 (end-2011), 1 230 126 (2018-01-01), 3 044 011 (2020-01-01), 5 317 553 (2022-01-01), 5 137 668 (2026-09-01). CB.n_d_a_r_rest_economy steps from 59 711 to 821 820 at 2015-07-01 (read as a ~750 bn NBK equity claim on public nonfinancial corporations; not named by the NBK). Identities enforced: n_i_r, n_e_a, net claims on government, l = n_e_a + n_d_a, l = liabilities, r_m = its parts; n_d_a = its published lines only through 2009-02-01 (from 2009-03-01 an unpublished line of 0.6-6.7 trn, as in form 50 line 2). Items «Минус: …» are positive numbers subtracted."

  - id: BANKS_SURVEY_HISTORY
    name_ru: "Монетарный обзор по банкам (история с 1998 г., данные страницы НБК)"
    name_en: "Monetary survey of banks (other depository corporations), history from 1998 (NBK page records)"
    agency: nbk
    fetcher: nbk_records
    survey: ODC
    frequency: monthly
    unit: "million KZT, stock at the end of the previous month (as at the date)"
    category: monetary
    note: "NBK page «Монетарный обзор по банкам» (records JSON), month-end stocks from 1998-01 dated the first day of the next month. Item ODC.<NBK key>. Quasi-fiscal lines: ODC.r_f_s_n_f_o = banks' claims on public nonfinancial organisations (897 205 mln at 2012-01-01, 318 120 at 2016-01-01, 605 536 at 2022-01-01, 1 239 746 at 2026-09-01; = IMF MFS_ODC); ODC.l_o = loans RECEIVED by banks, including from the NBK (728 538 at 2012-01-01 = IMF ODC loans 297 603 + liabilities to the central bank 430 937; 2 152 007 at 2022-01-01). ODC.r_f_n_b_f_i (claims on NBFIs) includes UAPF, insurers, KASE repo and BTA Bank after 2015 (3 315 926 at 2016-01-01) -- not development institutions only. The source has no record for 2003-04 and two for 2005-04; the one with reporting_date 2005-04-14 holds the 2003-04 values and is dated 2003-05-01 (it closes the BS = CB + ODC identity exactly). Identities enforced: d_a and l = n_e_a + d_a = liabilities, and BS claims on NBFIs / on the rest of the economy = CB + ODC from 2002-11-01."

  - id: BANKING_SYSTEM_SURVEY_HISTORY
    name_ru: "Монетарный обзор по банковской системе (история с 1997 г., данные страницы НБК)"

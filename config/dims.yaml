  # ---------------------------------------------------------------- development institutions' and quasi-fiscal holdings' balance sheets (added 2026-09-27)
  # scripts/fetchers/kase_ifrs.py: every statement the issuers file on KASE (documents API; FPKR/KZAG from a static
  # list of files left on the server after delisting) plus the KASE fin-data key indicators for `fin_data`.
  - id: DEVELOPMENT_INSTITUTIONS_BALANCE_SHEETS
    name_ru: "Балансы институтов развития и квазифискальных холдингов по отчетности на KASE (Байтерек, БРК, КФУ, АКК, Фонд проблемных кредитов, КазАгро, Самрук-Казына)"
    name_en: "Balance sheets of state development institutions and quasi-fiscal holdings from their KASE statements (Baiterek, DBK, Kazakhstan Sustainability Fund, Agrarian Credit Corporation, Problem Loans Fund, KazAgro, Samruk-Kazyna)"
    agency: kase
    fetcher: kase_ifrs
    issuers:
      BTRK: "Холдинг «Байтерек» (консолидированно)"
      BRKZ: "Банк развития Казахстана (консолидированно)"
      KFUS: "Казахстанский фонд устойчивости"
      AGKK: "Аграрная кредитная корпорация"
      FPKR: "Фонд проблемных кредитов (консолидированно)"
      KZAG: "НУХ «КазАгро» (консолидированно)"
      SKKZ: "ФНБ «Самрук-Казына» (консолидированно)"
      SKKZ_SEP: "ФНБ «Самрук-Казына» (отдельная отчетность)"
    fin_data: [BTRK, SKKZ]
    refresh_days: 7
    frequency: quarterly
    unit: "billion KZT, end of period"
    category: fiscal
    note: "Balance-sheet lines of the quarterly and annual statements on KASE, dated at the balance-sheet date; the latest statement wins when two give the same date (restatements). Item ISSUER.LINE: TOTAL_ASSETS, TOTAL_LIABILITIES, EQUITY (only columns with assets = liabilities + equity within 0.5% are kept), LOANS_CUSTOMERS, LOANS_BANKS, LOANS_ISSUED (SK: loans issued and finance-lease investments), FIN_LEASE, ACQUIRED_CLAIMS (FPK: rights of claim bought from banks), DEBT_SECURITIES (tenge bonds + Eurobonds), GOV_LOANS (loans and funds from the Government), PARENT_LOANS, BORROWINGS (loans received, funds of credit institutions), GOV_SUBSIDIES (deferred income from below-market state funding), CUSTOMER_FUNDS, DISTRIBUTION_RESERVE (equity reserve for conditional distribution: FPK's cumulative transfers to banks, -3 645.1 bn at 2019-12-31). Lines are summed over current and long-term rows. ISSUER.FD_TOTAL_ASSETS / FD_TOTAL_LIABILITIES / FD_EQUITY: KASE fin-data key indicators, for BTRK (year ends 2015-2017, quarterly from 2018-06) and SKKZ (half-yearly from 2006-12; liabilities from 2015-12). Issuers: BTRK consolidated from 2018-12 (no June statement 2020-2024); BRKZ from 2012-12; KFUS = АО «Казахстанский фонд устойчивости» (2017-; not the Problem Loans Fund) from 2019-12, absorbed Баспана 25.12.2019 (break: 1 536.6 bn at 2019-12-31 -> 2 909.1 bn at 2020-03-31); AGKK from 2012-12 (separate to 2021, consolidated from 2022, a break); FPKR = АО «Фонд проблемных кредитов» 2017-12 to 2021-06 (bonds annulled 21.09.2021, filing stopped; negative equity from 2018; the 2021-03-31 statement is on a different basis: assets 492.3 bn vs 352.4 at 2020-12-31 and 369.5 at 2021-06-30, no ACQUIRED_CLAIMS line); KZAG consolidated 2012-12 to 2020-09 (merged into BTRK in 2021); SKKZ consolidated from 2021-12 (dominated by KMG, KTZ, KAP); SKKZ_SEP = Samruk-Kazyna's separate balance sheet (Minfin Form 1), 2012-12 to 2016-03. Aggregation: quasi-fiscal total = BTRK + KZAG (to 2020-12) + FPKR + KFUS (+ SKKZ_SEP); never add a subsidiary to its parent (BTRK consolidates BRKZ, and AGKK via KazAgro from 2021; KZAG consolidates AGKK to 2020)."


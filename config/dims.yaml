  # ---------------------------------------------------------------- NBK cubes (fetcher nbk_cube, added 2026-11-07)
  # Forms that publish only the cells of a cross-tabulation; items are sums of rows (fetchers/nbk_cube.py).
  - id: FDI_GROSS_INFLOW_BY_INDUSTRY
    name_ru: "Валовой приток прямых иностранных инвестиций в Казахстан от иностранных прямых инвесторов, по видам экономической деятельности резидентов"

# Dimensional (item-level) datasets: national accounts broken down by ОКЭД section,
# by industry division, by expenditure component and by form of ownership.
#
# These live beside, not inside, config/indicators.yaml: macro_long.csv promises one
# value per (date, variable), and a breakdown has one value per (date, variable, item).
# They are read by scripts/update_dims.py and land in data/unified/macro_dims_long.csv.gz (gzip).
#
# Source is the xlsx export of each BNS dynamic table (…/api/iblock/element/<id>/file/ru/).
# The JSON cube export of the same element was checked for every table on 2026-09-14 and
# rejected: 4439 and 4435–4437 carry only regional/national totals there, 4453 stops at
# 2024, and 4446/4448 return 404. The xlsx is the file the model was hand-loaded from.
#
# layout — which parser in scripts/fetchers/bns_dims.py reads the sheet:
#   periods_across   one row per item (label in label_col), periods across the columns;
#                    the annual "YYYY год" columns are taken (the quarterly columns are
#                    year-to-date; a dataset with `periods: quarterly_ytd` takes those)
#   region_blocks    one block per region, one row per period inside the block, one column
#                    per item with the item code on the row under the names (5931); only the
#                    national block is taken; annual rows, or the year-to-date rows under
#                    `periods: quarterly_ytd`
#   year_subcolumns  one row per item, one header cell per year with several sub-columns;
#                    sub_offset picks the sub-column (0 = first); `periods: quarterly_subcolumns`
#                    reads the four «I–IV квартал» sub-columns as discrete quarters (5831)
#   year_quarters / year_months / year_sheets / year_blocks_* / month_rows / region_blocks_months /
#                    sector_columns — the quarterly national accounts and the rest of the page; each is
#                    described in scripts/fetchers/bns_dims.py's docstring
# periods — annual (default), quarterly_ytd or quarterly_subcolumns, see above. A quarterly
#   dataset is a sibling of an annual one (same element, same rows, same dictionary, id
#   suffixed _QUARTERLY) and says `frequency: quarterly`; `cumulation: year_to_date` marks
#   the flow tables (the outlier check then compares own-period contributions);
#   `transformation` is written into every processed row and the metadata, as the scalar
#   GDP_NOMINAL does; `years_from` drops earlier periods (5926's quarterly columns begin
#   in 2011).
# dictionary — how item labels become item codes: dictionaries/<name>.csv (code, name_ru,
#   match = case-insensitive regex on the normalised label); from_table = codes are in
#   the sheet itself. A data row whose label matches no dictionary entry stops the dataset
#   loudly (StructuralChangeError) — never silently dropped.
# Annual observations are dated 31 December, the convention this repo's other annual BNS
# series already follow; quarterly ones the first day of the last quarter they cover
# (2024-07-01 for January–September 2024, 2024-10-01 for the year), the period-start
# convention of lib/periods.py and of the scalar GDP_NOMINAL.
#
# World Bank (agency wb, scripts/fetchers/wb.py) and EIA (agency eia, scripts/fetchers/eia.py)
# datasets sit at the end of this file. They are world prices, not Kazakh statistics:
# region "world", country "WLD", US dollars. `table` (not `layout`) names the parser;
# `fallback_url` is the last confirmed link, used when the CMO page cannot be read.

version: 1


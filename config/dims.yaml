  - id: NBK_MONETARY_SURVEY
    name_ru: "Монетарный обзор Национального Банка РК (баланс НБК по статьям)"
    name_en: "Monetary survey of the National Bank of Kazakhstan (NBK balance sheet by line)"
    agency: nbk
    fetcher: nbk_classified
    form_id: "50"
    filters: {type: "mln. tenge"}
    item_fields:
      - field: code
        codes: {net_total_assets_ext: "1", net_assets_ir: "1.1", gross_assets_ir: "1.1.1", liab_ext: "1.1.2",
                assets_ext_nf: "1.2", net_assets_other_ext: "1.3", net_total_assets_dom: "2", net_claims_gov: "2.1",
                claims_gov: "2.1.1", liab_gov: "2.1.2", gross_assets_nf: "2.2", claims_banks: "2.3",
                claims_nonbanks: "2.4", claims_others: "2.5", net_claims_other: "2.6", total_liabilities: "3",
                liab_mbr: "3.0.a", liab_res_money: "3.1", liab_currency: "3.1.1", liab_deposits_banks: "3.1.2",
                liab_transf_dep_nonbanks: "3.1.3", liab_curr_acc_nonfin: "3.1.4", liab_other_dep_nonbanks: "3.2",
                liab_securities: "3.3", liab_credits: "3.4", liab_fin_derivatives: "3.5"}
        names: {net_total_assets_ext: "Чистые внешние активы", net_assets_ir: "Чистые международные резервы",
                gross_assets_ir: "Валовые международные резервы", liab_ext: "Внешние обязательства (со знаком минус)",
                assets_ext_nf: "Внешние активы Национального фонда", net_assets_other_ext: "Прочие чистые внешние активы",
                net_total_assets_dom: "Чистые внутренние активы", net_claims_gov: "Чистые требования к правительству",
                claims_gov: "Требования к правительству", liab_gov: "Обязательства перед правительством (со знаком минус)",
                gross_assets_nf: "Обязательства перед Национальным фондом (со знаком минус)",
                claims_banks: "Требования к банкам (нетто, чистое изъятие ликвидности со знаком минус)",
                claims_nonbanks: "Требования к небанковским финансовым организациям",
                claims_others: "Требования к прочим секторам", net_claims_other: "Прочие статьи (нетто)",
                total_liabilities: "Обязательства (итого)", liab_mbr: "Справочно: широкие резервные деньги (liab_mbr)",
                liab_res_money: "Резервные деньги", liab_currency: "Наличные деньги в обращении",
                liab_deposits_banks: "Депозиты банков", liab_transf_dep_nonbanks: "Переводные депозиты небанковских организаций",
                liab_curr_acc_nonfin: "Текущие счета нефинансовых организаций", liab_other_dep_nonbanks: "Прочие депозиты небанковских организаций",
                liab_securities: "Ценные бумаги НБК (ноты)", liab_credits: "Полученные займы", liab_fin_derivatives: "Производные финансовые инструменты"}
    min_items: 20
    sum_checks:
      - {total: "1", parts: ["1.1", "1.2", "1.3"]}
      - {total: "1.1", parts: ["1.1.1", "1.1.2"]}
      - {total: "2.1", parts: ["2.1.1", "2.1.2"]}
      - {total: "3", parts: ["1", "2"], tolerance: 5.0}
      - {total: "3.1", parts: ["3.1.1", "3.1.2", "3.1.3", "3.1.4"]}
    frequency: monthly
    unit: "million KZT, end of period"
    category: monetary
    note: "NBK formId=50, stocks at report_date, monthly from 2023-01. The API gives a mnemonic `code` with each row_code; item = row_code, Russian names read from the mnemonics and checked by the identities 1 = 1.1+1.2+1.3, 1.1 = 1.1.1+1.1.2, 2.1 = 2.1.1+2.1.2, 3 = 1+2, 3.1 = Σ3.1.x (enforced; liabilities carry a minus sign). 2 is not the sum of 2.1…2.6 (gap 0.9–6.5 trn, an unpublished line). 2.4 = NBK claims on non-bank financial institutions (KSF, Problem Loans Fund, DBK bonds) -- the NBK's quasi-fiscal channel. 3.0.a (liab_mbr) is a memo item whose exact definition is not published."

  # ---------------------------------------------------------------- NBK monetary surveys, full history (added 2026-09-27)

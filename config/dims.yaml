    category: monetary
    note: "NBK formId=445, stocks at report_date (the first day of the month after the reference month, like the scalar LOANS_* series). Quarterly 2022-01…2023-07, monthly from 2023-07. Item = CREDITOR.CURRENCY.BORROWER; OPS = «other public sector» (state development institutions); BANKS.KZT.BUS equals the scalar LOANS_BUSINESS_KZT. OPS.FX.BUS appears from 2025-06, OPS.FX.HH only in 2026-07. By 17.10.2026 the NBK renamed «other public sector» to «Other public sector entities» over the whole history (values unchanged); both names map to OPS."


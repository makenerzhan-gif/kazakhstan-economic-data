# Tax SCHEDULES of Kazakhstan that are not a single rate: scales by output or price, formula parameters, reduced rates.
# One item per bracket or parameter, as a monthly step series (dataset TAX_SCHEDULES, read like config/tax_rates.yaml:
# a value holds from its month until the next key; null ends it). Keys in the future (2027-01) are already in the law
# and appear in the data when their month comes.
# Compiled 2026-11-13 from the official register adilet.zan.kz (its JSON API serves every dated edition of an act:
# /api/documents/by-ngr/<NGR>, /api/documents/<uuid>/versions); the tables, quotes and edition dates are in
# docs/research_tax_scales_2026-11-13.md.
#   MET_OIL.Bnn            Закон от 10.12.2008 № 100-IV ст. 7 (2009-2010; ступень 7-10 млн т -- 14 %); НК 2008 ст. 336 в ред.
#                          Закона от 26.11.2010 № 356-IV (с 2011: 15 %); НК 2017 ст. 743; НК 2025 ст. 778 п. 1 пп. 1) (до конца 2026).
#   MET_OIL_2027.*         НК 2025 ст. 778 п. 1 пп. 2): matrix 10 output rows x 19 price columns (20 ... 200 USD/bbl), stored as
#                          rate = BASE_Bnn + ADD_Pppp (checked on all 190 cells). As printed, the column «200» is one point below
#                          «190»; the law does not say how prices between two column heads are treated.
#   MET_GAS*               НК 2008 ст. 336; НК 2017 ст. 743; НК 2025 ст. 778.
#   MET_GOLD, MET_SILVER, MET_URANIUM   НК 2025 ст. 781 (с 01.01.2026); prices per art. 780 (LBMA; Ux Weekly and TradeTech), quarterly.
#   EXCISE_PETROL.*, EXCISE_DIESEL.*   Постановления Правительства от 28.04.2025 № 280 (с 11.05.2025: excise = BASE + SHARE x
#                          (wholesale price - PRICE_DEDUCTED) when the price is above PRICE_THRESHOLD; petrol Аи-92/93, summer and
#                          inter-season diesel), от 05.12.2025 № 1049 (с 01.01.2026: all petrol and diesel, the price net of VAT and
#                          the threshold divided by 1,12 although VAT is 16 %), от 11.09.2026 № 816 (95 % с 01.09.2026). The monthly
#                          wholesale price is not published, so the excise actually charged cannot be computed here.
#   OIL_EXPORT_DUTY.Pnnn   Приказ МНЭ от 17.02.2016 № 81 (с 01.03.2016; the crude column is identical in all 22 editions to 24.05.2023);
#                          приказ от 14.08.2023 № 311-НҚ (в силе с 26.08.2023, first month September 2023: for 25-105 USD/bbl the duty
#                          equals the average price rounded to a whole number -- PER_DOLLAR_25_105); приказ от 17.04.2026 № 169-НҚ (то же).
#                          The price is the average of 20th to 20th, Urals and Brent until February 2023, Kebco and Brent after.
#   OIL_EXPORT_DUTY.ACTUAL_PRESS   The rate of the month as reported by news agencies -- SECOND-HAND, 28 months of 2023-11 ... 2026-11;
#                          the official monthly price table of the State Revenue Committee could not be read. In every month with both
#                          figures the rate equals the reported average price or its band.
#   RENT_TAX_OIL.Pnnn      НК 2008 ст. 303; НК 2017 ст. 716; НК 2025 ст. 749: one scale, unchanged 2009-2026 (Pnnn = upper bound of the band).
#   RENT_TAX_COAL          НК 2008 ст. 303 (2,1); НК 2017 ст. 716 (4,7 с 2018); Закон от 10.12.2020 № 382-VI (отменён с 01.01.2021).
#   VAT_*                  НК 2025 ст. 503 п. 2, 3.
source: "Налоговые кодексы 2008, 2017 и 2025 гг., закон о введении в действие Кодекса 2008 г., постановления Правительства об акцизах, приказы о вывозных таможенных пошлинах -- тексты и редакции по adilet.zan.kz, 2026-11-13; фактические ставки пошлины -- сообщения агентств."

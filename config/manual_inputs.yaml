# Every number in the GDP model that is NOT a pipeline series: where it came from, which
# vintage, who owns it and when it should be refreshed. Read by scripts/model_coverage.py,
# which walks every literal number in the workbook and reports the ones neither
# config/model_map.yaml nor this file claims. The phase-6 target: none unclaimed.
#
# An entry names a sheet and rows ([first, last], or a list mixing rows and ranges), and
# optionally `years: [first, last]` (default: every year column) or, for sheets without a
# calendar-year header, `columns: [A, Z]`. A pipeline mapping always takes precedence over
# an entry here — the entries describe what the pipeline does not deliver.
#
# kind:   history     values loaded by hand from earlier publications; not re-checked
#         assumption  the author's parameter or rule; changes only by the author's decision
#         external    a document that is not a pipeline source (ministry forecasts, PSER)
#         satellite   a sheet the model's calculation does not reference
#         review      a literal number where a formula or a source would be expected —
#                     listed so it is not forgotten, to be decided by the author
# vintage: when the numbers were last set, as far as it is known ("unknown" is honest).

version: 1

inputs:
  # ------------------------------------------------------------ «Внешние и внутренние факторы»
  - id: factors_history
    sheet: "Внешние и внутренние факторы"
    rows: [2, 331]
    years: [1991, 2022]
    kind: history
    source: "Публикации БНС, НБ РК, Всемирного банка и МВФ прошлых лет, загружены автором модели"
    vintage: "до 2025-01; версия источников не зафиксирована"
    owner: author
    refresh: "не сверяется; при желании — расширить years в model_map (пайплайн отдаёт ВБ с 1960 г., БНС с 2000/2010 г.)"

  - id: brent_agency_forecasts

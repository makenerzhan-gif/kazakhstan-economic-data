    rows: [3, 24]
    years: [2023, 2030]
    kind: external
    source: "Прогнозы Brent агентств (МВФ, ОПЕК, Bank of America, Barclays, Bloomberg, BMI, Commerzbank, Deutsche Bank, Fitch, Goldman Sachs, ING, JP Morgan, Moody's, Morgan Stanley, АБР, ЕАБР, S&P, Citi, HSBC), собранные автором; строка 3 — среднее строк 4–23"
    vintage: "2025-01 (ВБ строка 5 и EIA строка 4 за 2026–2027 — из пайплайна, CMO апрель 2026 / STEO сентябрь 2026)"
    owner: author
    refresh: "при пересборе консенсуса; 2023–2025 в строках 4–5 — прогнозы старых выпусков, не факт"

  - id: factors_oil_parameters

          the deficit could not be decomposed -- and for Kazakhstan the decomposition IS the story:
          in Q1 2026 goods ran a SURPLUS of 4,068.9 mln USD while primary income ran a DEFICIT of
          5,956.5 mln. The current account deficit is an income deficit, not a trade deficit.
          WHY NOT formId=481, WHICH HAS FOUR TIMES THE HISTORY. 481 ('standard presentation')
          carries the same five lines back to 2000-04-01 and its headline matches the stored series
          to six decimals. It was built out first and then REJECTED: on ten quarters in 2023-2024
          it returns TWO DIFFERENT AMOUNTS under an IDENTICAL classification signature -- e.g.
          2023-04-01 goods as both 5,169.046879 and 5,232.056879, a 1.2% gap. Nothing in the row
          distinguishes them; they look like two vintages of a revised figure with no vintage
          field. Choosing the larger, the smaller or the last-returned would each be a guess.
          Forms 479 (analytic presentation) and 483 (by resident sector) have the same defect on
          two quarters each. 324 has none.
          481 ALSO SERVES EXACT DUPLICATES AT SCALE: 28,704 rows returned, matching its own
          totalRows exactly (so not a pagination fault), of which only 14,975 are distinct, with
          some rows repeated FOUR TIMES inside a single page. That part is harmless -- identical
          rows collapse losslessly -- but it is worth recording, because a first pass here built
          a per-date dict that silently overwrote them and produced an identity check that looked
          like it passed without actually comparing what it claimed to.
          THE 'Goods' TRAP: on 324 the code 'Goods' appears TWICE -- the goods balance, and a
          sub-item under Travel -> Personal for goods bought by travellers, 0.0 throughout. They
          differ only in the instrument fields, so the full signature is pinned.
          FIELD-NAMING DIFFERENCE BETWEEN FORMS OF THE SAME PUBLICATION: 324 writes the unit as
          'mln USD' while 481 writes 'USD mln' -- same field, words in the opposite order. 324
          also pads instrument_type_code as ' Goods and services' and capitalises period as
          'Quarter'. Comparisons strip and case-fold, which absorbs the padding and the casing but
          NOT the word order; that had to be read off a live row.
          IDENTITY CHECKED ON EVERY FETCH: goods + services + primary + secondary must equal the
          current account. The form publishes all five independently, so this tests the row
          lookups rather than restating one number. All 24 quarters reconcile, and in the unified
          dataset the four components sum to exactly the stored CURRENT_ACCOUNT_BALANCE
          (-2008.012157 for 2026-04-01). Verified to FIRE when a component is perturbed.


      PPI:
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 703039
        format: json
        notes: >
          2026-08-30. Resolved in a later session by abandoning the stat.gov.kz open-data
          route entirely (elementId=1626's CSV was stale through Q4 2013 and its JSON
          malformed at the source -- see the original not_connected notes below, kept for

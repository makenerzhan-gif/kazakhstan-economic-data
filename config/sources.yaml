# Per-agency official source registry.
# THIS FILE MUST NEVER CONTAIN A GUESSED URL, ENDPOINT, OR DATASET ID.
# Every field is populated only after a research step actually confirms it (see
# reports/source_research_*.md for the evidence trail). Until confirmed, leave as null
# with status: pending_research.
#
# access_type: api | csv | xlsx | unavailable_automatic
# protection: none | captcha | login | antibot

agencies:
  bns:
    name: "Бюро национальной статистики АСПиР РК"
    website: "https://stat.gov.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl, not from memory. Download pattern is a
      redirect-based file API, no CAPTCHA/login/key required:
        GET https://stat.gov.kz/api/iblock/element/{elementId}/json/file/ru/  -> 302 -> static .json
        GET https://stat.gov.kz/api/iblock/element/{elementId}/csv/file/ru/   -> 302 -> static .csv (often actually TSV, UTF-8 BOM)
        GET https://stat.gov.kz/api/iblock/element/{elementId}/file/ru/       -> 302 -> static .xlsx
      elementId is per-indicator and was found by opening the indicator's page under
      /ru/open-data/<category>/<pageId>/ (national accounts, prices, labor, trade) or,
      for industrial production and investment, an /ru/industries/... section instead
      (these two are NOT listed under /open-data/ at all). No generic search-by-name API
      was found; taldau.stat.gov.kz appears to be an HTML search UI, not a JSON API — not tested as one.
      data.egov.kz general catalog was checked and REJECTED: GET /api/v4/dataset returns
      403 "API key is required", and no BNS datasets for these indicators were found listed there anyway.
    access_type: api
    protection: none
    endpoints:
      GDP_NOMINAL:
        status: confirmed_json
        page_url: "https://stat.gov.kz/ru/open-data/national-accounts/474289/"
        element_id: 4439
        download_url: "https://stat.gov.kz/api/iblock/element/4439/json/file/ru/"
        format: json_cube
        notes: >
          Production-method nominal GDP, quarterly cumulative, by region (terms/termNames/periods cube).
          National total row presence not yet confirmed — must check termNames for a
          "РЕСПУБЛИКА КАЗАХСТАН" entry vs summing regions; verify before trusting a parsed total.
      GDP_REAL:
        status: confirmed
        page_url: "https://taldau.stat.gov.kz/ru/Industry/GetIndustryByID/700894"
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 2979005
        format: json
        notes: >
          CRACKED 2026-08-30 by capturing the real browser request instead of guessing further.
          The earlier "found but not parseable" conclusion (below, kept for the trail) was hitting
          the WRONG endpoint (Api/GetIndexData) and missing p_measure_id plus the real meaning of
          the dictionary id, so it returned empty results even at HTTP 200. Used the Claude Browser
          tool to instrument XMLHttpRequest in a live session, load the page, and read the ACTUAL
          POST body the page's own ExtJS grid sends to /ru/NewIndex/GetIndexTreeData:
          p_parent_id=&p_index_id=2979005&p_keyword=&p_period_id=7&p_measure_id=7&
          p_term_id=741880&p_terms=741880&p_dicIds=67&idx=0&filter=[{"property":null,"value":null}]&id=
          (p_dicIds=67 is the REGIONS classifier dictionary id, not a term id -- previous attempts
          conflated the two). Independently re-verified with a plain, cookie-less `requests.post`
          -- confirmed fully stateless, no session/auth/CSRF needed at all.
          Response: JSON list of tree nodes; the root node (id=741880, "РЕСПУБЛИКА КАЗАХСТАН")
          carries annual values as keys like "y122009" (last 4 digits = year), representing the
          physical volume index of GDP (% of prior period) by production method, 2000-2025.
          A final-use-method variant also exists (indexId 700974, not fetched). A quarterly-
          cumulative period option (periodId=9) was seen in GetPeriodList's response but its
          data shape was not captured/verified -- left for a future pass. Now implemented in
          scripts/fetchers/bns.py:fetch_gdp_real and connected.
          --- Prior research trail (superseded, kept for context) ---
          It DOES exist: BNS's Taldau catalog (a separate system from the /open-data/ file API
          used for the other BNS indicators) lists it explicitly under "Статистика национальных
          счетов" as two series: "индекс физического объема валового внутреннего продукта
          методом производства" (indexId 2979005, production method) and "Индекс физического
          объема валового внутреннего продукта методом конечного использования" (indexId
          700974, final-use method) -- confirmed by fetching
          https://taldau.stat.gov.kz/ru/Industry/GetIndustryByID/700894 and reading its real
          link list, not guessed. Taldau's "NewIndex" delivery mechanism is a full internal ExtJS
          4.1.1 single-page app, not a simple parameterized file download like
          stat.gov.kz/api/iblock/. Reverse-engineered the term tree (single-dimension, region
          only, root id 741880 = "РЕСПУБЛИКА КАЗАХСТАН" with hasData:true) but blind parameter
          guesses against Api/GetIndexData and NewIndex/GetDynamics returned empty/500 -- resolved
          above by capturing the real browser request instead of guessing further.
      IND_PROD:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          RE-CHECKED 2026-08-30 (full content downloaded and parsed, not just HEAD-checked).
          Confirmed to be the EXACT SAME simple json_cube format as GDP_NOMINAL/UNEMPLOYMENT
          (list of {terms, termNames, periods} slices) -- not a merged-cell pivot table, and
          not materially harder to parse than the other cube-format indicators. Was simply not
          gotten to in the first pass. 3 dims: [region, industry, comparison_type];
          comparison_type has only one value in this file ('отчетный период к предыдущему
          периоду'); ALL periods are annual (2009-2023) -- correcting the earlier unverified
          note that monthly points might be present. National total row:
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Промышленность', 'отчетный период к предыдущему периоду'].
          Now implemented in scripts/fetchers/bns.py:fetch_ind_prod and connected.
      IND_PROD_MINING:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          2026-08-30. RESOLVES the industrial-production sub-sector gap noted as "not found"
          in earlier sessions (several Taldau keyword searches for "горнодобывающая
          промышленность", "обрабатывающая промышленность индекс", etc. had all returned
          zero results). Found by going back to IND_PROD's OWN already-connected source file
          (element_id=5809, the same one used for the whole-industry aggregate) and
          enumerating every distinct `industry` (termNames[1]) value present in it --
          405 total, including full product-level detail, but also the top-level NACE-style
          sections. Sub-sector row: ['РЕСПУБЛИКА КАЗАХСТАН', 'Горнодобывающая промышленность
          и разработка карьеров', 'отчетный период к предыдущему периоду']. Same 15 annual
          periods (2009-2023) as IND_PROD itself. fetch_ind_prod_mining.
      IND_PROD_MANUFACTURING:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          2026-08-30. Same file and discovery method as IND_PROD_MINING. Sub-sector row:
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Обрабатывающая промышленность', 'отчетный период к
          предыдущему периоду']. fetch_ind_prod_manufacturing.
      IND_PROD_ELECTRICITY:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          2026-08-30. Same file and discovery method as IND_PROD_MINING. Sub-sector row:
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Снабжение электроэнергией, газом, паром, горячей водой и
          кондиционированным воздухом', 'отчетный период к предыдущему периоду'].
          fetch_ind_prod_electricity.
      CPI:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/stat-prices/474295/"
        element_id: 1549
        download_url: "https://stat.gov.kz/api/iblock/element/1549/csv/file/ru/"
        format: tsv_utf8_bom
        columns: ["NAM", "DAT", "PERIOD", "КАТО", "LКАТО", "ССП", "LССП", "category_code", "category_name", "VAL"]
        notes: "Actually downloaded and parsed this session. PERIOD like 201911 = Nov 2019. Regional breakdown; filter LКАТО for national total."
      UNEMPLOYMENT:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/labor-statistics/474294/"
        element_id: 102790
        download_url: "https://stat.gov.kz/api/iblock/element/102790/json/file/ru/"
        format: json_cube
        notes: >
          Downloaded and parsed this session. Quarterly (LFS/ILO methodology). terms include
          region, locality, sex, age group, education -- filter for national/total/total/total/
          total row. SANITY-CHECKED 2026-08-30: this specific file (element_id 102790) only
          contains 10 quarters total (2023-03-31 .. 2025-06-30) for EVERY dimension combo, not
          just the national total -- confirmed by scanning every combo's periods, not just ours.
          This is a real limitation of this element_id, not a parsing bug. The page text says
          data exists "с 2001 года" (since 2001), which likely refers to a coarser (less
          dimensioned, no education breakdown) unemployment table elsewhere on BNS with much
          longer history -- that table was not located this session. Flagging so a future pass
          knows to look for it rather than assuming 2.5 years is all that exists.
      INVESTMENT:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-invest/"
        element_id: 5546
        download_url: "https://stat.gov.kz/api/iblock/element/5546/json/file/ru/"
        format: json_cube
        notes: >
          RE-CHECKED 2026-08-30 (full content downloaded and parsed). Same simple json_cube
          format again, not a harder structure -- was also just not gotten to in the first pass.
          4 dims: [region, locality, enterprise_size, cost_type]; national total row =
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Всего', 'Всего', 'Всего']. Real caveat found: there are TWO
          cube slices with that exact combo, covering non-overlapping years 2016-2018 and
          2019-2022 respectively -- looks like a classification/methodology break rather than a
          bug; the fetcher concatenates both (they don't overlap) and records the break in
          metadata rather than hiding it. Also: this file's actual coverage (2016-2022) is
          narrower than the "2003-2025" advertised on the human-facing page -- the older
          history was not located here and may live in a separate file. Now implemented in
          scripts/fetchers/bns.py:fetch_investment and connected.

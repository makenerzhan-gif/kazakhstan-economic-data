        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/international-trade/474298/"
        element_id: 446905
        download_url: "https://stat.gov.kz/api/iblock/element/446905/file/ru/"
        format: xlsx
        notes: >
          RE-CHECKED 2026-08-30, full content downloaded and parsed. No CSV/JSON variant exists
          for trade indicators, unlike the others -- and the file is LARGE (54MB currently,
          growing over time since BNS re-publishes the full history every month, not deltas).
          Structure: one sheet per year (plus a partial-year sheet for the current year, e.g.
          'январь-июнь 2026 года') with 2 description sheets skipped ('Метаданные', 'Показатель').
          Row 2 of each data sheet is a header with one label per month ('январь 2025 года',
          trailing '*' for preliminary months), each spanning 3 columns [tonnes, additional unit,
          thousand USD]. Row 4 is the national total, literally labeled 'Республики Казахстан' in
          column A -- the very first data row, before any regional/product breakdown. Raw XLSX
          archived via Git LFS (data/raw/bns/*.xlsx tracked) rather than plain git, given the file
          size and monthly full-republish pattern -- see UPDATE_LOG for the reasoning. Now
          implemented in scripts/fetchers/bns.py:fetch_exports and connected.
      IMPORTS:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/international-trade/474299/"
        element_id: 446906
        download_url: "https://stat.gov.kz/api/iblock/element/446906/file/ru/"
        format: xlsx
        notes: >
          Same structure/mechanism as EXPORTS (see its notes) -- even larger (93MB currently).
          Also Git-LFS-tracked. Now implemented in scripts/fetchers/bns.py:fetch_imports and connected.
      GDP_PER_CAPITA:

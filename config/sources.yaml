          (без учета резервов (провизий))' and BOTH rows carry five numbers, so the column-count
          check cannot separate them. The net figure is matched with an explicit exclusion of
          '(без учета'.
          NOT DERIVED, because it does not reconcile: gross assets minus IFRS provisions gives

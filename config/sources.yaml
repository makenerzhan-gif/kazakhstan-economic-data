        status: confirmed_xlsx
        download_url: "https://stat.gov.kz/ru/industries/economy/foreign-market/spreadsheets/?year=YYYY&name=19182&period=&type=spreadsheets"
        format: xlsx_table
        notes: >
          2026-09-25. «Основные показатели внешней торговли РК по странам» (312101): the listing page
          per publication year names each edition (row id bx_<n>_<elementId>); the file is
          /api/iblock/element/<elementId>/file/ru/ (xls or xlsx). Full-year editions: preliminary
          «(январь-декабрь YYYYг.)» in February, final «(YYYYг.)» in July; sheets 'YYYY' or '12_YYYY'
          (the 2021 edition also carries 12_2020). Columns: partner, turnover, share, exports, share,
          imports, share, thousand USD. KZ_IMPORTS_BY_PARTNER reads the same files.
      EXPORTS_VALUE_BY_COMMODITY_GROUP:
        status: confirmed_xlsx
        element_id: 446905
        download_url: "https://stat.gov.kz/api/iblock/element/446905/file/ru/"
        format: xlsx_table
        notes: >
          2026-09-15. The same 56–65 MB export workbook that feeds EXPORTS and OIL_EXPORTS_*, read
          by scripts/fetchers/bns_trade.py for the GDP model's 23 commodity groups
          (dictionaries/hs_export_groups.csv: HS headings, chapters or 6-digit lines). A group is
          the sum of its 6-digit lines over the regional blocks, with the per-month check that the
          regional rows reproduce the published national total (2 months of 2022 fail by 1–1.5 %
          and are skipped, as for OIL_EXPORTS_*). TOTAL is the national row. Not separable at 6
          digits and therefore not offered: gas condensate (2709 00 100 0) and the 'основные
          товары' subset of petroleum products — CRUDE_OIL is all of 2709, PETROLEUM_PRODUCTS all
          of 2710. Monthly, January 2019 – June 2026 at the time of writing; one raw copy per day
          shared with EXPORTS when that download happened first.
          2026-09-15, from about 07:50 UTC: the same element started serving a 23 KB workbook --
          only the Метаданные sheet and a per-region ANNUAL summary of «Товарооборот в иностранной
          валюте» (2020-2025), no monthly HS sheets -- both from the CI runner and from Almaty,
          while element 446906 (imports) still served its full 144 MB workbook (which, like the
          export one at 06:13 that morning, had grown by the 2015-2018 sheets). Whether this is a
          regeneration in progress or a re-pointed element is not known; the parser stops loudly on
          a workbook without year sheets and the derived EXPORTS / OIL_EXPORTS_* keep the last good
          data (through June 2026). Watch the daily report; if it persists, the monthly workbook has
          to be located again -- no other element id is asserted here.

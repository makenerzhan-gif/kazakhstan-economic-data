      EXTERNAL_DEBT_SERVICE (scope note):
        status: not_connected
        notes: >
          2026-09-01. The audit asked for external debt SERVICE. Two NBK forms carry the phrase and
          both were probed live; neither is usable, for the same two reasons.
          formId=346 'External debt service schedule' (242 rows, 2 dates) and formId=393
          'Outstanding Public Sector External Debt and Debt Service Schedule' (544 rows, 6 dates)
          are FORECASTS, not realised payments: their repayment_type values are literally
          'Principal (forecast)' and 'Interests  (forecast)'.
          Neither publishes a TOTAL. Both break the forecast across 11-13 forward repayment windows
          ('within 1-3 months', 'within 22-24 months', 'after 2 years', 'on demand', 'no
          information') and 4-5 economic sectors, with no 'Total' member in either dimension.
          Summing the windows would be an aggregate the source does not publish.
          Actual debt service paid is not exposed as a separate line; the interest component sits
          inside BOP_PRIMARY_INCOME, which IS connected. Left not connected rather than fabricated.


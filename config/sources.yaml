        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          RE-CHECKED 2026-08-30 (full content downloaded and parsed, not just HEAD-checked).
          Confirmed to be the EXACT SAME simple json_cube format as GDP_NOMINAL/UNEMPLOYMENT

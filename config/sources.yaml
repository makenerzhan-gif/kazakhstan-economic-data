        notes: >
          2026-09-02. Billion KZT, NET of provisions -- 74,226.8 at 01.07.2026. THIS IS THE
          FIGURE THE AUDIT ASKED FOR AND NBK COULD NOT SUPPLY: formId=1 lists 45 balance-sheet
          lines and publishes no total at all, formId=60 returns seven unlabelled rows per
          bank-date. ARDFM publishes the total outright.
          WHERE THE ROW ACTUALLY LIVES: 'Таблица 2. Структура совокупных активов' extracts as a
          heading and nothing else -- its data is rendered as a chart, not text. The asset rows

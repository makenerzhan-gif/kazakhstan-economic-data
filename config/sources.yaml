# Per-agency official source registry.
# THIS FILE MUST NEVER CONTAIN A GUESSED URL, ENDPOINT, OR DATASET ID.
# Every field is populated only after a research step actually confirms it (see
# reports/source_research_*.md for the evidence trail). Until confirmed, leave as null
# with status: pending_research.
#
# access_type: api | csv | xlsx | unavailable_automatic
# protection: none | captcha | login | antibot

agencies:
  bns:
    name: "Бюро национальной статистики АСПиР РК"
    website: "https://stat.gov.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl, not from memory. Download pattern is a
      redirect-based file API, no CAPTCHA/login/key required:
        GET https://stat.gov.kz/api/iblock/element/{elementId}/json/file/ru/  -> 302 -> static .json
        GET https://stat.gov.kz/api/iblock/element/{elementId}/csv/file/ru/   -> 302 -> static .csv (often actually TSV, UTF-8 BOM)
        GET https://stat.gov.kz/api/iblock/element/{elementId}/file/ru/       -> 302 -> static .xlsx
      elementId is per-indicator and was found by opening the indicator's page under
      /ru/open-data/<category>/<pageId>/ (national accounts, prices, labor, trade) or,
      for industrial production and investment, an /ru/industries/... section instead
      (these two are NOT listed under /open-data/ at all). No generic search-by-name API
      was found; taldau.stat.gov.kz appears to be an HTML search UI, not a JSON API — not tested as one.
      data.egov.kz general catalog was checked and REJECTED: GET /api/v4/dataset returns
      403 "API key is required", and no BNS datasets for these indicators were found listed there anyway.
    access_type: api
    protection: none
    endpoints:
      # ---- dimensional tables (config/dims.yaml, scripts/update_dims.py) ----
      FIXED_ASSETS_GROSS:
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        format: json_api
        notes: >
          2026-09-25. Taldau index 703214 (gross, end of year), 703203 (start of year), 703215 (net),
          703205 (commissioned), 703220 (depreciation): period 7, measure 1 (tenge), p_dicIds
          68,915,90,77,1161, p_terms 741880,741885,741927,455728,741908 -- asset term 455728
          «Основные средства» (tangible); the default 741881 adds intangibles. 703216 (wear) and
          703217 (renewal): measure 7, dictionaries 68,915,90,77. 2000-2025; the 2025 values equal the
          publication «Основные фонды РК (2025)» (element 347772). By section: p_parent_id=p_term_id=741885,
          idx=1; by asset type: 455728, idx=3 (config/dims.yaml FIXED_ASSETS_*_BY_*).
      HOURS_WORKED:
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        format: json_api
        notes: >
          2026-09-25. Taldau 703017 (man-hours, measure 112): annual on dictionaries 67,1212,2813,576
          (terms 741880,741885,3629946,741935) for 2000-2012 and 2017-2025; the section segment
          68,859,2813 carries 2013-2016 annual (lower coverage, not spliced) and the quarterly series
          from 2016-Q1 (HOURS_WORKED_QUARTERLY). 703018 (minutes per employee, measure 35) on the section
          segment from 2013 (HOURS_PER_EMPLOYEE).
      INCOME_SHARE_BY_DECILE:
        status: confirmed_xlsx
        download_url: "https://stat.gov.kz/ru/industries/labor-and-income/stat-life/spreadsheets/?name=18651&year=YYYY"
        format: xlsx_table
        notes: >
          2026-09-25. «Основные показатели дифференциации доходов населения»: 19 editions (annual 2022-2025,
          quarterly III 2022 - I 2026). Period from the cover sheet (the listing dates are unreliable: the
          2022 annual edition is listed as 24.04.2022, its cover says released 24.04.2023). Tables found by
          title: «Распределение доходов по 10-процентным группам населения» (bounds, share, mean) and
          «Основные показатели бедности» (depth, severity, Gini 10%/20%, top/bottom decile ratio; the national
          row is «Қазақстан Республикасы» in quarterly editions, «Республика Казахстан» in annual ones).
          History from Taldau (POST GetIndexTreeData): 704515 decile shares (p_dicIds 67,838, decile root
          term 742656, children 742657-742666), 704502 Gini, 704504 decile ratio, 704518 expenditure of the
          bottom/top decile (dictionaries 67,749,270,735,838). Taldau annual = editions exactly; Taldau
          quarterly lacks 2017-Q1..Q3, 2021-Q2, 2025-Q4, 2026-Q1 and differs in the 2nd decimal on some
          quarters, so it is used only before 2022-Q3.

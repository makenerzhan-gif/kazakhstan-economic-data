          the annual file (published 03.07.2026) became 'June 2026' at 23.5 trillion against
          July's 11.46 -- an impossible fall for a cumulative series, which is what exposed it.
          Editions are now told apart by the gap to their next publication, which each file
          states on its own cover: about a month for monthly, a year for annual. A monotonicity
          check also raises if a year-to-date value ever falls inside a calendar year, so this
          class of mistake cannot return silently. Series after the fix: 3.46, 4.94, 6.74, 9.51,

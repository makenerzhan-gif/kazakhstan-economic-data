          THE MIXED-PERIODICITY TRAP AGAIN, and this section is worse than the investment one: it
          publishes three cadences under the SAME sheet name and the SAME row label --
          335623 (+30d to next release, Январь-июль 2026), 347225 (+32d, Январь-июнь 2026),

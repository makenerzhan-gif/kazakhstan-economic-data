          period_id is 8 ("month with accumulation"), same complication as
          HOUSING_COMMISSIONED -- values are NOT monotonic within a year (2025: Jan=109.4
          declining to Dec=107.1), confirming this is a year-to-date CUMULATIVE AVERAGE, not
          a sum, and that December is genuinely BNS's own "the year's PPI" figure (same
          convention as CPI's annual figure). Classified across 5 dictionaries; params
          recovered via the live ExtJS component tree (measure_id=1,
          dicIds=67,848,2513,2854,3068, terms=741880,2695732,4150464,15698719,18716910).

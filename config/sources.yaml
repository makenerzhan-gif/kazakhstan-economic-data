        page_url: "https://taldau.stat.gov.kz/ru/Industry/GetIndustryByID/700894"
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 2709380
        format: json
        notes: >
          2026-08-30. Same Taldau mechanism as GDP_REAL (see its notes for how this was
          cracked) -- indexId found in the same national-accounts index list. Live-verified:
          HTTP 200, values in plausible KZT range for nominal GDP per capita. Implemented via
          scripts/fetchers/bns.py:_fetch_taldau_annual_index, wrapper fetch_gdp_per_capita.
      GDP_DEFLATOR:
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 2970978
        format: json
        notes: "Same mechanism as GDP_PER_CAPITA. fetch_gdp_deflator."
      GFCF:
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 700906
        format: json
        notes: >
          Same mechanism. This is the NATIONAL-ACCOUNTS gross fixed capital formation
          aggregate (счет товаров и услуг), distinct from the INVESTMENT indicator above
          (which is BNS's enterprise-survey-based "investment in fixed capital"). Both are
          legitimate but conceptually different series -- kept separate rather than merged.
          DATA GAP (sanity-checked 2026-08-30): years 2010-2013 are missing from this series
          (22 of 26 possible years present, 2000-2025) -- confirmed this is a real gap in the
          source, not a parsing bug (the SAME 4 years are missing from NET_EXPORTS and
          HOUSEHOLD_CONSUMPTION below too, consistently, while GDP_DEFLATOR/GDP_PER_CAPITA
          from the same category have no gap). Likely a national-accounts methodology/base-
          year revision that left these specific expenditure-side series unpublished for that
          window. fetch_gfcf.
      GFCF_VOLUME_INDEX:

      PAYMENTS_TOTAL_COUNT:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=418"
        format: json
        notes: >
          2026-09-02. formId=418 'Statistics of payment instruments (by transactions)',
          payment_instrument='Total', period='Month', type='thsd. transactions'. 71 monthly
          points, 2020-01 to 2026-06.
          WHY COUNTS: the dataset held PAYMENTS_TOTAL_VALUE, CASHLESS_PAYMENTS_VALUE,
          CASH_WITHDRAWALS_VALUE and PAYMENT_CARDS_VALUE -- all values. Value alone cannot separate
          people spending more from people transacting more often. The counts give average
          transaction size.
          CROSS-CHECK against those value series on all 71 shared dates: a cashless payment
          averages 12,600-13,600 KZT through the first half of 2026 and a cash withdrawal
          113,000-123,000 KZT -- withdrawals about NINE TIMES larger per transaction, the expected
          shape, and confirmation that the two forms share a date convention with no shift.
          THE SOURCE'S OWN TOTAL DOES NOT ALWAYS ADD UP, and this is REPORTED, NOT ENFORCED.
          Summing the ten instrument rows equals the published Total exactly on 66 of 71 months.
          On five -- 2020-06, 2022-07, 2024-10, 2024-11, 2024-12 -- the parts EXCEED the stated
          total, by 1,515 to 14,962 thousand transactions, with all ten instruments present. A hard
          identity guard would fail on real published data, so this follows the OIL_EXPORTS_VOLUME
          precedent: check every run, print the failing months to stderr, and raise only if more
          than a tenth fail. The PUBLISHED Total is what is stored -- the parts are not summed to
          replace it.
          The separate card identity (cashless + withdrawals = payment cards) DOES hold on every
          month within rounding, and is enforced as a hard guard.


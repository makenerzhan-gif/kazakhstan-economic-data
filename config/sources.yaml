  wb:
    name: "World Bank — Commodity Markets (Pink Sheet, Commodity Markets Outlook)"
    website: "https://www.worldbank.org/en/research/commodity-markets"
    status: confirmed
    notes: >
      Added 2026-09-15 as the sixth agency, for the GDP model's world-price block («Внешние и
      внутренние факторы»: 46 annual prices, 16 price indices, the World Bank Brent forecast) and
      for a standalone Brent series beside the IMF APSP (OIL_PRICE). Verified by downloading and
      reading every file named below; nothing here is from memory.
      HOW THE FILES ARE REACHED. The Commodity Markets page links the current files on
      thedocs.worldbank.org; the document id in the path changes with every release
      (…/5d903e848db1d1b83e0ec8f744e55570-0350012021/… was the January 2025 vintage, ending 2024;
      …/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/… the September 2026 one, ending 2025), so a
      hard-coded link goes stale within months. scripts/fetchers/wb.py reads the page (plain GET
      with a browser-like User-Agent, HTTP 200, 56 KB) and takes the links from it; the last
      confirmed link is the fallback and the manifest says which was used. The forecast table is
      linked as a PDF; the xlsx exists at the same path (checked for April 2026) and is what is read.
      WHAT THE FILES CARRY. No series codes any more (older vintages had a mnemonic row); the
      codes live in dictionaries/wb_commodities.csv (69 price series, modelled on those
      mnemonics) and wb_commodity_indices.csv (16), and their regexes match both the history
      file's names and the forecast table's ("Logs, Cameroon" / "Logs, Africa"). The annual file
      publishes rounded values (Brent 1960 = 1.6); the monthly file is the finer source.
      Next CMO update: 2 October 2026 (from the page and the forecast sheet's footer).
    access_type: xlsx
    protection: none
    endpoints:
      WB_COMMODITY_PRICES_ANNUAL:
        status: confirmed_xlsx
        download_url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Annual.xlsx"
        format: xlsx_table
        notes: "Sheet 'Annual Prices (Nominal)': names row, units row, one row per year 1960–2025; 69 series. 'Updated on September 02, 2026'. Also sheets Annual Indices (Nominal), Annual Prices/Indices (Real), Description, Definitions, Index Weights."
      WB_COMMODITY_INDICES_ANNUAL:
        status: confirmed_xlsx
        download_url: "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Annual.xlsx"
        format: xlsx_table
        notes: "Sheet 'Annual Indices (Nominal)': four header rows, each column named on one of them (the group tree); 16 indices, 2010=100, 1960–2025."
      WB_COMMODITY_PRICE_FORECASTS:
        status: confirmed_xlsx
        download_url: "https://thedocs.worldbank.org/en/doc/f3138644a1e8e2bb631399ae11d6c408-0050012026/related/CMO-April-2026-Forecasts.xlsx"

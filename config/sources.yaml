      OIL_PRICE:
        status: confirmed
        download_url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/9.0.0/G001.POILAPSP.USD.M"
        format: csv
        notes: >
          2026-09-01. Closes the audit's largest single gap: Kazakhstan is an oil exporter and
          the dataset carried NO oil price at all, so nothing linked world prices to exports,
          the budget or the National Fund. Found by listing /structure/dataflow/IMF.RES, which
          holds PCPS (Primary Commodity Price System) and CTOT alongside the WEO flow already
          in use.
          IMPORTANT about key discovery: this API answers a WRONG series key with HTTP 200 and
          an EMPTY body, not an error -- so a mistyped key looks like a working request that
          found nothing. Five plausible keys (W00.POILBRE..M and variants) all came back 200
          with only a header. The real key was read off a full wildcard download: dimension
          order is COUNTRY.INDICATOR.DATA_TRANSFORMATION.FREQUENCY and COUNTRY is the aggregate
          G001, not a country code. The parser now says so in its error text.
          The series is APSP -- the Average Petroleum Spot Price, a simple average of Brent,
          Dubai Fateh and WTI. PCPS carries NO standalone Brent series: its indicator codelist
          was checked and the only crude entries are POILAPSP and POPEC (OPEC basket); every
          other *OIL* code is an edible oil (coconut, olive, palm, rapeseed, soybean).
          A world price, NOT a Kazakhstan export price -- KEBCO trades at a differential to
          Brent that this series does not capture. 415 monthly points, 1992-01 to 2026-07.
          fetch_oil_price.
      COMMODITY_TERMS_OF_TRADE:
        status: confirmed
        download_url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/CTOT/5.0.1/KAZ.CEMPI_CTOTNX_TT.R_RW_IX.M"
        format: csv
        notes: >
          2026-09-01. IMF Commodity Terms of Trade, dataflow CTOT 5.0.1, dimension order
          COUNTRY.INDICATOR.WGT_TYPE.FREQUENCY. 24 series exist for KAZ; the terms-of-trade
          one is CEMPI_CTOTNX_TT.
          This is COMMODITY terms of trade, not overall terms of trade -- it covers the
          commodity basket only and says nothing about manufactured trade. The audit item it
          partially answers asked for the broader measure, which this is not.
          The source publishes rolling-weight and fixed-weight variants. Rather than pick one
          silently, BOTH are connected: rolling weights here, fixed weights as
          COMMODITY_TERMS_OF_TRADE_FIXED_WEIGHTS. Rolling weights suit a series running from
          1992 because a 1992 export basket misrepresents today's. 413 monthly points,
          1992-01 to 2026-05. fetch_commodity_terms_of_trade.

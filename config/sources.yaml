      TALDAU_PARAM_DISCOVERY (method):
        status: confirmed
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetSegmentList"
        format: json
        notes: >
          2026-09-01. Multi-dictionary Taldau indexes no longer need a live browser session.
          Two plain HTTP calls give their parameters:
          (1) GET /ru/NewIndex/GetIndex/<INDEX_ID>?keyword= and scrape the server-rendered
          JS literal with regex measure:\s*\{\s*id:\s*(\d+),\s*name:\s*"([^"]*)" --
          that value is p_measure_id. It must be options.measure, NOT preferredMeasure, which
          lists alternative display units and would give the wrong measure.
          (2) POST /ru/NewIndex/GetSegmentList with body node=<ID>&indexId=<ID>&periodId=<P>&keyword=
          returning a JSON array of valid dictionary combinations. Take element [0] (the site's
          own default, per its indexShortController fOnSectionStoreLoad which does
          `var selRec = rec[0];`), then p_dicIds = dicId split on '+' and joined with commas,
          and p_terms = termIds verbatim. No cookies, session or CSRF token are required.
          VERIFIED independently against three parameter sets captured by browser in earlier
          sessions and reproduced exactly: LIFE_EXPECTANCY/703906 (measure 154, dicIds 67,64,576),
          RETAIL_TRADE/702038 (measure 1, dicIds 67,59,676, 3 segments) and CONSTRUCTION/701885
          (dicIds 68,60,71,2987, 6 segments). RETAIL_TRADE's fetched value also matched the
          already-shipped series (27.7 trillion KZT).
          CAVEAT, important: segment [0] is only the DEFAULT selection, not necessarily a total.
          For indexId 703694 (households with ICT) it resolves to the device type 'Телевизор',
          and for 702755 (enterprises with innovations) to 'Подвергавшиеся усовершенствованию +
          Дополнительные услуги' -- narrow slices that would be wrong to publish under the
          index's general name. Always read the segment's termNames (separated by ' + ', NOT by
          commas) and confirm every term is a genuine total before connecting an index.

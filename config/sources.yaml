  minfin:
    name: "Министерство финансов Республики Казахстан"
    website: "https://minfin.gov.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl + actually downloading and unzipping the XLSX
      files to inspect real sheet/table names, not from memory. Minfin content is served
      through the gov.kz unified platform's public content-manager API, not a dedicated
      minfin.gov.kz API. No auth/CAPTCHA -- plain curl works, no cookies/session needed.
      This is a frontend/content API (no Swagger/OpenAPI spec found), so treat it as less
      guaranteed-stable than a dedicated data API, though it worked consistently across
      ~10 years of historical documents (2018-2026) during testing.
      Pattern: GET https://www.gov.kz/api/v1/public/content-manager/documents?sort-by=created_date:DESC&page=1&size=N&directions=<id>[&activities=<id>]
      -> JSON list of documents -> pick newest matching title -> file at
      https://www.gov.kz + full_text[0].document (an .xlsx).
      Rejected alternatives: data.egov.kz "respublikalyk_budzhet" dataset is archived
      since 2019 (not current); data.egov.kz "external_debt21" is National Bank external
      debt, not the broader government-debt concept needed here; openbudget.kz was
      unreachable (connection reset/timeout) in every attempt this session -- unconfirmed,
      do not rely on it without re-testing when unblocked.

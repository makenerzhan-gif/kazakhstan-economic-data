      OIL_PRODUCTION:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        format: xlsx
        notes: >
          2026-09-01. CORRECTS a second wrong conclusion: earlier passes recorded that BNS does
          not publish oil production. It is genuinely absent from Taldau's full 3,700-indicator
          catalogue and from the stat.gov.kz industrial cubes (index-only, stale at 2023) -- but
          it IS in the monthly publication 'Основные показатели работы промышленности
          Республики Казахстан', sheet 3 ('Произведено продукции в натуральном выражении'), row
          'Нефть, включая конденсат газовый, тыс.тонн'.
          Each edition reports ONE month, in columns [previous month, reporting month, YTD, same
          month last year, same period last year, ...], so one download yields three monthly
          points. The YTD columns are a different frequency and are deliberately not mixed in.
          The site keeps only a SHORT ARCHIVE -- three monthly editions on 2026-09-01 -- so the
          series is ACCUMULATED across runs and grows month by month, as EXCHANGE_RATE does.
          It starts with 7 points and has gaps, which is stated rather than filled.
          Element ids are resolved from the page on every run, never hardcoded: editions are
          republished under new ids. Only workbooks that actually contain the expected sheet and
          row are used, and the reporting month comes from each file's own cover date.
          VALIDATED: the 2026 year-to-date column reads 53,208 thousand tonnes over seven months
          (~91 Mt/year) against 58,358 for the same period of 2025 (~100 Mt/year), an 8.8%
          year-on-year fall consistent with Kazakhstan cutting back from its 2025 record. And
          ~100 Mt of 2025 output against OIL_EXPORTS_VOLUME's 76.3 Mt is a 76%% export ratio,
          with the rest refined domestically. fetch_oil_production.
      INDUSTRIAL_OUTPUT:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        format: xlsx
        notes: >
          2026-09-01. Sheet 2 of the monthly publication 'Основные показатели работы
          промышленности', the same source as OIL_PRODUCTION. This is what answers the audit's
          STALENESS finding: the existing IND_PROD and its three sub-indices are ANNUAL and stop
          at 2023 because they come from the stat.gov.kz cubes, which are no longer updated. The
          publication layer carries the same concepts monthly and current.
          Column layout read from the sheet's own header: [enterprises, previous month,
          reporting month, year-to-date, index vs previous month, index vs same month last year,
          index for period]. After dropping non-numeric cells those are positions 0..6, so
          values are at 1 and 2 and the year-on-year index at 5.
          THE UNIT IS WRITTEN THREE WAYS across editions -- 'млн. теңге', 'млн.теңге' and
          'млн. тенге' (Russian е for Kazakh ң). All three are the same unit, so the guard
          strips whitespace and accepts either spelling; it fired twice during development,
          which is how the variants were found. Same class of inconsistency as the
          Latin/Cyrillic H in Minfin's sheets.
          Value series gain two points per edition (reporting and previous month), the index
          series one. Accumulated across runs -- only about three editions stay online.
          Internal check at July 2026: mining 2,539,304 + manufacturing 2,605,482 = 5,144,786

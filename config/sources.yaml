# Per-agency official source registry.
# THIS FILE MUST NEVER CONTAIN A GUESSED URL, ENDPOINT, OR DATASET ID.
# Every field is populated only after a research step actually confirms it (see
# reports/source_research_*.md for the evidence trail). Until confirmed, leave as null
# with status: pending_research.
#
# access_type: api | csv | xlsx | unavailable_automatic
# protection: none | captcha | login | antibot

agencies:
  bns:
    name: "Бюро национальной статистики АСПиР РК"
    website: "https://stat.gov.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl, not from memory. Download pattern is a
      redirect-based file API, no CAPTCHA/login/key required:
        GET https://stat.gov.kz/api/iblock/element/{elementId}/json/file/ru/  -> 302 -> static .json
        GET https://stat.gov.kz/api/iblock/element/{elementId}/csv/file/ru/   -> 302 -> static .csv (often actually TSV, UTF-8 BOM)
        GET https://stat.gov.kz/api/iblock/element/{elementId}/file/ru/       -> 302 -> static .xlsx
      elementId is per-indicator and was found by opening the indicator's page under
      /ru/open-data/<category>/<pageId>/ (national accounts, prices, labor, trade) or,
      for industrial production and investment, an /ru/industries/... section instead
      (these two are NOT listed under /open-data/ at all). No generic search-by-name API
      was found; taldau.stat.gov.kz appears to be an HTML search UI, not a JSON API — not tested as one.
      data.egov.kz general catalog was checked and REJECTED: GET /api/v4/dataset returns
      403 "API key is required", and no BNS datasets for these indicators were found listed there anyway.
    access_type: api
    protection: none
    endpoints:
      GDP_NOMINAL:
        status: confirmed_json
        page_url: "https://stat.gov.kz/ru/open-data/national-accounts/474289/"
        element_id: 4439
        download_url: "https://stat.gov.kz/api/iblock/element/4439/json/file/ru/"
        format: json_cube
        notes: >
          Production-method nominal GDP, quarterly cumulative, by region (terms/termNames/periods cube).
          National total row presence not yet confirmed — must check termNames for a
          "РЕСПУБЛИКА КАЗАХСТАН" entry vs summing regions; verify before trusting a parsed total.
      GDP_REAL:
        status: confirmed
        page_url: "https://taldau.stat.gov.kz/ru/Industry/GetIndustryByID/700894"
        download_url: "https://taldau.stat.gov.kz/ru/NewIndex/GetIndexTreeData"
        index_id: 2979005
        format: json
        notes: >
          CRACKED 2026-08-30 by capturing the real browser request instead of guessing further.
          The earlier "found but not parseable" conclusion (below, kept for the trail) was hitting
          the WRONG endpoint (Api/GetIndexData) and missing p_measure_id plus the real meaning of
          the dictionary id, so it returned empty results even at HTTP 200. Used the Claude Browser
          tool to instrument XMLHttpRequest in a live session, load the page, and read the ACTUAL
          POST body the page's own ExtJS grid sends to /ru/NewIndex/GetIndexTreeData:
          p_parent_id=&p_index_id=2979005&p_keyword=&p_period_id=7&p_measure_id=7&
          p_term_id=741880&p_terms=741880&p_dicIds=67&idx=0&filter=[{"property":null,"value":null}]&id=
          (p_dicIds=67 is the REGIONS classifier dictionary id, not a term id -- previous attempts
          conflated the two). Independently re-verified with a plain, cookie-less `requests.post`
          -- confirmed fully stateless, no session/auth/CSRF needed at all.
          Response: JSON list of tree nodes; the root node (id=741880, "РЕСПУБЛИКА КАЗАХСТАН")
          carries annual values as keys like "y122009" (last 4 digits = year), representing the
          physical volume index of GDP (% of prior period) by production method, 2000-2025.
          A final-use-method variant also exists (indexId 700974, not fetched). A quarterly-
          cumulative period option (periodId=9) was seen in GetPeriodList's response but its
          data shape was not captured/verified -- left for a future pass. Now implemented in
          scripts/fetchers/bns.py:fetch_gdp_real and connected.
          --- Prior research trail (superseded, kept for context) ---
          It DOES exist: BNS's Taldau catalog (a separate system from the /open-data/ file API
          used for the other BNS indicators) lists it explicitly under "Статистика национальных
          счетов" as two series: "индекс физического объема валового внутреннего продукта
          методом производства" (indexId 2979005, production method) and "Индекс физического
          объема валового внутреннего продукта методом конечного использования" (indexId
          700974, final-use method) -- confirmed by fetching
          https://taldau.stat.gov.kz/ru/Industry/GetIndustryByID/700894 and reading its real
          link list, not guessed. Taldau's "NewIndex" delivery mechanism is a full internal ExtJS
          4.1.1 single-page app, not a simple parameterized file download like
          stat.gov.kz/api/iblock/. Reverse-engineered the term tree (single-dimension, region
          only, root id 741880 = "РЕСПУБЛИКА КАЗАХСТАН" with hasData:true) but blind parameter
          guesses against Api/GetIndexData and NewIndex/GetDynamics returned empty/500 -- resolved
          above by capturing the real browser request instead of guessing further.
      IND_PROD:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-industrial-production/"
        element_id: 5809
        download_url: "https://stat.gov.kz/api/iblock/element/5809/json/file/ru/"
        format: json_cube
        notes: >
          RE-CHECKED 2026-08-30 (full content downloaded and parsed, not just HEAD-checked).
          Confirmed to be the EXACT SAME simple json_cube format as GDP_NOMINAL/UNEMPLOYMENT
          (list of {terms, termNames, periods} slices) -- not a merged-cell pivot table, and
          not materially harder to parse than the other cube-format indicators. Was simply not
          gotten to in the first pass. 3 dims: [region, industry, comparison_type];
          comparison_type has only one value in this file ('отчетный период к предыдущему
          периоду'); ALL periods are annual (2009-2023) -- correcting the earlier unverified
          note that monthly points might be present. National total row:
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Промышленность', 'отчетный период к предыдущему периоду'].
          Now implemented in scripts/fetchers/bns.py:fetch_ind_prod and connected.
      CPI:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/stat-prices/474295/"
        element_id: 1549
        download_url: "https://stat.gov.kz/api/iblock/element/1549/csv/file/ru/"
        format: tsv_utf8_bom
        columns: ["NAM", "DAT", "PERIOD", "КАТО", "LКАТО", "ССП", "LССП", "category_code", "category_name", "VAL"]
        notes: "Actually downloaded and parsed this session. PERIOD like 201911 = Nov 2019. Regional breakdown; filter LКАТО for national total."
      UNEMPLOYMENT:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/labor-statistics/474294/"
        element_id: 102790
        download_url: "https://stat.gov.kz/api/iblock/element/102790/json/file/ru/"
        format: json_cube
        notes: "Downloaded and parsed this session. Quarterly (LFS/ILO methodology). terms include region, locality, sex, age group -- filter for national/total/total/total row."
      INVESTMENT:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/industries/business-statistics/stat-invest/"
        element_id: 5546
        download_url: "https://stat.gov.kz/api/iblock/element/5546/json/file/ru/"
        format: json_cube
        notes: >
          RE-CHECKED 2026-08-30 (full content downloaded and parsed). Same simple json_cube
          format again, not a harder structure -- was also just not gotten to in the first pass.
          4 dims: [region, locality, enterprise_size, cost_type]; national total row =
          ['РЕСПУБЛИКА КАЗАХСТАН', 'Всего', 'Всего', 'Всего']. Real caveat found: there are TWO
          cube slices with that exact combo, covering non-overlapping years 2016-2018 and
          2019-2022 respectively -- looks like a classification/methodology break rather than a
          bug; the fetcher concatenates both (they don't overlap) and records the break in
          metadata rather than hiding it. Also: this file's actual coverage (2016-2022) is
          narrower than the "2003-2025" advertised on the human-facing page -- the older
          history was not located here and may live in a separate file. Now implemented in
          scripts/fetchers/bns.py:fetch_investment and connected.
      EXPORTS:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/international-trade/474298/"
        element_id: 446905
        download_url: "https://stat.gov.kz/api/iblock/element/446905/file/ru/"
        format: xlsx
        notes: >
          RE-CHECKED 2026-08-30, full content downloaded and parsed. No CSV/JSON variant exists
          for trade indicators, unlike the others -- and the file is LARGE (54MB currently,
          growing over time since BNS re-publishes the full history every month, not deltas).
          Structure: one sheet per year (plus a partial-year sheet for the current year, e.g.
          'январь-июнь 2026 года') with 2 description sheets skipped ('Метаданные', 'Показатель').
          Row 2 of each data sheet is a header with one label per month ('январь 2025 года',
          trailing '*' for preliminary months), each spanning 3 columns [tonnes, additional unit,
          thousand USD]. Row 4 is the national total, literally labeled 'Республики Казахстан' in
          column A -- the very first data row, before any regional/product breakdown. Raw XLSX
          archived via Git LFS (data/raw/bns/*.xlsx tracked) rather than plain git, given the file
          size and monthly full-republish pattern -- see UPDATE_LOG for the reasoning. Now
          implemented in scripts/fetchers/bns.py:fetch_exports and connected.
      IMPORTS:
        status: confirmed
        page_url: "https://stat.gov.kz/ru/open-data/international-trade/474299/"
        element_id: 446906
        download_url: "https://stat.gov.kz/api/iblock/element/446906/file/ru/"
        format: xlsx
        notes: >
          Same structure/mechanism as EXPORTS (see its notes) -- even larger (93MB currently).
          Also Git-LFS-tracked. Now implemented in scripts/fetchers/bns.py:fetch_imports and connected.

  nbk:
    name: "Национальный Банк Республики Казахстан"
    website: "https://nationalbank.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl (real, current numbers matching public press),
      not from memory. Open Data Repository base: https://data.nationalbank.kz/api/v1
      (base URL extracted from the portal's JS bundle, not guessed). No auth/CAPTCHA on
      any data-serving endpoint used below; the full Swagger spec at /api/v3/api-docs IS
      gated behind login, but that's irrelevant since the actual data endpoints work anonymously.
      Generic XLSX export also works for any formId: /api/v1/data/export?formId=<id>&format=xlsx.
    access_type: api
    protection: none
    endpoints:
      BASE_RATE:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data/base-rate"
        format: json
        notes: >
          Full history returned in one call (no working date-filter params found -- they're
          silently ignored). Fields: effectiveDate, rate, corridorLower, corridorUpper.
          History verified back to 2024-10-14. Also GET /api/v1/data/indicators gives a
          small "latest snapshot" including baseRate for quick current-value checks.
      EXCHANGE_RATE:
        status: confirmed
        current_url: "https://data.nationalbank.kz/api/v1/data/exchange-rates"
        historical_url_pattern: "https://nationalbank.kz/rss/get_rates.cfm?fdate={DD.MM.YYYY}"
        format: "json (current, today only) / xml (historical, per-date)"
        notes: >
          The JSON current-rate endpoint ignores every date-filter param tried and always
          returns today's snapshot only -- NOT usable alone for a historical daily series.
          Historical daily series must be built by looping get_rates.cfm?fdate=DD.MM.YYYY
          per date (legacy XML endpoint, confirmed live with a real distinct historical value).
          An XLSX bulk-export button exists on the human page but its underlying request URL
          was not captured this session -- not needed since the XML loop already works.
      M2:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=51"
        export_xlsx_url: "https://data.nationalbank.kz/api/v1/data/export?formId=51&format=xlsx"
        row_metadata_xlsx: "https://nationalbank.kz/file/download/133417"
        format: json
        notes: >
          RESOLVED 2026-08-30. NBK does not label this dataset "M2/M3" in the API -- it's
          formId 51, "Денежная база и агрегаты широкой денежной массы" (monetary base and
          broad money aggregates), monthly, 2021-12-01 onward, broken out by row_code (1,
          1.1, 1.2, 2, 3, 4, 4.1, 4.2, 5, 5.1, 5.2, etc). The downloaded metadata XLSX
          (row_metadata_xlsx above) explains the M0/M1/M2/M3 CONCEPTS but has no row_code
          column -- it does NOT map codes to labels. Resolved instead by opening the
          human-facing table at https://nationalbank.kz/ru/monetarybase/denezhnaya-baza-i-agregaty-shirokoy-denezhnoy-massy
          in a real browser: its numbered rows ("4. M2", "5. M3 (денежная масса)") match
          row_code exactly, and the actual amounts line up 1:1 with the API (e.g. row_code=4,
          report_date=2026-07-01 -> 48128860.58 vs the page's M2 column for the corresponding
          month -> 48128861). row_code="4" = M2, row_code="5" = M3 -- verified both
          structurally (row numbering) and numerically (matching values), not guessed. Note:
          API's report_date appears to run about one month ahead of the page's own column
          labels for the same number -- stored verbatim, not shifted. Now implemented in
          scripts/fetchers/nbk.py:fetch_m2 and connected.
      M3:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=51"
        format: json
        notes: "row_code=5. See M2 notes above for how the mapping was verified. Now implemented in scripts/fetchers/nbk.py:fetch_m3 and connected."
    publication_calendar_url: "https://nationalbank.kz/ru/statisticalinformation/grafik-vypuska-statisticheskoy-informacii"
    publication_calendar_notes: >
      Verified live HTML page, filterable by year/category, with an XLSX export button
      whose underlying URL wasn't captured (not blocking). Confirmed real entries seen:
      avg exchange rates monthly (next release 2026-09-01), money supply monthly (next
      release 2026-09-15). A second calendar URL (kalendar-rasprostraneniya-dannyh) and a
      base-rate-decision-specific schedule page were found only via search, NOT fetched/
      confirmed this session -- do not rely on either without verifying first.

  minfin:
    name: "Министерство финансов Республики Казахстан"
    website: "https://minfin.gov.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl + actually downloading and unzipping the XLSX
      files to inspect real sheet/table names, not from memory. Minfin content is served
      through the gov.kz unified platform's public content-manager API, not a dedicated
      minfin.gov.kz API. No auth/CAPTCHA -- plain curl works, no cookies/session needed.
      This is a frontend/content API (no Swagger/OpenAPI spec found), so treat it as less
      guaranteed-stable than a dedicated data API, though it worked consistently across
      ~10 years of historical documents (2018-2026) during testing.
      Pattern: GET https://www.gov.kz/api/v1/public/content-manager/documents?sort-by=created_date:DESC&page=1&size=N&directions=<id>[&activities=<id>]
      -> JSON list of documents -> pick newest matching title -> file at
      https://www.gov.kz + full_text[0].document (an .xlsx).
      Rejected alternatives: data.egov.kz "respublikalyk_budzhet" dataset is archived
      since 2019 (not current); data.egov.kz "external_debt21" is National Bank external
      debt, not the broader government-debt concept needed here; openbudget.kz was
      unreachable (connection reset/timeout) in every attempt this session -- unconfirmed,
      do not rely on it without re-testing when unblocked.
    access_type: xlsx
    protection: none
    endpoints:
      GOV_REVENUE:
        status: confirmed
        listing_url: "https://www.gov.kz/api/v1/public/content-manager/documents?directions=448"
        title_marker: "Dynamics of execution"
        target_row: "I. INCOME"
        format: xls
        frequency: annual
        notes: >
          RESOLVED 2026-08-30. Rather than parsing a row out of the monthly Statistical
          Bulletin (a 50-sheet workbook where the target sheet name/index shifts between
          editions -- what "confirmed_source_parsing_not_implemented" was waiting on), found
          a much safer source: a small, purpose-built "Dynamics of execution of the republican
          budget from 2014 to 2025" document under the same directions=448 listing (97KB .xls,
          sheets ['Metadata', 'Dynamics 2014-2025']). Row 'I. INCOME' (col B onward = years
          2014-2025) is the republic-level total, confirmed by reading the file directly.
          Unit confirmed as "KZT million" from the file's own Metadata sheet. The document is
          discovered dynamically each run (title contains "Dynamics of execution" /
          "Динамика исполнения") rather than a hardcoded URL, so a future republished version
          is picked up automatically. Frequency is ANNUAL (not monthly as originally assumed --
          corrected in indicators.yaml). Now implemented in
          scripts/fetchers/minfin.py:fetch_gov_revenue and connected.
      GOV_EXPENDITURE:
        status: confirmed
        listing_url: "https://www.gov.kz/api/v1/public/content-manager/documents?directions=448"
        title_marker: "Dynamics of execution"
        target_row: "II.Expences"
        format: xls
        frequency: annual
        notes: "Same document/mechanism as GOV_REVENUE, row 'II.Expences' instead of 'I. INCOME'. Now implemented in scripts/fetchers/minfin.py:fetch_gov_expenditure and connected."
      GOV_DEBT:
        status: confirmed
        listing_url: "https://www.gov.kz/api/v1/public/content-manager/documents?directions=261&activities=14610"
        target_row_label: "Total State and State Guaranteed debt, State Guarantees Debt (Subsidiary Liabilities) (I + II + III)"
        format: "xlsx (recent) / xls (older, pre-~2022)"
        frequency: quarterly
        notes: >
          RESOLVED 2026-08-30. No combined "dynamics" file exists for debt (unlike revenue/
          expenditure) -- it's one quarterly point-in-time snapshot document per quarter. Cross-
          checked 3 vintages (Jan 2021 .xls, Jul 2024 .xlsx, Jul 2026 .xlsx): the target row's
          label text is stable across all three even though its exact row POSITION and leading-
          column offset shift (a debt sub-category was added/removed over time) -- so the
          fetcher searches by label text and takes the row's last two numeric cells (tenge,
          usd) rather than a fixed column index. Values are in thousand KZT at the source;
          converted to million KZT in the fetcher for consistency with GOV_REVENUE/
          GOV_EXPENDITURE. Backfilled from all 23 documents in the current listing
          (directions=261&activities=14610): 17 parsed successfully (2018-04-01 through
          2026-07-01), 6 skipped (ids 260596, 80760, 80683, 52793, 47876, 29643 -- older or
          differently-templated files that didn't match the label search; real gaps exist in
          the resulting series, e.g. 2019-10 to 2021-01 and 2021-10 to 2024-07 -- not
          fabricated/interpolated). Now implemented in
          scripts/fetchers/minfin.py:fetch_gov_debt and connected.

  imf:
    name: "International Monetary Fund"
    website: "https://api.imf.org"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live query (real HTTP 200 responses with data, not from memory).
      Current API is IMF SDMX 3.0 REST API at api.imf.org/external/sdmx/3.0 (this is data.imf.org's
      backend). The legacy dataservices.imf.org endpoint no longer resolves (DNS dead) -- confirmed
      decommissioned, do not use in scripts or docs. No API key/auth required; use a normal
      browser-like User-Agent (bare/no UA got edge-blocked on some imf.org subdomains, though not
      on api.imf.org itself).
      Pattern: https://api.imf.org/external/sdmx/3.0/data/dataflow/{AGENCY}/{DATAFLOW}/{VERSION}/{COUNTRY}.{INDICATOR}.{FREQ}
      CSV also available via header Accept: application/vnd.sdmx.data+csv (tested, works).
      WEO vintage caveat: response metadata (COUNTRY_UPDATE_DATE) showed the October 2025 WEO
      vintage as of this check on 2026-08-30 -- an April 2026 WEO release would normally already
      exist. NOT CONFIRMED whether api.imf.org's WEO/9.0.0 dataflow is simply not yet refreshed or
      something else is going on. Re-verify vintage at each real run rather than assuming.
    access_type: api
    protection: none
    endpoints:
      IMF_GDP_GROWTH:
        status: confirmed
        dataset: WEO
        agency_code: IMF.RES
        version: "9.0.0"
        indicator_code: NGDP_RPCH
        country_code: KAZ
        frequency: A
        url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/9.0.0/KAZ.NGDP_RPCH"
      IMF_INFLATION:
        status: confirmed
        dataset: WEO
        agency_code: IMF.RES
        version: "9.0.0"
        indicator_code: PCPIPCH
        country_code: KAZ
        frequency: A
        url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/9.0.0/KAZ.PCPIPCH"
      IMF_CURRENT_ACCOUNT:
        status: confirmed
        dataset: WEO
        agency_code: IMF.RES
        version: "9.0.0"
        indicator_code: BCA_NGDPD
        indicator_code_alt: BCA
        country_code: KAZ
        frequency: A
        url: "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/9.0.0/KAZ.BCA_NGDPD"
        notes: >
          Used WEO (forecast-inclusive, consistent with the other two IMF series) rather
          than the separate BOP dataset (agency IMF.STA) that also exists -- BOP's exact
          indicator key was not resolved to a working query this session, only its dataflow
          existence was confirmed. BCA_NGDPD is % of GDP; BCA (same URL pattern) is USD level.

          basket).
          Two details that make this file easy to get wrong:
          (1) Its cover carries NO publication date, unlike every other publication used here.
          The reporting month is taken from the sheet's own header text ('Июнь 2026г. к'),
          which is better anyway -- it states the period the numbers describe rather than when
          the file was posted.
          (2) The total row carries SEVEN comparisons side by side: against the previous month,
          against last December, against the same month a year earlier, against December 2020,
          and three quarterly ones. Only the third is a normal year-on-year monthly index.
          Choosing wrong would give a series that passes any plausibility check while meaning
          something else -- the December-2020 base column reads 234.4 for exports.
          June 2026: exports 127.8, imports 101.6 year on year. One edition is on the page at a
          time, so the series accumulates across runs. fetch_export_price_index.

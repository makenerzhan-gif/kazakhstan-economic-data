  nbk:
    name: "Национальный Банк Республики Казахстан"
    website: "https://nationalbank.kz"
    status: confirmed
    notes: >
      Verified 2026-08-30 by live curl (real, current numbers matching public press),
      not from memory. Open Data Repository base: https://data.nationalbank.kz/api/v1
      (base URL extracted from the portal's JS bundle, not guessed). No auth/CAPTCHA on
      any data-serving endpoint used below; the full Swagger spec at /api/v3/api-docs IS
      gated behind login, but that's irrelevant since the actual data endpoints work anonymously.
      Generic XLSX export also works for any formId: /api/v1/data/export?formId=<id>&format=xlsx.
    access_type: api
    protection: none
    endpoints:
      BASE_RATE:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data/base-rate"
        format: json
        notes: >
          Full history returned in one call (no working date-filter params found -- they're
          silently ignored). Fields: effectiveDate, rate, corridorLower, corridorUpper.
          History verified back to 2024-10-14. Also GET /api/v1/data/indicators gives a
          small "latest snapshot" including baseRate for quick current-value checks.
      EXCHANGE_RATE:
        status: confirmed
        current_url: "https://data.nationalbank.kz/api/v1/data/exchange-rates"
        historical_url_pattern: "https://nationalbank.kz/rss/get_rates.cfm?fdate={DD.MM.YYYY}"
        format: "json (current, today only) / xml (historical, per-date)"
        notes: >
          The JSON current-rate endpoint ignores every date-filter param tried and always
          returns today's snapshot only -- NOT usable alone for a historical daily series.
          Historical daily series must be built by looping get_rates.cfm?fdate=DD.MM.YYYY
          per date (legacy XML endpoint, confirmed live with a real distinct historical value).
          An XLSX bulk-export button exists on the human page but its underlying request URL
          was not captured this session -- not needed since the XML loop already works.
      M2:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=51"
        export_xlsx_url: "https://data.nationalbank.kz/api/v1/data/export?formId=51&format=xlsx"
        row_metadata_xlsx: "https://nationalbank.kz/file/download/133417"
        format: json
        notes: >
          RESOLVED 2026-08-30. NBK does not label this dataset "M2/M3" in the API -- it's
          formId 51, "Денежная база и агрегаты широкой денежной массы" (monetary base and
          broad money aggregates), monthly, 2021-12-01 onward, broken out by row_code (1,
          1.1, 1.2, 2, 3, 4, 4.1, 4.2, 5, 5.1, 5.2, etc). The downloaded metadata XLSX
          (row_metadata_xlsx above) explains the M0/M1/M2/M3 CONCEPTS but has no row_code
          column -- it does NOT map codes to labels. Resolved instead by opening the
          human-facing table at https://nationalbank.kz/ru/monetarybase/denezhnaya-baza-i-agregaty-shirokoy-denezhnoy-massy
          in a real browser: its numbered rows ("4. M2", "5. M3 (денежная масса)") match
          row_code exactly, and the actual amounts line up 1:1 with the API (e.g. row_code=4,
          report_date=2026-07-01 -> 48128860.58 vs the page's M2 column for the corresponding
          month -> 48128861). row_code="4" = M2, row_code="5" = M3 -- verified both
          structurally (row numbering) and numerically (matching values), not guessed. Note:
          API's report_date appears to run about one month ahead of the page's own column
          labels for the same number -- stored verbatim, not shifted. Now implemented in
          scripts/fetchers/nbk.py:fetch_m2 and connected.
          DATA QUALITY FLAG (sanity check, 2026-08-30): the first published month of this
          entire dataset, 2021-12-01, looks like a source-side anomaly rather than a real
          reading -- M2 and M3 are nearly IDENTICAL that month (4,499,341 vs 4,500,005, a
          0.015% gap) whereas every subsequent month shows a normal ~25-30% M2-to-M3 gap
          (e.g. Jan 2022: M2=14,781,487, M3=19,290,697). row_code=3 (M1) also jumps
          unusually that same month (3.86M -> 6.37M, +65%) while row_code=1 (monetary base)
          and row_code=2 (M0, cash) move normally (~4-5%). Reads as a cold-start/
          transition artifact in NBK's own first published data point for this specific
          cross-tab, not a bug in our parser (verified: our processed value for that date
          matches the raw API response exactly). NOT corrected or dropped here -- raw data
          is never modified -- but flagged so downstream growth-rate calculations spanning
          Dec 2021 -> Jan 2022 are not taken at face value.
      M3:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=51"
        format: json
        notes: "row_code=5. See M2 notes above for how the mapping was verified, and for the 2021-12-01 data quality flag that applies here too. Now implemented in scripts/fetchers/nbk.py:fetch_m3 and connected."
      MONETARY_BASE:
        status: confirmed
        download_url: "https://data.nationalbank.kz/api/v1/data?formId=51"
        format: json
        notes: >
          2026-08-30. Same formId=51 dataset as M2/M3, row_code=1 ("Денежная база
          (резервные деньги)"). Verified against the human-facing table the same way as M2/M3
          -- matching values confirmed. fetch_monetary_base.
      M0:
        status: confirmed

          the edition-gap filter existed.
          Unlike the investment publication, this cover states BOTH facts outright: the date of
          the next release (so the cadence is known, not guessed) and the period the numbers cover
          ('Январь-июль 2026 года'). Editions are admitted only when that interval is at most 40
          days, and the reporting month is READ from the cover rather than inferred from the
          publication date. Two independent protections: the annual edition's period text carries
          no month name, so it fails the period regex as well.

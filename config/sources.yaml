          note says "republican budget only", which is true of every sheet it served until 'табл 3'
          (the STATE budget -- republican plus local). Existing callers are untouched.
          YEAR-TO-DATE CUMULATIVE with a January reset: 26,775,070 mln KZT by 2025-11-30, then
          1,831,700 at 2026-01-31. That is the expected pattern, not a collapse.


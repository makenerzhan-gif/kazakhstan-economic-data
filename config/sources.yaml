          the RUSSIAN LABEL here, not a number, because this sheet puts its labels in the last
          columns -- an absolute index is used, the same fix 'табл 4' needed. Second, rows are
          matched on the Russian label at index 6 and on the FULL section text ('I. ДОХОДЫ', not a
          prefix), because 'III. ЧИСТОЕ БЮДЖЕТНОЕ КРЕДИТОВАНИЕ' and 'VI. НЕНЕФТЯНОЙ ДЕФИЦИТ' would
          collide with looser matching.

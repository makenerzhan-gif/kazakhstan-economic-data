          The figures are YEAR-TO-DATE CUMULATIVE, not monthly flows: the sheet compares against
          'соответствующему периоду прошлого года', and 11,464,246,834 thousand KZT for
          January-July 2026 is 11.46 trillion over seven months, about 19.6 trillion a year --
          Kazakhstan's actual investment scale, which a single month could not be.

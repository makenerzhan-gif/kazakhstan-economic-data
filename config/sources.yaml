          "Unterminated string" partway through, confirmed reproducible with a full,
          untruncated 13,129,766-byte download matching Content-Length exactly (so this was
          a source-side data quality issue, not a network truncation). Checked nearby
          elementIds (1642, 1632, 1644) -- all OTHER price indices, not industrial PPI.

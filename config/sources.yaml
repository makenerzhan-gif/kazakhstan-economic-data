        format: json
        notes: >
          2026-08-31. Discovered by an automated structural probe over the NBK form tree
          that groups every row of a form by its full classification signature and reports
          only groups forming exactly one row per report_date across the whole history.
          Pinned fields: payment_instrument='Total', period='Month', type='billions KZT'. Fetched via _fetch_nbk_exact_row, which requires these fields

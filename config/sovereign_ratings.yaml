# Kazakhstan's sovereign long-term foreign-currency ratings (S&P and Fitch: issuer / IDR; Moody's: issuer, before
# 2006 the foreign-currency government bond rating / ceiling), one row per rating action. Hand-maintained: no
# official consolidated history exists; each action is announced by the National Bank («Информационные сообщения»,
# nationalbank.kz/ru/news/informacionnye-soobshcheniya) and the Ministry of National Economy (gov.kz). Compiled
# 2026-11-10 from Trading Economics (S&P), countryeconomy.com (all three; Fitch to 2020) and the agencies' releases
# as copied by kase.kz, Interfax, Bloomberg and the NBK. conf: H = two or more sources agree or the release was
# seen; M = one aggregator only. Affirmations are listed where known; they do not change the series.
# Read by scripts/fetchers/manual_vintages.py (dataset SOVEREIGN_RATINGS). Add a row at every action.

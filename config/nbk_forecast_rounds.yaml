# The National Bank's own forecasts, base scenario, by forecasting round: table «Прогнозы по базовому сценарию» of the
# Monetary Policy Report («Доклад о денежно-кредитной политике», ДоДКП), https://nationalbank.kz/ru/news/obzor-inflyacii.
# Hand-maintained: the forecast paths are only in the PDF (the xlsx annex «Статистическая информация» carries the charts
# as images), and the table's number, position and layout change between rounds. Four rounds a year (Feb, May, Aug, Nov
# from 2023; Mar, Jun, Sep, Dec in 2022). The Mar, Jun and Sep 2022 reports give the forecasts in the text only and are
# not listed. Read by scripts/fetchers/manual_vintages.py (dataset NBK_FORECAST_ROUNDS). Every number was checked
# on 2026-11-07 to appear in the report's own text (pdftotext of /file/download/<report>).
#
# Per target year: gdp [low, high] % real growth y/y; cpi [low, high] % Dec/Dec (a single number "вблизи 5,0" is
# [5.0, 5.0] with near: true); brent $/bbl, annual average (from Aug-2026 in «Внешние предпосылки прогноза»).
# The first year of a round is the current year. Transcribed 2026-11-07.

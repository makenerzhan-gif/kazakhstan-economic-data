# Structure of tax receipts by industry, per cent of the tax receipts of the state budget plus the National Fund
# («Структура налоговых поступлений бюджета (ГБ+НФ) в разрезе отраслей экономики», source «МФ»): a stacked-bar chart
# in the Supreme Audit Chamber's (ВАП) conclusion on the Government's report on the execution of the republican
# budget. Hand-maintained: the chart is in a PDF, and neither Minfin nor the State Revenue Committee publishes the
# table behind it (checked 2026-11-13, see config/sources.yaml TAX_RECEIPTS_BY_OKED). Six groups only -- no ОКЭД
# divisions, so oil and gas (06) and metal ores (07) cannot be separated. That «Горнодобывающая промышленность» is
# ОКЭД section B is inferred from the 2020 conclusion, which uses the section's name; the chart does not say.
#
# Transcribed 2026-11-13 from the text layer of the PDFs (pdftotext): 2017-2023 from the conclusion for 2023
# (gov.kz doc 681592), 2024 from the conclusion for 2024 (doc 876183), 2025 from the conclusion for 2025 (doc
# 1071435, Диаграмма 17). The editions agree on every year they share, except «Другие» 2020 (27,4 in the editions
# for 2021-2023, 27,5 in the one for 2024; 27,4 kept). Each year's shares sum to 99,9-100,1 (rounding).
# published_total_bn: «Налоговые поступления в КБ», Таблица 12 of the conclusion for 2025, bn KZT.
# Add a year each autumn from the new conclusion (gov.kz, project esep).

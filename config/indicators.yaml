# Stage-1 indicator scope for the Kazakhstan Economic Data Pipeline.
# Exactly the 15-20 indicators approved for the end-to-end pilot (see MASTER TASK section 0).
# `source_status` is filled in only after the source-research step confirms (or fails to confirm)
# a real machine-readable official source. Never set it to "confirmed" without a verified URL
# in config/sources.yaml. `frequency` reflects what the confirmed source actually publishes,
# not our original assumption -- IND_PROD, INVESTMENT, GDP_REAL, GOV_REVENUE, and
# GOV_EXPENDITURE were originally guessed as monthly/quarterly before their sources were
# inspected; the confirmed files only contain annual points for these five, corrected here
# on 2026-08-30 once each fetcher was implemented and tested live.
#
# frequency: daily | monthly | quarterly | annual
# source_status: pending_research | confirmed | not_found | found_but_not_yet_parseable

indicators:

# Stage-1 indicator scope for the Kazakhstan Economic Data Pipeline.
# Exactly the 15-20 indicators approved for the end-to-end pilot (see MASTER TASK section 0).
# `source_status` is filled in only after the source-research step confirms (or fails to confirm)
# a real machine-readable official source. Never set it to "confirmed" without a verified URL
# in config/sources.yaml. `frequency` reflects what the confirmed source actually publishes,
# not our original assumption -- IND_PROD, INVESTMENT, GDP_REAL, GOV_REVENUE, and
# GOV_EXPENDITURE were originally guessed as monthly/quarterly before their sources were
# inspected; the confirmed files only contain annual points for these five, corrected here
# on 2026-08-30 once each fetcher was implemented and tested live.
#
# frequency: daily | monthly | quarterly | annual
# source_status: pending_research | confirmed | not_found | found_but_not_yet_parseable

indicators:
  - id: GDP_REAL
    name_ru: "ВВП, реальный (физический объем, методом производства)"
    name_en: "Real GDP"
    agency: bns
    frequency: annual
    unit: "index (physical volume, % of previous period)"
    category: national_accounts
    source_status: confirmed
    observation_type: comparison_index
    observation_evidence: "единица: 'index (physical volume, % of previous period)'"
    comparison_basis: yoy
    comparison_basis_evidence: "единица уже задаёт базу: 'same period previous year=100' / для годовых — 'previous period' есть 'previous year' по определению частоты"

  - id: GDP_NOMINAL
    name_ru: "ВВП, номинальный"
    name_en: "Nominal GDP"
    agency: bns
    frequency: quarterly
    unit: "KZT"
    category: national_accounts
    source_status: confirmed
    observation_type: period_total
    cumulation: year_to_date
    observation_evidence: "куб отдаёт периоды 'Январь-Март', 'Январь-Июнь' — нарастающий итог"

  - id: IND_PROD
    name_ru: "Индекс промышленного производства"
    name_en: "Industrial Production Index"
    agency: bns
    frequency: annual
    unit: "index, % to previous period"
    category: production
    source_status: confirmed
    observation_type: comparison_index
    observation_evidence: "единица: 'index, % to previous period'"
    comparison_basis: yoy
    comparison_basis_evidence: "единица уже задаёт базу: 'same period previous year=100' / для годовых — 'previous period' есть 'previous year' по определению частоты"
    lifecycle: superseded
    superseded_by: INDUSTRIAL_PRODUCTION_INDEX
    lifecycle_note: "annual cube discontinued after 2023; the monthly publication carries the same concept"

  - id: CPI
    name_ru: "Индекс потребительских цен (инфляция)"
    name_en: "Consumer Price Index (Inflation)"
    agency: bns
    frequency: monthly
    unit: "% change vs previous month"
    category: prices
    source_status: confirmed
    observation_type: comparison_index
    observation_evidence: "к предыдущему месяцу"
    comparison_basis: mom
    comparison_basis_evidence: "единица: 'previous month = 100'"

  - id: UNEMPLOYMENT
    name_ru: "Уровень безработицы"
    name_en: "Unemployment Rate"
    agency: bns
    frequency: quarterly
    unit: "% of labor force"
    category: labor
    source_status: confirmed
    observation_type: period_average
    observation_evidence: "примечание: методология LFS/МОТ, как у остальных квартальных обследований рабочей силы"
    lifecycle: stale_source
    lifecycle_note: "the quarterly cube stopped at 2025-06. LABOR_FORCE and UNEMPLOYED_PERSONS from the ARDFM-era labour publication give the rate, but no drop-in rate series was connected"

  - id: INVESTMENT
    name_ru: "Инвестиции в основной капитал"
    name_en: "Investment in Fixed Capital"
    agency: bns
    frequency: annual
    unit: "KZT"
    category: investment
    source_status: confirmed
    observation_type: period_total
    observation_evidence: "тот же json_cube формат СНС, что GFCF/GROSS_OUTPUT: поток за год"
    lifecycle: superseded
    superseded_by: INVESTMENT_FIXED_CAPITAL
    lifecycle_note: "annual cube stops at 2022; the replacement is monthly year-to-date"

  - id: EXPORTS
    name_ru: "Экспорт (итого)"
    name_en: "Exports (total)"
    agency: bns
    frequency: monthly
    unit: "thousand USD"
    category: trade
    source_status: confirmed
    observation_type: period_total
    observation_evidence: "таможенная статистика: помесячные декларации, оборот за месяц"


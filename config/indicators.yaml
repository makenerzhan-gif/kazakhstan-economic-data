# Stage-1 indicator scope for the Kazakhstan Economic Data Pipeline.
# Exactly the 15-20 indicators approved for the end-to-end pilot (see MASTER TASK section 0).
# `source_status` is filled in only after the source-research step confirms (or fails to confirm)
# a real machine-readable official source. Never set it to "confirmed" without a verified URL
# in config/sources.yaml.
#
# frequency: daily | monthly | quarterly | annual
# source_status: pending_research | confirmed_api | confirmed_csv | confirmed_xlsx | unavailable_automatic

indicators:
  - id: GDP_REAL
    name_ru: "ВВП, реальный (в ценах предыдущего года / физический объем)"
    name_en: "Real GDP"
    agency: bns
    frequency: quarterly
    unit: "million KZT (real)"
    category: national_accounts
    source_status: pending_research

  - id: GDP_NOMINAL
    name_ru: "ВВП, номинальный"
    name_en: "Nominal GDP"
    agency: bns
    frequency: quarterly
    unit: "million KZT"
    category: national_accounts
    source_status: pending_research

  - id: IND_PROD
    name_ru: "Индекс промышленного производства"
    name_en: "Industrial Production Index"
    agency: bns
    frequency: monthly
    unit: "index, % to corresponding period"
    category: production
    source_status: pending_research

  - id: CPI
    name_ru: "Индекс потребительских цен (инфляция)"
    name_en: "Consumer Price Index (Inflation)"
    agency: bns
    frequency: monthly
    unit: "% change vs previous month"
    category: prices
    source_status: pending_research

  - id: UNEMPLOYMENT
    name_ru: "Уровень безработицы"
    name_en: "Unemployment Rate"
    agency: bns
    frequency: quarterly
    unit: "% of labor force"
    category: labor
    source_status: pending_research

  - id: INVESTMENT
    name_ru: "Инвестиции в основной капитал"
    name_en: "Investment in Fixed Capital"
    agency: bns
    frequency: quarterly
    unit: "million KZT"
    category: investment
    source_status: pending_research

  - id: EXPORTS
    name_ru: "Экспорт (итого)"
    name_en: "Exports (total)"
    agency: bns
    frequency: monthly
    unit: "thousand USD"
    category: trade
    source_status: pending_research

  - id: IMPORTS
    name_ru: "Импорт (итого)"
    name_en: "Imports (total)"
    agency: bns
    frequency: monthly
    unit: "thousand USD"
    category: trade
    source_status: pending_research

  - id: BASE_RATE
    name_ru: "Базовая ставка НБ РК"
    name_en: "NBK Base Rate"
    agency: nbk
    frequency: daily
    unit: "% p.a."
    category: monetary
    source_status: pending_research

  - id: EXCHANGE_RATE
    name_ru: "Официальный курс USD/KZT"
    name_en: "Official USD/KZT Exchange Rate"
    agency: nbk
    frequency: daily
    unit: "KZT per 1 USD"
    category: monetary
    source_status: pending_research

  - id: M2
    name_ru: "Денежная масса M2"
    name_en: "Money Supply M2"
    agency: nbk
    frequency: monthly
    unit: "million KZT"
    category: monetary
    source_status: pending_research

  - id: M3
    name_ru: "Денежная масса M3"
    name_en: "Money Supply M3"
    agency: nbk
    frequency: monthly
    unit: "million KZT"
    category: monetary
    source_status: pending_research

  - id: GOV_REVENUE
    name_ru: "Доходы республиканского бюджета"
    name_en: "Republican Budget Revenue"
    agency: minfin
    frequency: monthly
    unit: "million KZT"
    category: fiscal
    source_status: pending_research

  - id: GOV_EXPENDITURE
    name_ru: "Расходы республиканского бюджета"
    name_en: "Republican Budget Expenditure"
    agency: minfin
    frequency: monthly
    unit: "million KZT"
    category: fiscal
    source_status: pending_research

  - id: GOV_DEBT
    name_ru: "Государственный долг РК"
    name_en: "Government Debt"
    agency: minfin
    frequency: quarterly
    unit: "million KZT"
    category: fiscal
    source_status: pending_research

  - id: IMF_GDP_GROWTH
    name_ru: "IMF WEO: реальный рост ВВП Казахстана"
    name_en: "IMF WEO: Real GDP Growth, Kazakhstan"
    agency: imf
    frequency: annual
    unit: "% change"
    category: international_projection
    source_status: pending_research

  - id: IMF_INFLATION
    name_ru: "IMF WEO: инфляция, Казахстан"
    name_en: "IMF WEO: Inflation, Kazakhstan"
    agency: imf
    frequency: annual
    unit: "% change, average consumer prices"
    category: international_projection
    source_status: pending_research

  - id: IMF_CURRENT_ACCOUNT
    name_ru: "IMF: Счет текущих операций, Казахстан"
    name_en: "IMF: Current Account Balance, Kazakhstan"
    agency: imf
    frequency: annual
    unit: "% of GDP"
    category: international_projection
    source_status: pending_research

    unit: "index, % to previous period"
    category: production
    source_status: confirmed

  - id: CPI
    name_ru: "Индекс потребительских цен (инфляция)"
    name_en: "Consumer Price Index (Inflation)"
    agency: bns
    frequency: monthly
    unit: "% change vs previous month"
    category: prices
    source_status: confirmed

  - id: UNEMPLOYMENT
    name_ru: "Уровень безработицы"
    name_en: "Unemployment Rate"
    agency: bns
    frequency: quarterly
    unit: "% of labor force"
    category: labor

# Statutory tax and contribution rates of Kazakhstan, by the month each level took effect.
# Hand-maintained: no agency publishes them as a series. Read by scripts/fetchers/manual_vintages.py, fetch_table
# with `step: monthly` (dataset TAX_RATES): a value holds from its month until the next one; `null` opens a gap
# for months that have no single rate (a scale by price or output, a seasonal rate). Nothing is filled from memory.
# Compiled 2026-11-13 in three passes; every value, act, URL and quote is in docs/research_tax_rates_2026-11-13.md,
# docs/research_tax_gaps_A_2026-11-13.md and docs/research_tax_gaps_B_2026-11-13.md.
# Where the texts were read: adilet.zan.kz serves an empty JavaScript shell, so current editions and amending laws
# were read on its mirror zakon.uchet.kz/rus/docs/<adilet id>; EARLIER EDITIONS (levels that the current text no
# longer shows) on prg.kz/m/amp/document/<edition id>/ -- a commercial legal database with dated editions, not the
# official register; customs and excise resolutions with the superseded text on alta.ru/tamdoc/.
# A change inside a month is dated to that month when it applied for most of it, otherwise to the next one.
#   VAT        Закон от 24.04.1995 № 2235 (в действии с 01.07.1995; ст. 66, позднее ст. 62 -- 20); Закон от 03.05.2001
#              № 183 (16 с 01.07.2001); Закон от 04.07.2003 № 475 (15 с 2004); Закон от 07.07.2006 № 177 (14 с 2007,
#              13 с 2008, 12 с 2009); НК 2008 ст. 268; НК 2017 ст. 422; НК от 18.07.2025 № 214-VIII ст. 503 (16 с
#              01.01.2026; лекарства и медуслуги 5 в 2026, 10 с 2027). The first three weeks of July 1995 rest on the
#              edition valid from 20.07.1995 (the very first edition is truncated on prg.kz).
#   CIT        Закон № 2235 ст. 30 (30 с 01.07.1995); НК 2001 ст. 135 (30); Закон от 10.12.2008 № 100-IV ст. 4 (ст. 147
#              НК 2008 приостановлена: 20 в 2009, по плану 17,5 в 2010 и 15 с 2011); Закон от 16.11.2009 № 200-IV
#              (20 продлено); Закон от 26.11.2010 № 356-IV (20 в самой ст. 147 с 01.01.2011). 17.5 and 15 never applied.
#              НК 2017 ст. 313; НК 2025 ст. 357 (20; банки и игорный бизнес 25).
#   PIT        НК 2001 ст. 145 первоначальная редакция (шкала 5/10/20/30 в 2002-2003; пороги 15 / 40 / 600 годовых
#              расчётных показателей); Закон № 475 (5/8/13/15/20 с 2004); Закон № 177 (10 с 01.01.2007); НК 2025
#              ст. 363 (10 до 8 500 МРП годового дохода, 15 свыше).
#   Dividends  НК 2001 ст. 145(2) (15 в 2002-2006); Закон № 177 (5 с 2007); НК 2008 ст. 158; НК 2017 ст. 320(2) (5, редакции
#              2018-2022); Закон от 11.07.2022 № 135-VII (особая ставка отменена с 01.01.2023 -> 10); НК 2025 ст. 363
#              (5 до 230 000 МРП в год, 15 свыше).
#   Social tax Закон № 183 (21 с 01.07.2001 вместо 26); НК 2001 ст. 317 (21 в 2002-2003); Закон № 475 (шкала
#              20/15/12/9/7 в 2004-2007); Закон № 177 (шкала 13/11/9/7/5 в 2008); НК 2008 ст. 358 (11 с 2009); НК 2017
#              ст. 485 (9,5 с 2018, 11 с 2025); НК 2025 ст. 557 (6). In 2004-2008 the series is the FIRST-BRACKET rate.
#              Until 2025 the amount payable was the tax MINUS social contributions (НК 2017 ст. 486; already in НК 2001
#              ст. 318 by July 2007); НК 2025 ст. 558 has no such offset -- 6 % is paid on top of contributions.
#   СО         Закон от 25.04.2003 № 405 ст. 14; Социальный кодекс от 20.04.2023 № 224-VII ст. 244.
#   ОПВ, ОПВР  Закон от 21.06.2013 № 105-V ст. 25 (10; the same 10 stood in the 1997 law, art. 22-1, but its start month was
#              not read, so the series starts with the 2013 law); Социальный кодекс ст. 249, 251 (ОПВР: 4,5 с 2027 и 5 с 2028 уже в законе).
#   ОСМС       Закон от 16.11.2015 № 405-V ст. 27, 28.
#   НДПИ       Закон № 100-IV ст. 7 (2009-2010: таблица ст. 339 НК 2008 приостановлена; медь 5,7, цинк 7, золото 5,
#              железная руда 2,8, уран 22, уголь 0; нефть -- шкала 5-18 %); Закон № 356-IV (те же ставки с 2011); Закон
#              от 26.12.2012 № 61-V (уран 18,5 с 2013; его ст. 6 ЗАДНИМ ЧИСЛОМ ставит 17,5 на 2009-2012 -- the series
#              keeps 22, the rate in force at the time); НК 2017 ст. 746 (редакции 2019-2022: без изменений); Закон от
#              10.12.2020 № 382-VI (уголь 2,7 с 2021); Закон № 135-VII (с 01.01.2023: медь 8,55, цинк 10,5, золото
#              7,5, руда 3,64, уран 6 на новой базе); Закон от 01.07.2024 № 105-VIII (уран 9 в 2025); НК 2025 ст. 781.
#              From 2026 uranium is a scale by output (4-18) and gold by price (7.5-11): no single rate -> gap.
#              MET_OIL_TOP is the top step of the oil scale (over 10 mln t a year): 18 in 2009-2026 (the 19 and 20
#              scheduled in 2008 were postponed and never applied); domestic sales x 0.5; a price-and-output matrix from 2027.
#   Excises    Сигареты: Закон № 100-IV ст. 21 (600 в 2009, 800 с 01.01.2010; импортные 750 и 950 до 01.07.2010);
#              Закон № 356-IV (1 000 / 1 250 / 1 550 в 2011-2013); Закон от 05.12.2013 № 152-V; Закон от 30.11.2016
#              № 26-VI; Закон от 25.12.2017 № 121-VI ст. 43; НК 2017 ст. 463; НК 2025 ст. 537.
#              Топливо: НК 2008 ст. 280 п. 4 (бензин 4 500, дизель 540 в 2009-2014); постановления Правительства от
#              13.03.2015 № 133 (те же), 06.11.2015 № 887 (бензин 10 500 с 25.11.2015 -> 2015-12), 30.09.2016 № 557
#              (дизель сезонный: 9 300 летом, 540 зимой -> gap), 31.03.2017 № 144, 06.04.2018 № 173, 29.05.2019 № 331,
#              13.12.2019 № 928 (бензин 24 435), 24.03.2022 № 155 (38 134 и 35 726, круглый год); от 28.04.2025 № 280
#              (с 11.05.2025 ставка зависит от цены: бензин Аи-92/93 дороже 214 584 тенге за тонну -- 38 134 + 50 % превышения,
#              дизель дороже 284 350 -- 35 726 + 50 % превышения) -> no single rate from 2025-05; 05.12.2025 № 1049 и поправки
#              2026 г. № 615, 773 (50 %), 816 (95 % с 01.09.2026) сохраняют формулу; 38 134 и 35 726 остаются базой.
#   Oil duty   Постановления Правительства от 08.04.2008 № 328 (109,91 с 17.05.2008 -> 2008-06), 29.08.2008 № 805
#              (203,8 с 11.10.2008), 05.12.2008 № 1162 (139,79 около 20-25.01.2009, not in the series), 24.12.2008
#              № 1253 (0 с 26.01.2009 -> 2009-02; January 2009 is kept at 203.8, in force until the 19th), 13.07.2010
#              № 709 (20 с 15-16.08.2010, опубликовано 16.07.2010), 30.12.2010 № 1445 (40 с 01.01.2011), 02.04.2013 № 321 (60 с
#              14.04.2013, опубликовано 03.04.2013), 11.03.2014 № 211 (80 с 12.03.2014), 17.03.2015 № 145 (60 с 19.03.2015 ->
#              2015-04); приказ МНЭ от 20.01.2016 № 18 (40 с 01.01.2016); приказ от 17.02.2016 № 81 (с 01.03.2016 ставка
#              по таблице от цены: 0 below 25 USD/bbl, 10 / 20 / 35 for 25-30 / 30-35 / 35-40, then the lower bound of
#              each 5-dollar band up to 100, 115-236 above 105; приказ от 14.08.2023 № 311-НҚ: USD/t = the price in
#              USD/bbl for 25-105) -> no fixed rate after 2016-02. The start days of 2008-2010 are from news agencies.
source: "Налоговые кодексы 2001, 2008, 2017 и 2025 гг., законы о внесении изменений, Социальный кодекс, закон об ОСМС, постановления Правительства и приказы о ставках акцизов и вывозных пошлин; тексты по zakon.uchet.kz (зеркало adilet.zan.kz), ранние редакции по prg.kz, акты о пошлинах и акцизах по alta.ru; сверено 2026-11-13."

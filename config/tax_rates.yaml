# Statutory tax and contribution rates of Kazakhstan, by the month each level took effect.
# Hand-maintained: no agency publishes them as a series. Read by scripts/fetchers/manual_vintages.py, fetch_table
# with `step: monthly` (dataset TAX_RATES): a value holds from its month until the next one; `null` opens a gap
# for months whose level was NOT read in a legal text (it is not filled from memory or by inference).
# Compiled 2026-11-13. adilet.zan.kz serves an empty JavaScript shell, so every act was read on its mirror
# zakon.uchet.kz/rus/docs/<the adilet document id>. Acts, in the order of the items:
#   VAT        Закон от 03.05.2001 № 183 (16 с 01.07.2001; до него ст. 62 Закона № 2235 -- 20); Закон от 04.07.2003 № 475
#              (15 с 01.01.2004); Закон от 07.07.2006 № 177 (14 с 2007, 13 с 2008, 12 с 2009); НК 2008 ст. 268; НК 2017
#              ст. 422; НК от 18.07.2025 № 214-VIII ст. 503 (16 с 01.01.2026; лекарства и медуслуги 5 в 2026, 10 с 2027).
#   CIT        НК 2001 ст. 135 (30); Закон от 26.11.2010 № 356-IV (в ст. 147 НК 2008 «15» заменено на «20», с 01.01.2011);
#              НК 2017 ст. 313; НК 2025 ст. 357 (20; банки и игорный бизнес 25). 2009-2010: the transitional article was
#              not read -> gap.
#   PIT        Закон № 475 (шкала 5/8/13/15/20 с 2004); Закон № 177 (10 с 01.01.2007); НК 2025 ст. 363 (10 до 8 500 МРП
#              годового дохода, 15 свыше). 2002-2003 scale not read.
#   Dividends  Закон № 177 (5 с 2007); НК 2008 ст. 158; Закон от 11.07.2022 № 135-VII (особая ставка отменена с
#              01.01.2023 -> 10). 2018-2022: the paragraph is no longer displayed -> gap. 2026: 5 up to 230 000 MRP, 15 above.
#   Social tax Закон № 183 (21 с 01.07.2001 вместо 26); 2002-2003 not read; 2004-2008 regressive scales (20-7, in 2008
#              13-5) -- no single rate -> gap; НК 2008 ст. 358 (11 с 2009); НК 2017 ст. 485 (9,5 с 2018, 11 с 2025);
#              НК 2025 ст. 557 (6). 2018-2025: the amount payable was the tax MINUS social contributions (НК 2017 ст. 486).
#   СО         Закон от 25.04.2003 № 405 ст. 14; Социальный кодекс от 20.04.2023 № 224-VII ст. 244.
#   ОПВ, ОПВР  Закон от 20.06.1997 № 136; Социальный кодекс ст. 249, 251 (ОПВР: 4,5 с 2027 и 5 с 2028 уже в законе).
#   ОСМС       Закон от 16.11.2015 № 405-V ст. 27, 28.
#   НДПИ       Закон № 356-IV (таблица ст. 339 с 01.01.2011); Закон от 26.12.2012 № 61-V (уран 18,5 с 2013); НК 2017 ст. 746
#              original edition not read -> gap 2018-2022; Закон № 135-VII (с 01.01.2023); Закон от 01.07.2024 № 105-VIII
#              (уран 9 в 2025); НК 2025 ст. 781. From 2026 uranium is a scale by output (4-18) and gold by price (7.5-11):
#              no single rate -> gap. Oil: scale 5-18 % by annual output, unchanged 2011-2026 (not a single rate, not here).
#   Excises    Сигареты: Закон от 30.06.2010 № 297-IV; Закон от 05.12.2013 № 152-V; Закон от 30.11.2016 № 26-VI; Закон
#              от 25.12.2017 № 121-VI ст. 43; НК 2017 ст. 463; НК 2025 ст. 537. Бензин: постановления Правительства
#              от 31.03.2017 № 144, 29.05.2019 № 331, 13.12.2019 № 928, 24.03.2022 № 155, 05.12.2025 № 1049 (producers'
#              wholesale row; the April 2022 start is the month of the act, restated «с 1 января 2022 года» by № 786).
#   Oil duty   Постановления Правительства от 31.12.2011 № 1739, 02.04.2013 № 321, 11.03.2014 № 211, 17.03.2015 № 145;
#              приказ МНЭ от 20.01.2016 № 18; приказ от 17.02.2016 № 81 (price-linked from March 2016: 0 below 25 USD/bbl,
#              USD/t = the price in USD/bbl for 25-105, a 115-236 table above) -> no fixed rate after 2016-02. For 2013-2015
#              the month is that of the act (in force on or days after publication). Before 2012 the dates were not read.
source: "Налоговые кодексы 2001, 2008, 2017 и 2025 гг., законы о внесении изменений, Социальный кодекс, закон об ОСМС, постановления Правительства и приказы о ставках акцизов и вывозных пошлин; тексты по zakon.uchet.kz (зеркало adilet.zan.kz), сверено 2026-11-13."

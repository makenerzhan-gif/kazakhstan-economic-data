    sheet: "Внешние и внутренние факторы"
    region: world
    rows_by_item: *wb_price_rows
    years: [2026, 2027]
    tolerance: 0.006
    note: "прогноз ВБ, Commodity Markets Outlook (текущий выпуск)"

  - id: wb_indices_history

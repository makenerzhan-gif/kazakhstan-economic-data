  # ---------------------------------------------------------------- world prices (World Bank, EIA)
  # «Внешние и внутренние факторы»: rows 65–124 hold the World Bank annual prices the model
  # uses (46 of the 69 Pink Sheet series, in the order of the CMO forecast table), rows
  # 146–161 the 16 price indices (2010=100). History (fact years) comes from the Pink Sheet,
  # 2026–2027 from the current CMO forecast table; 2028–2030 repeat 2027 (the model's own
  # rule) and rows 128–143 are year-on-year formulas over the indices — neither is mapped.
  # The World Bank publishes rounded annual values, the model kept full-precision means of
  # older vintages, hence the relative tolerance.
  - id: wb_prices_history
    dims_variable: WB_COMMODITY_PRICES_ANNUAL
    sheet: "Внешние и внутренние факторы"
    region: world
    rows_by_item: &wb_price_rows {COAL_AUS: 65, CRUDE_BRENT: 66, NGAS_EUR: 67, NGAS_US: 68, NGAS_JP: 69,
                   COCOA: 73, COFFEE_ARABIC: 74, COFFEE_ROBUS: 75, TEA_AVG: 76,
                   COCONUT_OIL: 79, GRNUT_OIL: 80, PALM_OIL: 81, SOYBEAN_MEAL: 82, SOYBEAN_OIL: 83, SOYBEANS: 84,
                   BARLEY: 86, MAIZE: 87, RICE_05: 88, WHEAT_US_HRW: 89,
                   BANANA_US: 91, BEEF: 92, CHICKEN: 93, ORANGE: 94, SHRIMP_MEX: 95, SUGAR_WLD: 96,
                   LOGS_CMR: 99, LOGS_MYS: 100, SAWNWD_MYS: 101, COTTON_A_INDX: 103, RUBBER_TSR20: 104, TOBAC_US: 105,
                   DAP: 108, PHOSROCK: 109, POTASH: 110, TSP: 111, UREA_EE_BULK: 112,
                   ALUMINUM: 114, COPPER: 115, IRON_ORE: 116, LEAD: 117, NICKEL: 118, TIN: 119, ZINC: 120,
                   GOLD: 122, SILVER: 123, PLATINUM: 124}
    tolerance: 0.006
    rel_tolerance: 0.01

  - id: wb_price_forecasts

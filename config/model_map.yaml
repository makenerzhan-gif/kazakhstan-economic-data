    rows_by_item: {BREPUUS: 4}
    years: [2026, 2027]
    annual: mean
    tolerance: 0.006
    note: "прогноз Brent EIA, STEO: среднее 12 месячных значений"

  # ---------------------------------------------------------------- exports by commodity group («Экспорт»)
  # Rows 3–25 hold the value of 23 commodity groups (млн $), row 2 the total, row 26 the residual
  # «Прочие» (= row 2 − rows 3–25, a formula); rows 85–107 the physical volumes, row 109 the
  # total tonnage, row 108 the residual. The fact years were forecast formulas (previous year ×
  # volume growth × price change) until phase 5; by the author's phase-5 decision they are BNS
  # facts (replace_formulas) and the forecast formulas chain on from 2025. Not mapped: gas
  # condensate (row 10/92) and «нефтепродукты» (11/93) — 10-digit subsets of 2709/2710 that the
  # 6-digit workbook cannot separate; crude-oil tonnes (91) — linked to «Прогнозы ЦГО»; natural
  # gas volume (94) — published in cubic metres. Units per row follow the sheet: most rows are
  # tonnes, flour/flat-rolled/zinc are thousand tonnes.
  - id: exports_total
    variable: EXPORTS
    annual: sum
    scale: 1.0e-3
    tolerance: 0.06
    replace_formulas: true
    targets:
      - {sheet: "Экспорт", row: 2, note: "экспорт товаров, млн $ (сумма месяцев)"}

  - id: exports_value_groups
    dims_variable: EXPORTS_VALUE_BY_COMMODITY_GROUP
    sheet: "Экспорт"
    annual: sum
    scale: 1.0e-3
    rows_by_item: {WHEAT: 3, FLOUR: 4, IRON_ORE: 5, ZINC_ORE: 6, CHROME_ORE: 7, COAL: 8, CRUDE_OIL: 9, NATURAL_GAS: 12,
                   SILVER: 13, GOLD: 14, FERROALLOYS: 15, FERROUS_SCRAP: 16, FLAT_ROLLED: 17, COPPER: 18, LEAD: 19,
                   ALUMINIUM: 20, ZINC: 21, FATS_OILS: 22, INORGANIC_CHEM: 23, IRON_STEEL_ARTICLES: 24, TRANSPORT: 25}
    tolerance: 0.06
    replace_formulas: true
    note: "экспорт по товарным группам, млн $"

  - id: exports_volume_tonnes
    dims_variable: EXPORTS_VOLUME_BY_COMMODITY_GROUP
    sheet: "Экспорт"
    annual: sum
    rows_by_item: {WHEAT: 85, IRON_ORE: 87, ZINC_ORE: 88, CHROME_ORE: 89, COAL: 90, SILVER: 95, GOLD: 96, FERROALLOYS: 97,

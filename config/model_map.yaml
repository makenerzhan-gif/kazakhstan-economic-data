                   OILS_MEALS: 152, GRAINS: 153, OTHER_FOOD: 154, RAW_MATERIALS: 155, TIMBER: 156, OTHER_RAW_MATERIALS: 157,
                   FERTILIZERS: 158, METALS_MINERALS: 159, BASE_METALS: 160, PRECIOUS_METALS: 161}

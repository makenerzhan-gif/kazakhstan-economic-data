                   FOOTWEAR: 674, LEATHER_FOOTWEAR: 695, WINDOWS_DOORS: 716, COKE: 743, MOTOR_FUEL: 746, DIESEL: 760,
                   FUEL_OIL: 776, ETHANOL: 795, ELECTRICITY: 976, HEAT: 1001, WATER_NONPOTABLE: 1045}
    tolerance: 0.06


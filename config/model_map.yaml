# Contract between the GDP model workbook (1_Model_GDP_p_a_2025_…_rev_*.xlsx) and the
# unified dataset. Read by scripts/model_sync.py.
#
# One entry per pipeline variable; `targets` are the workbook cells that should hold
# that variable's annual value. Whether a target is checked or written is decided at
# run time from the workbook itself: a cell holding a formula is a CONTROL (compared,
# never overwritten — the model computes it), a cell holding a number is an INPUT
# (compared, and rewritten by --apply when it differs). Nothing here is applied to a
# formula cell, so the model's own logic can never be replaced by a pasted number.
#
# annual — how a variable's observations inside a calendar year become one number:
#   last      the last observation dated within the year (annual series: the single value)
#   mean      arithmetic mean of the observations within the year (daily/monthly rates)
#   december  the observation for month 12 (monthly indices reported year-to-date)
#   sum       sum of the observations within the year (monthly flows)
# scale / offset — value * scale + offset, applied after annualisation (pipeline stores
#   tenge and index levels; the model stores млн ₸ and percentage changes).
# tolerance — |model − pipeline| above which a target is reported as a difference.
# rel_tolerance — the same as a share of the pipeline value; the wider of the two applies.
# years — calendar years to check; default is model.default_years.

version: 1

model:
  default_file: "D:/Yandex.Disk/Модель ВВП по производству/1_Model_GDP_p_a_2025_470_75_15.01.2025_rev_2026-09-14.xlsx"   # folder renamed by the author (was «В клауд»)
  year_header_row: 1          # every mapped sheet carries the calendar year in row 1 (cached values)
  default_years: [2023, 2024, 2025]
  journal_sheet: "Журнал_правок"

mappings:
  - id: gdp_nominal
    variable: GDP_INCOME_METHOD     # annual GDP in tenge; GDP_NOMINAL is quarterly and cumulative within the year
    annual: last
    scale: 1.0e-6
    tolerance: 1.0
    targets:
      - {sheet: "ВДС_производ_регионы", row: 1399, note: "ВВП = ВДС + чистые налоги"}
      - {sheet: "ВВП_доходы", row: 30, note: "ВВП методом доходов"}

  - id: gdp_real
    variable: GDP_REAL
    annual: last
    tolerance: 0.15                 # the model chains real GVA in fixed 2023 prices, BNS in previous-year prices
    targets:
      - {sheet: "ИФО_производ_регионы", row: 1399, note: "ИФО ВВП, сводится из секций"}
      - {sheet: "ВВП_расходы_МКИ", row: 134, note: "ИФО ВВП методом конечного использования", tolerance: 0.05}

  - id: gdp_deflator
    variable: GDP_DEFLATOR
    annual: last
    tolerance: 0.15
    targets:
      - {sheet: "Дефляторы_производ_регионы", row: 1399, note: "дефлятор ВВП, сводится из секций"}

  - id: net_taxes_on_products
    variable: NET_TAXES_ON_PRODUCTS
    annual: last
    scale: 1.0e-6
    tolerance: 1.0
    targets:
      - {sheet: "ВДС_производ_регионы", row: 1375, note: "ЧН, национальный итог"}
      - {sheet: "ВВП_доходы", row: 28, col_offset: 2, note: "ЧН в столбце «другие налоги на производство»"}

  - id: taxes_on_products
    variable: TAXES_ON_PRODUCTS     # SUBSIDIES in the pipeline is a different aggregate (980.7 bn ₸ in 2023 vs 339.6 bn subsidies on products) — not mapped
    annual: last
    scale: 1.0e-6
    tolerance: 1.0
    targets:
      - {sheet: "ВДС_производ_регионы", row: 1397, note: "налоги на продукты и импорт"}

  - id: final_consumption
    variable: TOTAL_CONSUMPTION_EXPENDITURE
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 2}

  - id: household_consumption
    variable: HOUSEHOLD_CONSUMPTION
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 3}

  - id: gross_accumulation
    variable: GROSS_ACCUMULATION
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 8}

  - id: gfcf
    variable: GFCF
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 9}

  - id: net_exports
    variable: NET_EXPORTS
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 57}

  - id: gfcf_volume_index
    variable: GFCF_VOLUME_INDEX
    annual: last
    tolerance: 0.05
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 78}

  - id: export_volume_index
    variable: EXPORT_VOLUME_INDEX
    annual: last
    tolerance: 0.05
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 127}

  - id: import_volume_index
    variable: IMPORT_VOLUME_INDEX
    annual: last
    tolerance: 0.05
    targets:
      - {sheet: "ВВП_расходы_МКИ", row: 130}

  - id: compensation_of_employees
    variable: COMPENSATION_EMPLOYEES
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_доходы", row: 27, col_offset: 1, note: "оплата труда, итого по отраслям"}

  - id: consumption_of_fixed_capital
    variable: CAPITAL_CONSUMPTION
    annual: last
    scale: 1.0e-6
    tolerance: 0.6
    targets:
      - {sheet: "ВВП_доходы", row: 27, col_offset: 3, note: "потребление основного капитала, итого по отраслям"}

  - id: employed
    variable: EMPLOYED_TOTAL
    annual: last
    tolerance: 0.6
    targets:
      - {sheet: "Внешние и внутренние факторы", row: 245, note: "занятое население, человек"}
      - {sheet: "Прогнозы ЦГО 2024-29", row: 110, scale: 1.0e-3, tolerance: 0.001, note: "тыс. человек"}

  - id: population
    variable: POPULATION_BNS
    annual: last
    tolerance: 0.6
    targets:
      - {sheet: "Внешние и внутренние факторы", row: 164, note: "среднегодовая численность населения"}

  - id: average_wage
    variable: AVG_WAGE
    annual: last
    tolerance: 0.6
    targets:
      - {sheet: "Прогнозы ЦГО 2024-29", row: 116, note: "среднемесячная заработная плата, тенге"}

  - id: cpi_december
    variable: CPI_YTD                # monthly index, December of previous year = 100
    annual: december
    offset: -100.0                  # the model keeps the December-on-December change in percent
    tolerance: 0.05
    targets:
      - {sheet: "Внешние и внутренние факторы", row: 60, note: "ИПЦ на конец периода, % к декабрю прошлого года"}

  - id: exchange_rate
    variable: EXCHANGE_RATE         # daily official rate; the model keeps the annual average
    annual: mean
    tolerance: 0.05
    targets:
      - {sheet: "Внешние и внутренние факторы", row: 50, note: "среднее по дням; 2024 в модели — 469,21 из другого усреднения"}

  - id: ppp_exchange_rate
    variable: IMF_PPP_EXCHANGE_RATE  # IMF WEO implied PPP conversion rate; the model keeps the whole WEO horizon
    annual: last
    tolerance: 0.01
    years: [1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
            2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030]
    targets:
      - {sheet: "Внешние и внутренние факторы", row: 51, note: "курс тенге к международному доллару"}

  # ---------------------------------------------------------------- item-level series (macro_dims_long.csv.gz)
  # «Факт_БНС» is the model's own input sheet for the fact years: column A holds the item code
  # (A…T, 05…33, ЧН, ВДС, ТП, СП, ВВП), D/E/F the nominal GVA 2023/2024/2025, G/H the volume
  # indices 2024/2025 and M/N the published deflators 2024/2025. Its header is text, so the
  # year columns are given explicitly. These are the cells the production block reads.
  - id: fact_bns_gva_nominal
    dims_variable: GVA_NOMINAL_BY_SECTION
    sheet: "Факт_БНС"
    year_columns: {2023: D, 2024: E, 2025: F}
    item_column: A
    row_range: [7, 60]
    item_aliases: {GVA: "ВДС", NET_TAXES: "ЧН", TAXES: "ТП", SUBSIDIES: "СП", GDP: "ВВП"}
    tolerance: 0.6

  - id: fact_bns_industry_divisions
    dims_variable: GVA_NOMINAL_INDUSTRY_DIVISIONS
    sheet: "Факт_БНС"
    year_columns: {2023: D, 2024: E, 2025: F}
    item_column: A
    row_range: [7, 60]
    tolerance: 0.6

  - id: fact_bns_gva_volume_index
    dims_variable: GVA_VOLUME_INDEX_BY_SECTION
    sheet: "Факт_БНС"
    year_columns: {2024: G, 2025: H}
    years: [2024, 2025]
    item_column: A
    row_range: [7, 60]
    item_aliases: {GVA: "ВДС", NET_TAXES: "ЧН", TAXES: "ТП", SUBSIDIES: "СП", GDP: "ВВП"}
    tolerance: 0.05

  - id: fact_bns_gva_deflator
    dims_variable: GVA_DEFLATOR_BY_SECTION
    sheet: "Факт_БНС"
    year_columns: {2024: M, 2025: N}
    years: [2024, 2025]
    item_column: A
    row_range: [7, 60]
    item_aliases: {GVA: "ВДС", NET_TAXES: "ЧН", TAXES: "ТП", SUBSIDIES: "СП", GDP: "ВВП"}
    tolerance: 0.05


  # ---------------------------------------------------------------- «Факт_КНС»: the second vintage (2026-09-23)
  # Annual values of the quarterly national accounts (QNA_*, files 283162/283161): the SNA-2008 recalculation
  # of 2010–2022 that the dynamic tables do not carry, plus 2023–2025 (equal to Факт_БНС). A sheet of its own that
  # no formula reads; row 1 carries the years (C..R = 2010..2025); five blocks, rows below. Flows are the sum of the
  # four discrete quarters, indices the published «год» value (annual: last on the year-to-date datasets).
  - id: fact_qna_gva_by_section
    dims_variable: QNA_GVA_BY_SECTION
    annual: sum
    sheet: "Факт_КНС"
    years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: {GOODS: 8, A: 9, IND: 10, B: 11, C: 12, D: 13, E: 14, F: 15, SERVICES: 16, G: 17, H: 18, I: 19, J: 20, K: 21, L: 22, M: 23, N: 24, O: 25, P: 26, Q: 27, R: 28, S: 29, T: 30, GVA: 31, NET_TAXES: 32, GDP: 33}
    tolerance: 0.6

  - id: fact_qna_gva_volume_index_by_section_ytd
    dims_variable: QNA_GVA_VOLUME_INDEX_BY_SECTION_YTD
    annual: last
    sheet: "Факт_КНС"
    years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: {GOODS: 37, A: 38, IND: 39, B: 40, C: 41, D: 42, E: 43, F: 44, SERVICES: 45, G: 46, H: 47, I: 48, J: 49, K: 50, L: 51, M: 52, N: 53, O: 54, P: 55, Q: 56, R: 57, S: 58, T: 59, GVA: 60, NET_TAXES: 61, GDP: 62}
    tolerance: 0.05

  - id: fact_qna_gva_deflator_by_section_ytd
    dims_variable: QNA_GVA_DEFLATOR_BY_SECTION_YTD
    annual: last
    sheet: "Факт_КНС"
    years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: {GOODS: 66, A: 67, IND: 68, B: 69, C: 70, D: 71, E: 72, F: 73, SERVICES: 74, G: 75, H: 76, I: 77, J: 78, K: 79, L: 80, M: 81, N: 82, O: 83, P: 84, Q: 85, R: 86, S: 87, T: 88, GVA: 89, NET_TAXES: 90, GDP: 91}
    tolerance: 0.05

  - id: fact_qna_gdp_expenditure
    dims_variable: QNA_GDP_EXPENDITURE
    annual: sum
    sheet: "Факт_КНС"
    years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: {FINAL_CONSUMPTION: 95, HOUSEHOLDS: 96, GOVERNMENT: 97, GOV_INDIVIDUAL: 98, GOV_COLLECTIVE: 99, NPISH: 100, GROSS_CAPITAL_FORMATION: 101, GFCF: 102, INVENTORIES: 103, VALUABLES: 104, NET_EXPORTS: 105, EXPORTS: 106, IMPORTS: 107, STAT_DISCREPANCY: 108, GDP: 109, GDP_PRODUCTION: 110}
    tolerance: 0.6

  - id: fact_qna_gdp_expenditure_volume_index_ytd
    dims_variable: QNA_GDP_EXPENDITURE_VOLUME_INDEX_YTD
    annual: last
    sheet: "Факт_КНС"
    years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: {FINAL_CONSUMPTION: 114, HOUSEHOLDS: 115, GOVERNMENT: 116, GOV_INDIVIDUAL: 117, GOV_COLLECTIVE: 118, NPISH: 119, GROSS_CAPITAL_FORMATION: 120, GFCF: 121, INVENTORIES: 122, VALUABLES: 123, EXPORTS: 124, IMPORTS: 125, GDP: 126, GDP_PRODUCTION: 127}
    tolerance: 0.05

  # Section totals on the production sheets are formulas for the fact years — controls.
  - id: gva_sections_control
    dims_variable: GVA_NOMINAL_BY_SECTION
    sheet: "ВДС_производ_регионы"
    rows_by_item: {A: 3, IND: 57, B: 79, C: 207, D: 953, E: 1023, F: 1067, G: 1090, H: 1115, I: 1144, J: 1166, K: 1196,
                   L: 1218, M: 1240, N: 1262, O: 1284, P: 1306, Q: 1328, R: 1350, S: 1372, T: 1373, GVA: 1374,
                   NET_TAXES: 1375, TAXES: 1397, SUBSIDIES: 1398, GDP: 1399}
    tolerance: 0.6

  - id: gva_volume_index_control
    dims_variable: GVA_VOLUME_INDEX_BY_SECTION
    sheet: "ИФО_производ_регионы"
    rows_by_item: {A: 3, IND: 57, B: 79, C: 207, D: 953, E: 1023, F: 1067, G: 1090, H: 1115, I: 1144, J: 1166, K: 1196,
                   L: 1218, M: 1240, N: 1262, O: 1284, P: 1306, Q: 1328, R: 1350, S: 1372, T: 1373, GVA: 1374, GDP: 1399}
    tolerance: 0.25
    note: "сводные ИФО (ВДС, ВВП) модель считает в постоянных ценах 2023 г., БНС — в ценах прошлого года: расхождение до 0,2 п.п. в 2025 г."

  # Expenditure method: the МКИ sheet holds numbers for 2023–2025 (inputs).
  - id: expenditure_nominal
    dims_variable: GDP_EXPENDITURE_NOMINAL
    sheet: "ВВП_расходы_МКИ"
    rows_by_item: {FINAL_CONSUMPTION: 2, HOUSEHOLDS: 3, GOVERNMENT: 4, GOV_INDIVIDUAL: 5, GOV_COLLECTIVE: 6, NPISH: 7,
                   GROSS_CAPITAL_FORMATION: 8, GFCF: 9, NET_EXPORTS: 57, EXPORTS: 58, IMPORTS: 61, STAT_DISCREPANCY: 64, GDP: 65}
    tolerance: 0.6

  - id: expenditure_volume_index
    dims_variable: GDP_EXPENDITURE_VOLUME_INDEX
    sheet: "ВВП_расходы_МКИ"
    rows_by_item: {FINAL_CONSUMPTION: 71, HOUSEHOLDS: 72, GOVERNMENT: 73, GOV_INDIVIDUAL: 74, GOV_COLLECTIVE: 75, NPISH: 76,
                   GROSS_CAPITAL_FORMATION: 77, GFCF: 78, EXPORTS: 127, IMPORTS: 130, GDP: 134}
    tolerance: 0.05

  - id: expenditure_deflator
    dims_variable: GDP_EXPENDITURE_DEFLATOR
    sheet: "ВВП_расходы_МКИ"
    rows_by_item: {FINAL_CONSUMPTION: 140, HOUSEHOLDS: 141, GOVERNMENT: 142, GOV_INDIVIDUAL: 143, GOV_COLLECTIVE: 144, NPISH: 145,
                   GROSS_CAPITAL_FORMATION: 146, GFCF: 147, INVENTORIES: 151, EXPORTS: 153, IMPORTS: 156, GDP: 160}
    tolerance: 0.05

  # Income method: one block of five columns per year (ВДС, оплата труда, другие налоги, ПОК, прибыль).
  - id: income_compensation
    dims_variable: INCOME_COMPENSATION_BY_SECTION
    sheet: "ВВП_доходы"
    col_offset: 1
    rows_by_item: &income_rows {GOODS: 3, A: 4, IND: 5, B: 6, C: 7, D: 8, E: 9, F: 10, SERVICES: 11, G: 12, H: 13, I: 14, J: 15,
                                K: 16, L: 17, M: 18, N: 19, O: 20, P: 21, Q: 22, R: 23, S: 24, T: 25, TOTAL: 27}
    tolerance: 0.6

  - id: income_other_taxes
    dims_variable: INCOME_OTHER_TAXES_BY_SECTION
    sheet: "ВВП_доходы"
    col_offset: 2
    # BNS's «Итого по отраслям» in table 4452 includes the net taxes on products row, so it
    # equals the model's row 30 (ВВП методом доходов), not row 27 (sum of the sections).
    rows_by_item: {GOODS: 3, A: 4, IND: 5, B: 6, C: 7, D: 8, E: 9, F: 10, SERVICES: 11, G: 12, H: 13, I: 14, J: 15,
                   K: 16, L: 17, M: 18, N: 19, O: 20, P: 21, Q: 22, R: 23, S: 24, T: 25, NET_TAXES: 28, TOTAL: 30}
    tolerance: 0.6

  - id: income_cfc
    dims_variable: INCOME_CFC_BY_SECTION
    sheet: "ВВП_доходы"
    col_offset: 3
    rows_by_item: *income_rows
    tolerance: 0.6

  - id: income_profit
    dims_variable: INCOME_PROFIT_BY_SECTION
    sheet: "ВВП_доходы"
    col_offset: 4
    rows_by_item: *income_rows
    tolerance: 0.6

  # Non-observed economy: two columns per year (всего, в т.ч. незаконная).
  - id: noe_share
    dims_variable: NOE_SHARE_BY_SECTION
    sheet: "Ненаблюд_незакон_экономика"
    col_offset: 0
    rows_by_item: &noe_rows {GOODS: 3, A: 4, B: 6, C: 7, D: 8, E: 9, F: 10, SERVICES: 11, G: 12, H: 13, I: 14, J: 15, K: 16,
                             L: 17, M: 18, N: 19, O: 20, P: 21, Q: 22, R: 23, S: 24, T: 25, TOTAL: 26}
    tolerance: 0.005

  - id: noe_illegal_share
    dims_variable: NOE_ILLEGAL_SHARE_BY_SECTION
    sheet: "Ненаблюд_незакон_экономика"
    col_offset: 1
    rows_by_item: *noe_rows
    tolerance: 0.005

  # Ownership: four columns per year (ВДС, государственная, частная, других государств), 2010–2025.
  - id: ownership_state
    dims_variable: GVA_STATE_BY_SECTION
    sheet: "ВДС_формы_собственности"
    col_offset: 1
    years: &ownership_years [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    rows_by_item: &ownership_rows {A: 4, B: 6, C: 7, D: 8, E: 9, F: 10, G: 12, H: 13, I: 14, J: 15, K: 16, L: 17, M: 18,
                                   N: 19, O: 20, P: 21, Q: 22, R: 23, S: 24, T: 25, TOTAL: 26}
    tolerance: 0.06

  - id: ownership_private
    dims_variable: GVA_PRIVATE_BY_SECTION
    sheet: "ВДС_формы_собственности"
    col_offset: 2
    years: *ownership_years
    rows_by_item: *ownership_rows
    tolerance: 0.06

  - id: ownership_foreign
    dims_variable: GVA_FOREIGN_BY_SECTION
    sheet: "ВДС_формы_собственности"
    col_offset: 3
    years: *ownership_years
    rows_by_item: *ownership_rows
    tolerance: 0.06

  # ---------------------------------------------------------------- regional series (phase 2)
  # `blocks` names the row range holding the region rows under each item; the region
  # names are read from `region_column` and resolved through dictionaries/regions.csv.
  # Production sheets: 21 region rows (20 regions of 2022 plus the closed Южно-Казахстанская)
  # under each section heading; 2024–2025 region rows are numbers (inputs), 2026+ formulas.
  - id: vrp_regions_sections
    dims_variable: GVA_NOMINAL_BY_REGION_SECTION
    sheet: "ВДС_производ_регионы"
    region_column: B
    blocks: &production_blocks
      A: [4, 24]
      IND: [58, 78]
      B: [80, 100]
      C: [208, 228]
      D: [954, 974]
      E: [1024, 1044]
      F: [1068, 1088]
      G: [1091, 1111]
      H: [1116, 1136]
      I: [1145, 1165]
      J: [1167, 1187]
      K: [1197, 1217]
      L: [1219, 1239]
      M: [1241, 1261]
      N: [1263, 1283]
      O: [1285, 1305]
      P: [1307, 1327]
      Q: [1329, 1349]
      R: [1351, 1371]
      NET_TAXES: [1376, 1396]
      GDP: [1400, 1420]
    tolerance: 0.6

  - id: ifo_regions_sections
    dims_variable: GVA_VOLUME_INDEX_BY_REGION_SECTION
    sheet: "ИФО_производ_регионы"
    region_column: B
    blocks: {A: [4, 24], IND: [58, 78], B: [80, 100], C: [208, 228], D: [954, 974], E: [1024, 1044], F: [1068, 1088],
             G: [1091, 1111], H: [1116, 1136], J: [1167, 1187], L: [1219, 1239]}
    tolerance: 0.05

  - id: grp_ifo_regions
    dims_variable: GRP_VOLUME_INDEX_BY_REGION
    sheet: "ИФО_производ_регионы"
    region_column: B
    blocks: {GDP: [1400, 1420]}
    tolerance: 0.05

  # «Факторы»: population and labour by region, one block per indicator (row 164 and the
  # like are the national totals, already covered by the scalar mappings above).
  - id: population_regions
    dims_variable: POPULATION_AVG_BY_REGION
    sheet: "Внешние и внутренние факторы"
    region_column: A

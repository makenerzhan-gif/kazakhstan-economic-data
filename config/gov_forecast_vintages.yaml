# Macroeconomic forecast of the Government of Kazakhstan («Прогноз социально-экономического развития», ПСЭР, Ministry
# of National Economy): the scenario conditions of every vintage found, 2015-2026. Hand-maintained: the forecast is
# approved by a protocol decision of the Government (not an adilet act), published on gov.kz only as PDF/DOCX
# appendices whose layout changes every few years, and found there unreliably (the 2027-2029 forecast is filed under
# an unrelated record, 1060939). One new vintage each August plus 0-2 amendments a year: add it here by hand.
# Read by scripts/fetchers/manual_vintages.py (dataset GOV_MACRO_FORECAST_VINTAGES).
#
# Per year: gdp_kzt_bn (nominal GDP, bn KZT), real_gdp (% of previous year), gdp_usd_bn, usdkzt (= gdp_kzt / gdp_usd:
# the forecast gives no exchange-rate row, GDP in dollars is "по расчётному курсу"; in a forecast year it comes out
# round, which checks the transcription), brent ($/bbl, base scenario), cpi ([low, high], % Dec/Dec, the target band),
# oil_mt (oil and condensate output, Mt; the row was dropped from the 2026-2028 vintage on). The first year of a vintage
# is the Government's estimate for the current year. Values transcribed 2026-11-07 from the appendices
# («Приложение 1 к Прогнозу…»); the 2023-08 and 2024-08 vintages from the English DOCX annex.


name: Natural capital sources (BNS SEEA asset accounts, Red Book 2026)

# On-demand fetch, separate from the daily pipeline (update.yml) so it runs in minutes,
# not hours. Triggered manually or by a push touching the fetcher itself.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: 'fetch_resource_history parts to run (space-separated; empty = all)'
        required: false
        default: ''
  schedule:
    - cron: "17 3 5 * *"   # monthly, 5th day 03:17 UTC: Taldau monthly release, Comtrade revisions
  push:
    paths:
      - scripts/build_resource_panel.py
      - scripts/qa_resources.py
      - scripts/usgs_myb_parse.py
      - scripts/fetch_natural_capital.py
      - scripts/fetch_resource_history.py
      - config/resource_history_parts.txt
      - scripts/fetch_taldau_resources.py
      - .github/workflows/natural-capital.yml

concurrency:
  group: natural-capital
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31" "pypdf>=4.0" "openpyxl>=3.1" "xlrd>=2.0"

      - name: Fetch
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_natural_capital.py

      - name: Long historical resource series (EI, EIA, World Bank, Comtrade, USGS)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_resource_history.py ${{ github.event.inputs.parts }}

      - name: Taldau natural-resource series
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_taldau_resources.py

      - name: Harmonised panel and quality checks
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install xlrd >/dev/null
          python scripts/build_resource_panel.py
          cat reports/resource_qa.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the Red Book PDF and raw files as an artifact (not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-capital-${{ github.run_id }}
          path: |
            tmp_natural_capital/
            data/raw/resource_history/
            data/raw/bns_seea/
            data/raw/nea/
            reports/natural_capital_fetch.json
          if-no-files-found: ignore

      - name: Commit and push extracts
        if: always()
        run: |
          git config user.name "kz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git config lfs.locksverify false
          git add data/raw/bns_seea/ data/raw/nea/ data/raw/resource_history/ data/raw/taldau_resources/ reports/natural_capital_fetch.json reports/resource_history_fetch.json reports/taldau_resources.json data/processed/natural_resources/ reports/resource_qa.json reports/resource_qa.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Natural capital fetch $(date -u +'%Y-%m-%d %H:%M')"
          BRANCH="${GITHUB_REF_NAME}"
          for delay in 0 30 120; do
            sleep "$delay"
            git pull --rebase -X theirs origin "$BRANCH" || { git rebase --abort 2>/dev/null; continue; }
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo "::error::push failed"
          exit 1

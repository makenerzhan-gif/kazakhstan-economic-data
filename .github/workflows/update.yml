name: Update Kazakhstan Economic Data

on:
  schedule:
    # Twice a week, Wednesday and Saturday, 06:00 UTC (11:00 Astana) -- the owner's decision of
    # 2026-11-13; the run was daily before. A full run takes well over an hour and most sources
    # are monthly or quarterly. Daily series (exchange rate, TONIA, KASE) lose nothing: every run
    # downloads their history, so the days between runs are filled in at the next one. A release
    # reaches the repository up to four days late; run the workflow by hand (workflow_dispatch)
    # when a figure is needed the same day.
    - cron: "0 6 * * 3,6"
  workflow_dispatch: {}

# One run at a time. Two overlapping runs (the daily one and a manual re-run on
# 2026-09-15) both edited the same dated manifests and report, and the later one's
# rebase in "Commit and push" hit content conflicts and failed after a full 68-minute
# pipeline. Queued runs start from the previous run's commit, so nothing to conflict.
concurrency:
  group: update-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write      # the "Report problems" step opens an issue when datasets fail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # restore pip's download cache keyed on requirements.txt (about a minute a run)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the X-13 binary (the one LFS file the run needs)
        # The checkout leaves LFS files as pointers (the archived workbooks are 1 GB). The
        # model_data build needs tools/x13as/x13as_ascii; without it scripts/lib/x13.py downloads
        # the same build from census.gov, so a failure here is not fatal.
        continue-on-error: true
        run: git lfs pull --include "tools/x13as/x13as_ascii"

      - name: Run pipeline
        env:
          # Populate with `secrets.<NAME>` here if/when any source ends up requiring
          # an API key. Never hardcode a key in this file or in raw data.
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_all.py

      - name: Upload diagnostics artifact
        # Runs regardless of whether "Run pipeline" succeeded or failed -- this is what
        # actually fixes the observability gap. Without `if: always()`, GitHub Actions
        # skips every subsequent step once a step fails, so logs/ and reports/ written
        # by update_all.py on the runner's disk were previously lost when the runner
        # was torn down (never committed, since "Commit and push" below only runs on
        # success, and never uploaded anywhere else). This step does not touch the
        # pipeline's exit code or the repository -- it only copies logs/ and reports/
        # (if present) into a downloadable build artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kz-economic-data-diagnostics-${{ github.run_id }}
          path: |
            logs/
            reports/

      - name: Commit and push if there are changes
        run: |
          git config user.name "kz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # This repo never uses LFS file locking, but for a github.com remote
          # git-lfs asks the server to verify locks before every push carrying LFS
          # objects, and any error there aborts the push. On 2026-10-07 that request
          # fell into GitHub's 15:06-15:16 UTC outage ("Fatal error: Unable to verify
          # locks") and the whole run's output was lost. Skip the check.
          git config lfs.locksverify false
          # logs/ is not committed (2026-11-13): 1.5 MB a run, 79 MB by then, and the same files
          # are in this run's diagnostics artifact. The report (reports/) carries what matters.
          git add data/ metadata/ dictionaries/ project_knowledge/ reports/ model_data/ docs/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated data update $(date -u +'%Y-%m-%d')"
            # This job takes ~1.5-2h end to end; a push to main from elsewhere
            # during that window (a human commit, an overlapping manual run)
            # makes a plain `git push` fail with "rejected (fetch first)" --
            # happened for real on 2026-09-04, twice, losing both runs' output.
            # Rebase onto the current origin/main right before pushing rather
            # than failing the whole run over a race a replay resolves cleanly
            # in the common case: this step's own add-list never touches
            # project_knowledge/UPDATE_LOG.md's content or anything under
            # scripts/, so a genuine conflict here would mean something worth
            # a human looking at, not routine noise to suppress.
            #
            # The push itself can also fail on GitHub's side (the 2026-10-07 outage
            # above; git operations were degraded again until ~15:50), so retry for
            # about half an hour, rebasing again each time in case main moved. A
            # rebase conflict is not retried: it needs a human, as above.
            for delay in 0 60 180 600 1200; do
              sleep "$delay"
              if ! git pull --rebase origin main; then
                if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                  git rebase --abort
                  echo "::error::Rebase onto origin/main conflicts; not pushing."
                  exit 1
                fi
                echo "Pull failed; retrying."
                continue
              fi
              if git push; then
                exit 0
              fi
              echo "Push failed; retrying."
            done
            echo "::error::Push still failing after 5 attempts."
            exit 1
          fi

      - name: Report problems in an issue
        # Runs whatever happened above. Opens an issue (or comments on the open one) when the run
        # failed or datasets kept their previous data -- before 2026-11-13 that was visible only
        # to someone who opened the Actions page. A clean run posts nothing.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python scripts/run_issue.py "${{ job.status }}" "$RUN_URL" > issue_body.md
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then echo "Nothing to report."; exit 0; fi
          if [ "$code" -ne 0 ]; then echo "::warning::run_issue.py failed ($code)"; exit 0; fi
          gh label create pipeline-run --color B60205 --description "Problems found by a data run" 2>/dev/null || true
          open=$(gh issue list --label pipeline-run --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue_body.md
          else
            gh issue create --label pipeline-run --title "Прогон $(date -u +'%Y-%m-%d'): есть ошибки" --body-file issue_body.md
          fi

name: Update Kazakhstan Economic Data

on:
  schedule:
    # Daily at 06:00 UTC (~11:00/12:00 Almaty time) to catch the daily NBK USD/KZT
    # rate and base-rate feed promptly. Monthly/quarterly BNS, Minfin and annual IMF
    # series don't change this often, but re-checking daily is cheap (the job is a
    # no-op commit-wise unless something actually changed) and guarantees we never
    # miss a monthly/quarterly release by more than a day.
    # TODO once NBK's publication calendar and BNS/Minfin release patterns are
    # confirmed by the source-research step: consider narrowing this if daily runs
    # turn out to be wasteful, or split into a separate faster cron for EXCHANGE_RATE.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Populate with `secrets.<NAME>` here if/when any source ends up requiring
          # an API key. Never hardcode a key in this file or in raw data.
          PYTHONUNBUFFERED: "1"
        run: python scripts/update_all.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "kz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ metadata/ dictionaries/ project_knowledge/ reports/ logs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated data update $(date -u +'%Y-%m-%d')"
            git push
          fi
